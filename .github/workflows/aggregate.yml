name: Aggregate Stats

# 说明：
#   主链路已改为 Worker 在每份答卷写入后立即重算 stats.json（见 worker/src/index.js）。
#   这个工作流保留为「兜底 + 校正」：万一 Worker 那边写失败，这里跑一次全量重算就能对齐。
#   注意 GitHub 对本仓库的 schedule 有严重限流（配每2小时，实测平均6小时），不要依赖它做实时性。

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate-stats
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch results branch
        run: git fetch origin results:refs/remotes/origin/results --depth=1 || true

      - name: Recompute stats (full, idempotent)
        run: python3 aggregate_stats.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit（数据无变化）"
            exit 0
          fi
          git commit -m "aggregate: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Worker 也会在每份答卷后写 stats.json，先变基再推，避免 non-fast-forward
          git pull --rebase origin main
          git push