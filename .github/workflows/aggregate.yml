name: Aggregate Stats (fallback)

# 说明：
#   实时统计已由 Worker 负责（每份答卷写入后立刻用 git trees 全量重算 stats.json）。
#   这个工作流只是「兜底校正」：万一 Worker 那边写失败，跑一次全量重算就能对齐。
#
#   注意：
#   1. GitHub 对本仓库的 schedule 有严重限流（配每2小时，实测平均6小时），不要依赖它做实时性
#   2. Worker 也在写 stats.json，直接 commit + pull --rebase 会撞车导致任务失败并发邮件；
#      所以这里改成「每次重试都 reset 到最新 main 再重算」，重算本身是幂等的

on:
  schedule:
    - cron: '0 3 * * *'   # 每天一次兜底校正
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate-stats
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch results branch
        run: git fetch origin results:refs/remotes/origin/results --depth=1 || true

      - name: Recompute & push (retry on conflict)
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            # 每次都基于最新 main 重算：既避免和 Worker 的提交撞车，又因为是全量重算所以幂等
            git fetch origin main
            git reset --hard origin/main
            python3 aggregate_stats.py

            git add stats.json
            if git diff --cached --quiet; then
              echo "统计已是最新，无需提交"
              exit 0
            fi

            git commit -m "aggregate: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if git push origin HEAD:main; then
              echo "已更新 stats.json（第 $i 次尝试）"
              exit 0
            fi

            echo "第 $i 次推送失败（多半是与 Worker 的提交撞车），3 秒后重试…"
            sleep 3
          done

          # 兜底连续失败也不让任务变红：实时统计由 Worker 维护，这里只是校正
          echo "::warning::兜底聚合 3 次推送均失败；实时统计由 Worker 维护，本次跳过"
          exit 0