name: Aggregate Stats
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git log

      - name: Run aggregation
        run: python3 aggregate_stats.py

      - name: Commit and push
        run: |
          git config user.name 'YCTI Bot'
          git config user.email 'bot@ycti.fun'
          git add stats.json last_aggregation.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: aggregate stats"
            git push
          fi