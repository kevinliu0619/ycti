<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YCTI · 摇曳露营人格测试</title>
<style>
:root {
  --bg-deep: #0d0d1f;
  --bg: #141428;
  --card: #1e1e38;
  --card-hover: #28284a;
  --warm: #e8a850;
  --warm-glow: #f0c070;
  --fire: #f4a261;
  --text: #e8e0d8;
  --muted: #9a8c7a;
  --accent: #7aa87d;
  --border: #333350;
  --shadow: rgba(0,0,0,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Noto Sans JP", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0d0d1f 0%, #141428 25%, #0a0a18 45%, #010108 60%, #010108 100%);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  line-height: 1.6;
  position: relative;
  overflow: hidden;
}
/* Stars */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 85% 10%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 60% 28%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 35% 38%, rgba(255,255,255,.25), transparent),
    radial-gradient(1.5px 1.5px at 78% 40%, rgba(255,255,255,.35), transparent);
  pointer-events: none; z-index: 0;
}
#app {
  width: 100%;
  max-width: 480px;
  position: relative;
  z-index: 1;
}
.screen { display: none; animation: fadeSlide .4s ease; }
.screen.active { display: block; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Start Screen */
.start-screen { text-align: center; padding: 8px 0 0; }
.start-screen .camp-icon { font-size: 40px; margin-bottom: 4px; }
.start-screen h1 {
  font-size: 28px; font-weight: 800; color: var(--warm);
  letter-spacing: 6px; margin-bottom: 2px;
  text-shadow: 0 0 20px rgba(232,168,80,.25);
}
.start-screen .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 6px; }
.start-screen .subtitle-cn { font-size: 13px; color: var(--warm); letter-spacing: 2px; margin-bottom: 60px; }

.btn {
  display: inline-block;
  padding: 14px 48px;
  border-radius: 32px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--warm), #d49540);
  color: #1a1a2e;
  box-shadow: 0 4px 20px rgba(232,168,80,.25);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--warm-glow), var(--warm));
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(232,168,80,.35);
}
.btn-primary:active { transform: translateY(0) scale(.98); }
.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--card-hover); border-color: #555; }

.btn-outline {
  background: transparent;
  color: var(--warm);
  border: 1px solid var(--warm);
  opacity: 0.8;
}
.btn-outline:hover { background: rgba(232,168,80,0.1); border-color: var(--warm-glow); opacity: 1; }

/* Quiz Screen */
.quiz-screen { padding: 16px 0; }
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--warm), var(--fire));
  border-radius: 2px;
  transition: width .4s ease;
  box-shadow: 0 0 8px rgba(232,168,80,.3);
}
.question-counter {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.question-text {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 28px;
  line-height: 1.7;
  color: var(--text);
  min-height: 60px;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  width: 100%;
  padding: 16px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-align: left;
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  transition: all .2s ease;
  font-family: inherit;
  line-height: 1.5;
  position: relative;
}
.option:hover {
  border-color: var(--warm);
  background: var(--card-hover);
  transform: translateX(4px);
  box-shadow: 0 2px 12px rgba(232,168,80,.1);
}
.option:active { transform: scale(.98) translateX(4px); }
.option.selected { border-color: var(--warm); background: rgba(232,168,80,.12); }

/* Result Screen */
.result-screen { text-align: center; padding: 0 0 24px; }

/* Hero Image — full-bleed edge-to-edge, flush with viewport top */
.result-hero {
  width: 100vw;
  margin-top: -16px;
  margin-left: calc(-50vw + 50%);
  margin-right: calc(-50vw + 50%);
  aspect-ratio: 16 / 9;
  background: var(--card);
  border-radius: 0;
  overflow: hidden;
  position: relative;
}
.result-hero img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.result-hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(transparent, var(--bg));
  pointer-events: none;
}

/* Result theme colors — text only, no background */
.result-screen.theme-rin .result-code { color: #7eb8da; text-shadow: 0 0 30px rgba(126,184,218,.3); }
.result-screen.theme-rin .result-badge { color: #7eb8da; }
.result-screen.theme-nadeshiko .result-code { color: #e8a0b0; text-shadow: 0 0 30px rgba(232,160,176,.3); }
.result-screen.theme-nadeshiko .result-badge { color: #e8a0b0; }
.result-screen.theme-chiaki .result-code { color: #b89ad4; text-shadow: 0 0 30px rgba(184,154,212,.3); }
.result-screen.theme-chiaki .result-badge { color: #b89ad4; }
.result-screen.theme-aoi .result-code { color: #a8b878; text-shadow: 0 0 30px rgba(168,184,120,.3); }
.result-screen.theme-aoi .result-badge { color: #a8b878; }
.result-screen.theme-ena .result-code { color: #c0b8a8; text-shadow: 0 0 30px rgba(192,184,168,.3); }
.result-screen.theme-ena .result-badge { color: #c0b8a8; }
.result-screen.theme-easter .result-code { color: #d4b840; text-shadow: 0 0 30px rgba(212,184,64,.4); }
.result-screen.theme-easter .result-badge { color: #d4b840; }

.result-badge {
  font-size: 11px; letter-spacing: 3px;
  margin: 14px 0 6px; text-transform: uppercase;
}
.result-code {
  font-size: 52px; font-weight: 800; color: var(--warm);
  letter-spacing: 6px; margin-bottom: 4px;
  text-shadow: 0 0 30px rgba(232,168,80,.3);
  animation: codeReveal .6s ease;
}
@keyframes codeReveal {
  from { opacity: 0; transform: scale(.8); letter-spacing: 20px; }
  to { opacity: 1; transform: scale(1); letter-spacing: 6px; }
}
.result-role { font-size: 18px; color: var(--text); margin-bottom: 14px; }
.result-quote {
  font-size: 14px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 16px;
  line-height: 1.7;
  padding: 0 12px;
  position: relative;
}
.result-desc {
  font-size: 13px;
  color: var(--text);
  text-align: left;
  line-height: 1.8;
  padding: 16px;
  background: var(--card);
  border-radius: 14px;
  margin: 0 12px 14px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px var(--shadow);
}
.result-partner {
  font-size: 13px;
  color: var(--muted);
  margin: 0 12px 20px;
  line-height: 1.7;
  background: var(--card);
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px dashed var(--border);
}
.result-partner strong { color: var(--warm); }
.result-actions { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: nowrap; margin: 0 12px 6px; }
.result-actions .btn { padding: 11px 0; font-size: 14px; flex: 1; }
.result-actions .btn-icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
}
.result-actions .btn-icon:hover { background: var(--card-hover); }
.result-actions .btn-icon:active { transform: scale(.95); }

/* Easter Egg */
.easter-tag {
  display: inline-block;
  padding: 5px 14px;
  background: rgba(232,168,80,.15);
  color: var(--warm);
  border-radius: 12px;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  border: 1px solid rgba(232,168,80,.3);
  animation: easterGlow 2s ease-in-out infinite;
}
@keyframes easterGlow {
  0%,100% { box-shadow: 0 0 8px rgba(232,168,80,.1); }
  50% { box-shadow: 0 0 18px rgba(232,168,80,.25); }
}

/* Author Credit */
.author-credit {
  font-size: 11px;
  color: rgba(255,255,255,.18);
  text-align: center;
  margin-top: 10px;
  letter-spacing: 1px;
}
.version-tag {
  font-size: 9px;
  color: rgba(255,255,255,.10);
  text-align: center;
  margin-top: 2px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  color: var(--text);
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 100;
  box-shadow: 0 4px 16px var(--shadow);
}
.toast.show { opacity: 1; }

/* Canvas hidden */


/* ===== Share Modal ===== */
.share-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.75);
  z-index: 200;
  justify-content: center; align-items: center;
  padding: 20px;
}
.share-overlay.show { display: flex; }
.share-modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px 24px;
  max-width: 360px; width: 100%;
  text-align: center;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,.5);
}
.share-close {
  position: absolute; top: 12px; right: 16px;
  background: none; border: none;
  color: var(--muted); font-size: 22px;
  cursor: pointer; line-height: 1;
}
.share-modal .share-title {
  font-size: 13px; color: var(--warm);
  letter-spacing: 2px; margin-bottom: 16px;
}
.share-modal .share-code {
  font-size: 36px; font-weight: 800;
  letter-spacing: 6px;
  margin-bottom: 4px;
}
.share-modal .share-tag {
  font-size: 16px; color: var(--text);
  margin-bottom: 8px;
}
.share-modal .share-quote {
  font-size: 12px; color: var(--muted);
  font-style: italic;
  margin-bottom: 20px;
  line-height: 1.6;
  padding: 0 12px;
}
.share-qr-row {
  display: flex;
  gap: 16px;
  justify-content: center;
  align-items: flex-start;
  margin-bottom: 20px;
}
.share-qr-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.share-qr-title {
  font-size: 11px;
  color: rgba(255,255,255,.5);
  text-align: center;
  letter-spacing: 1px;
}
.share-qr-card {
  background: #fff;
  border-radius: 12px;
  display: inline-block;
}
.share-qr-card img {
  display: block;
  width: 90px; height: 90px;
}
.share-qr-label {
  font-size: 11px;
  color: rgba(255,255,255,.3);
  text-align: center;
  letter-spacing: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.share-qr-label .xhs-logo {
  height: 14px; width: auto;
}
.share-qr-divider {
  width: 1px;
  background: rgba(255,255,255,.08);
  align-self: center;
  height: 60%;
  margin: 0 4px;
}
.share-modal .share-hint {
  font-size: 13px; color: var(--text);
  margin-bottom: 8px;
}

/* Homepage animation */
.video-wrapper {
  width: 100%;
  margin: 36px 0 0;
  padding: 0;
  aspect-ratio: 4 / 3;
}
.home-video {
  width: 100%;
  height: auto;
  display: block;
  margin: 0;
  background: #010108;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  position: relative;
  z-index: 1;
  object-fit: contain;
}

/* Bottom bar (author + version) */
.bottom-bar {
  font-size: 11px;
  color: rgba(255,255,255,.15);
  text-align: center;
  padding: 16px 0 4px;
  letter-spacing: 1px;
}

/* Loading overlay spinner */
.load-spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(232,168,80,0.15);
  border-top-color: #e8a850;
  border-radius: 50%;
  animation: lspin 0.7s linear infinite;
}
@keyframes lspin { to { transform: rotate(360deg); } }

.lang-switch {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 300;
  background: transparent;
  border: 1px solid rgba(128,128,128,0.15);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  opacity: 0.65;
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Noto Sans JP", "Microsoft YaHei", sans-serif;
}
.lang-switch:hover, .lang-switch:active, .lang-switch:focus { outline: none; }


/* ===== 结果页前的流星雨（分析动画） ===== */
#analysisFx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:210;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh}
#analysisFx::before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background-image:radial-gradient(1.3px 1.3px at 30px 40px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 150px 95px,rgba(255,255,255,.38),transparent),radial-gradient(1.5px 1.5px at 95px 170px,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 210px 30px,rgba(255,255,255,.26),transparent);background-size:260px 260px;opacity:.85}
#analysisFx .fx-rain{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none}
.fx-m{position:absolute;font-weight:700;line-height:1;white-space:nowrap;will-change:transform,opacity;animation-name:fxFly;animation-timing-function:linear;animation-fill-mode:both;text-shadow:0 0 4px currentColor,0 0 12px currentColor,0 0 22px currentColor}
.fx-m::after{content:'';position:absolute;left:100%;top:50%;width:120px;height:9px;margin-top:-4.5px;background:linear-gradient(90deg,currentColor,rgba(255,255,255,0));-webkit-clip-path:polygon(0 0,100% 50%,0 100%);clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:0 50%;transform:rotate(-45deg);opacity:.92}
.fx-tip{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--warm);font-size:15px;font-weight:500;letter-spacing:2px;opacity:.9;text-shadow:0 0 10px rgba(0,0,0,.85),0 0 24px rgba(0,0,0,.7)}
.fx-btn{position:relative;z-index:2;background:var(--warm);color:#191919;border:none;border-radius:999px;padding:13px 34px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease}
.fx-btn.show{opacity:1;transform:translateY(0)}
#analysisFx{transition:opacity .9s ease}
#analysisFx.fx-out{opacity:0}
</style>
</head>
<body>

<button class="lang-switch" id="langSwitch" onclick="toggleLang()">日本語</button>
<div id="app">
  <!-- Start Screen -->
  <div class="screen active" id="startScreen">
    <div class="start-screen">
      <div class="camp-icon">🏕️</div>
      <h1>YCTI</h1>
      <div class="subtitle">Yuru Camp Type Indicator</div>
      <div class="subtitle-cn" data-i18n="subtitleCn">摇曳露营人格测试</div>
      <button class="btn btn-primary" onclick="startQuiz()" data-i18n="startBtn">开始测试</button>
      <div class="video-wrapper"><video id="homeVideo" class="home-video" data-src="home.mp4" poster="home-poster.webp" preload="none" width="960" height="720" autoplay loop muted playsinline webkit-playsinline x5-video-player-type="h5-page" x5-video-player-fullscreen="false" disableRemotePlayback disablePictureInPicture></video></div>
      <div class="bottom-bar">@悠哉日常大囧 · YCTI.FUN · v0.22.4</div>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div class="screen" id="quizScreen">
    <div class="quiz-screen">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="question-counter" id="qCounter"></div>
      <div class="question-text" id="qText"></div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="resultScreen">
    <div class="result-screen">
      <div class="result-hero" id="resultHero"><img src="" alt=""></div>
      <div id="easterTag"></div>
      <div class="result-badge" id="resultBadge"></div>
      <div class="result-code" id="resultCode"></div>
      <div class="result-role" id="resultRole"></div>
      <div class="result-quote" id="resultQuote"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="result-partner" id="resultPartner"></div>
      <div class="result-actions">

<script>
// ============================================================
// WeChat / QQ video autoplay fix
// ============================================================
(function() {
  try {
    var v = document.getElementById('homeVideo');
    if (!v) return;
    // poster set via HTML attribute, no JS needed
    var playPromise = v.play();
    if (playPromise !== undefined) {
      playPromise.catch(function() {
        function doPlay() { try { v.play().catch(function(){}); } catch(e) {} }
        if (typeof WeixinJSBridge !== 'undefined') {
          try { WeixinJSBridge.invoke('getNetworkType', {}, doPlay); } catch(e) {}
        }
        document.addEventListener('WeixinJSBridgeReady', doPlay, {once:true});
        document.addEventListener('touchstart', doPlay, {once:true});
        document.addEventListener('click', doPlay, {once:true});
      });
    }
  } catch(e) {}
})();
// ============================================================
// 统计后端：读走 GitHub raw，写走 Cloudflare Worker 代理（前端零密钥）
// ============================================================
const GH_REPO = 'kevinliu0619/ycti';
const GH_STATS_FILE = 'stats.json';
// 写入走 Cloudflare Worker 代理，GitHub PAT 只存在服务端，前端不再持有任何密钥
const API_BASE = 'https://api.ycti.fun';


// 读：走 raw.githubusercontent（无限速、CORS 开放、5分钟缓存），失败再退到匿名 api
// 注意：读取不携带任何凭据 —— 失效/未授权的凭据会被 GitHub 静默降级成匿名
//       （X-RateLimit-Limit: 60），份额度极易被共享出口 IP 烧光而返回 403。
// 全部通道失败时抛错，由 loadStats 显示"加载失败"，不再伪装成"还没有人做过测试"。
async function ghStatsRead() {
  var bust = '?t=' + Date.now();
  var urls = [
    API_BASE + '/stats' + bust,
    'https://raw.githubusercontent.com/' + GH_REPO + '/main/' + GH_STATS_FILE + bust,
    'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE + bust
  ];
  var lastErr = null;
  for (var i = 0; i < urls.length; i++) {
    var ctl = null, timer = null;
    try {
      if (typeof AbortController !== 'undefined') {
        ctl = new AbortController();
        timer = setTimeout(function() { ctl.abort(); }, 10000);
      }
      var resp = await fetch(urls[i], {
        cache: 'no-store',
        signal: ctl ? ctl.signal : undefined,
        headers: { 'Accept': 'application/vnd.github+json' }
      });
      if (timer) { clearTimeout(timer); timer = null; }
      if (!resp.ok) { lastErr = new Error('stats read HTTP ' + resp.status); continue; }
      if (i < 2) return await resp.json();
      var d = await resp.json();
      return JSON.parse(atob(String(d.content || '').replace(/\s/g, '')));
    } catch (e) {
      if (timer) { clearTimeout(timer); timer = null; }
      lastErr = e;
    }
  }
  throw lastErr || new Error('stats read failed');
}

// === Stats Write: independent result files (zero conflict) ===
// Each test writes: results/YYYY-MM-DD/timestamp_rand_CODE.json
// Aggregated every 5 min by GitHub Actions → stats.json

function queueResult(code, lang) {
  try {
    var k='ycti_pending', a=JSON.parse(localStorage.getItem(k)||'[]');
    a.push({code:code, ts:Math.floor(Date.now()/1000), lang:lang||currentLang});
    localStorage.setItem(k, JSON.stringify(a));
  } catch(e) {}
}

async function writeOneResult(code, lang) {
  // 写入口：Cloudflare Worker → GitHub results 分支（PAT 在服务端）
  try {
    var resp = await fetch(API_BASE + '/r', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, lang: lang || currentLang })
    });
    if (!resp.ok) return false;
    var d = await resp.json();
    return !!d.ok;
  } catch (e) {
    return false;
  }
}

async function ghStatsSubmit(personality) {
  // Flush pending queue first
  try {
    var k='ycti_pending', pending=JSON.parse(localStorage.getItem(k)||'[]');
    if(pending.length) {
      var remaining=[];
      for(var i=0;i<pending.length;i++) {
        if(!(await writeOneResult(pending[i].code, pending[i].lang))) remaining.push(pending[i]);
      }
      localStorage.setItem(k, remaining.length?JSON.stringify(remaining):'');
    }
  } catch(e) {}
  // Write current result
  try {
    if(!(await writeOneResult(personality, currentLang))) queueResult(personality, currentLang);
  } catch(e) { console.warn('stats submit error:',e); queueResult(personality, currentLang); }
}

  BROKE: { code:'BROKE', role:{zh:'千明',ja:'ちあき'}, tag:{zh:'穷鬼千明',ja:'貧乏ちあき'},  quote:{zh:'700日元！买了个爹！',ja:'700円で！親父を買った！'}, desc:{zh:'你的露营装备几乎全是二手店淘的。你买过700日元的木碗（后来变成了仙人掌盆），用劣化吊床替代露营椅，自制的熏制器用纸箱做的。你不觉得穷是问题——你觉得穷是创意的催化剂。',ja:'あなたのキャンプ道具はほぼ全てリサイクルショップで見つけたもの。700円の木のボウルを買ったこともある（後にサボテンの鉢になった）。劣化したハンモックをキャンプチェア代わりにし、自作の燻製器はダンボール製。貧乏は問題じゃない——貧乏は創造力の触媒だと思っている。'}, partner:'CARB', partnerText:{zh:'两人一起逛二手店，互相怂恿"这个可以买"。',ja:'二人でリサイクルショップを巡り、「これ買える！」とお互いに背中を押し合う。'}, theme:'chiaki',easter:false },
  DASH:  { code:'DASH',  role:{zh:'千明',ja:'ちあき'}, tag:{zh:'热血笨蛋千明',ja:'熱血バカちあき'},  quote:{zh:'迷路也是体验！反正会被救的——大概吧！',ja:'迷子も経験！どうせ誰か助けに来るし——多分！'}, desc:{zh:'你是那种想到什么就冲的人。先出发再查路线，先买了再说怎么用。你经常搞砸，但从不后悔。因为最棒的故事往往来自最离谱的意外。而且你有一个（或者好几个）无论如何都会来救你的朋友。',ja:'あなたは思いついたら即行動の人。ルートを調べる前に出発し、使い方を考える前に買ってしまう。よく失敗するけど、決して後悔はしない。だって最高のストーリーはいつもトンデモなアクシデントから生まれるから。そして、あなたには何があっても助けに来てくれる友達が一人（か何人か）いる。'}, partner:'DRIVE', partnerText:{zh:'她会开车来救你。虽然嘴上骂你，但油门下得很稳。',ja:'彼女は車で助けに来る。口では文句を言うけど、アクセルはしっかり踏んでいる。'}, theme:'chiaki',easter:false },
  SEYANA:{ code:'SEYANA',role:{zh:'葵',ja:'あおい'},  tag:{zh:'佛系葵',ja:'仏系あおい'},  quote:{zh:'せやな～',ja:'せやな～'}, desc:{zh:'天塌下来？主打一个随缘。你是那个在所有人焦虑的时候说"まあ、なんとかなる"（总会有办法的）的人。你说话带着关西腔的慵懒，行动带着一种从容的节奏。不是不在乎，而是你知道——急也没用。',ja:'空が落ちてきても？基本はなるようになる。あなたはみんなが焦っているときに「まあ、なんとかなる」と言える人。話し方には関西弁のゆるさがにじみ、行動にはゆったりとしたリズムがある。無関心なわけじゃない——急いでも仕方ないと知っているだけ。'}, partner:'CHAOS', partnerText:{zh:'她是龙卷风，你是风眼。没有你，她早就把自己吹飞了。',ja:'彼女は竜巻、あなたは台風の目。あなたがいなければ、彼女はとっくに自分を吹き飛ばしている。'}, theme:'aoi',easter:false },
  MOM:   { code:'MOM',   role:{zh:'葵',ja:'あおい'},  tag:{zh:'老妈子葵',ja:'お母さんあおい'},  quote:{zh:'先把饭做好，热水烧好，然后你们再闹。',ja:'先にご飯作って、お湯沸かしてから、騒いでください。'}, desc:{zh:'你是野活组真正的幕后支柱。千明负责整活，你负责善后；抚子负责吃，你负责做。你记得每个人的口味，知道谁需要加衣服，在所有人疯完闹完之后，你已经默默把一切收拾好了。你从不说"我来照顾你们"，但每个人都知道你会的。',ja:'あなたは野クルの真の黒幕。ちあきがネタを仕込み、あなたが後始末をする。なでしこが食べる担当なら、あなたは作る担当。みんなの好みを覚えていて、誰に上着が必要かも知っている。みんなが騒ぎ終わった頃には、あなたはもう全てを黙って片付け終えている。「私が面倒を見る」とは決して言わないけど、みんな知っている——あなたがそうするってことを。'}, partner:'WEEP', partnerText:{zh:'她哭的时候，只有你知道什么时候该递纸巾，什么时候该假装没看见。',ja:'彼女が泣くとき、ティッシュを渡すタイミングと見なかったふりをするタイミングを、あなただけが知っている。'}, theme:'aoi',easter:false },
  USOYARE: { code:'USOYARE', role:{zh:'葵',ja:'あおい'},  tag:{zh:'骗人精葵',ja:'嘘つきあおい'},  quote:{zh:'我跟你们说，上次我骑自行车……',ja:'あのな、この前自転車でな……'}, desc:{zh:'你的浓眉一挑，死鱼眼一翻，一段真假难辨的故事即将出口。你编故事的时候面不改色，细节丰富到让人怀疑"难道是真的？"——但谢天谢地，你从不拿重要的事开玩笑。你的「嘘やれ」是野活组的保留节目。',ja:'太い眉をピクリと上げ、死んだ魚のような目をくるりと回す——真偽不明の話が始まる合図だ。あなたは顔色一つ変えずに嘘をつき、細部までリアルで「まさか本当？」と疑わせる——でもありがたいことに、大事なことで冗談は言わない。あなたの「嘘やれ」は野クルの定番ネタ。'}, partner:'SHIP', partnerText:{zh:'你们俩凑在一起，没人能分清哪句是真的。',ja:'あなたたちが一緒にいると、誰もどれが本当か見分けられなくなる。'}, theme:'aoi',easter:false },
  CARB:  { code:'CARB',  role:{zh:'葵',ja:'あおい'},  tag:{zh:'碳水狂魔葵',ja:'炭水化物狂あおい'},  quote:{zh:'骑车40公里？不，是为了去那个便利店看看有没有新出的面包。',ja:'自転車で40キロ？いや、あのコンビニに新作パンがあるか見に行くためだよ。'}, desc:{zh:'你的骑行路线规划不是按距离，是按沿途便利店的数量。你能骑出41km/h的速度——但每次停下来都是因为"这家店看起来不错"。你骑车是为了吃，吃是为了骑车，这是一个完美的循环。',ja:'あなたのサイクリングルート計画は距離ではなく、沿道のコンビニの数で決まる。時速41kmで走れるのに——止まる理由はいつも「この店、良さそう」。あなたは食べるために走り、走るために食べる。完璧な循環だ。'}, partner:'NOM', partnerText:{zh:'你们一起骑车，一起吃饭，一起感叹"人生啊"。',ja:'一緒に走って、一緒に食べて、一緒に「人生って」とため息をつく。'}, theme:'aoi',easter:false },
  LURK:  { code:'LURK',  role:{zh:'惠那',ja:'えな'}, tag:{zh:'云露营惠那',ja:'リモキャンえな'},  quote:{zh:'人在被炉，心在营地。点赞从不缺席，出门下次一定。',ja:'体はこたつ、心はキャンプ場。いいねは欠かさない、参加は次回こそ。'}, desc:{zh:'你是野活组的编外成员——从未正式加入，但每次露营的群聊你都全程在线。你远程给凛提供建议，撮合野活组和凛认识，偶尔还通风报信。你的参与感不靠到场，靠信息量。你知道的永远比在场的人多。',ja:'あなたは野クルの非公式メンバー——正式には入部していないけど、毎回のキャンプのグループチャットには全部参加している。遠隔でリンにアドバイスを送り、野クルとリンを引き合わせ、たまには情報をリークしたりもする。あなたの参加感は「いること」じゃなく「知っていること」。あなたはいつも、その場にいる誰よりも多くのことを知っている。'}, partner:'OWL', partnerText:{zh:'你们在不同的地方，看着同一片星空，互相发消息。',ja:'違う場所で、同じ星空を見上げながら、お互いにメッセージを送り合う。'}, theme:'ena',easter:false },
  SHIP:  { code:'SHIP', role:{zh:'惠那',ja:'えな'}, tag:{zh:'搞事精惠那',ja:'おせっかいえな'},  quote:{zh:'りんりん～抚子说她马上到哦～',ja:'りんりん～なでしこがもうすぐ着くって～'}, desc:{zh:'其实你根本没告诉抚子。你最大的乐趣不是自己搞事，是看别人因为你的安排而相遇。你促成了凛和野活组的第一次接触，方式是"卖队友"。你笑眯眯地站在幕后，看着一切如你所料地发生。',ja:'実はなでしこには何も伝えていない。あなたの最大の楽しみは自分が動くことじゃなく、自分の仕掛けで誰かと誰かが出会うのを見ること。あなたはリンと野クルの初対面を演出した——その方法は「仲間を売る」こと。あなたはニコニコと裏方に立ち、全てが思い通りに動くのを見守っている。'}, partner:'CHAOS', partnerText:{zh:'你们俩的整活组合，能让整个营地鸡飞狗跳。',ja:'あなたたちのネタコンビは、キャンプ場全体を大騒ぎにできる。'}, theme:'ena',easter:false },
  DOGGO: { code:'DOGGO', role:{zh:'惠那',ja:'えな'}, tag:{zh:'爱犬惠那',ja:'愛犬家えな'},  quote:{zh:'竹轮在哪我在哪。露营可以不去，狗不能不撸。',ja:'ちくわがいるところが私の居場所。キャンプは行かなくてもいい、犬は撫でないとダメ。'}, desc:{zh:'你给竹轮买了35000日元的专属露营装备——包括一顶10000日元的狗帐篷。你计划18岁考驾照，不是为了自己，是为了带竹轮去更远的地方。别人问你为什么不加入野活部，你说"还没打算从归宅部毕业"——其实就是想多陪竹轮。',ja:'あなたはちくわに35,000円の専用キャンプ道具を買い与えた——10,000円の犬用テントも含めて。18歳で免許を取ろうと計画しているのは、自分のためじゃなく、ちくわをもっと遠くへ連れて行くため。なぜ野クルに入らないのかと聞かれると「まだ帰宅部を卒業するつもりはない」と答える——つまり、ちくわと一緒にいたいだけ。'}, partner:'WAN!', partnerText:{zh:'你们不需要语言。你懂它，它懂你。',ja:'言葉はいらない。あなたはちくわを理解し、ちくわもあなたを理解している。'}, theme:'ena',easter:false },
  COZY:  { code:'COZY',  role:{zh:'惠那',ja:'えな'}, tag:{zh:'被炉星人惠那',ja:'こたつ星人えな'},  quote:{zh:'被炉是宇宙的中心。冬天+被炉+零食+手机=幸福。',ja:'こたつは宇宙の中心。冬＋こたつ＋お菓子＋スマホ＝幸せ。'}, desc:{zh:'你的作息极其不规律，早起是你最大的敌人。你可以在被炉里度过整个冬天，靠手机远程参与一切社交活动。你知道这样不太好——但被炉真的很暖和，手机真的很好玩，外面的世界可以再等等。',ja:'あなたの生活リズムは極めて不規則で、早起きは最大の敵。こたつの中で冬を丸ごと過ごし、スマホで全ての社交を遠隔参加できる。あまり良くないとわかってはいるけど——こたつは本当に暖かいし、スマホは本当に楽しいし、外の世界はもう少し待ってもいい。'}, partner:'SEYANA', partnerText:{zh:'你们一起躺在被炉里，一句话不说，但都觉得"这样就挺好"。',ja:'一緒にこたつでゴロゴロしながら、一言も喋らないけど、お互いに「これでいい」と思っている。'}, theme:'ena',easter:false },
  // Easter eggs
  'WAN!': { code:'WAN!', role:{zh:'竹轮',ja:'ちくわ'}, tag:{zh:'竹轮本犬',ja:'ちくわ本人（犬）'}, quote:{zh:'汪！',ja:'ワン！'}, desc:{zh:'你不需要成为人群的焦点——你只需要一个人。你的世界不大：就是那个人 + 一个温暖的窝 + 永远摸不完的头。你的幸福公式很简单：被需要 = 幸福。人类露营关你什么事？你在你的小窝里等着就行——反正那个人会带你去。',ja:'あなたは人の輪の中心になる必要はない——ただ一人だけいればいい。あなたの世界は小さい：あの人＋暖かい寝床＋永遠に撫でられ続ける頭。あなたの幸せの方程式はシンプル：必要とされること＝幸せ。人間のキャンプなんて関係ない？あなたは自分の寝床で待っていればいい——どうせあの人が連れて行ってくれるから。'}, partner:'DOGGO', partnerText:{zh:'她是你的全世界，你是她的全部。',ja:'彼女はあなたの全世界、あなたは彼女の全て。'}, theme:'easter',easter:true },
  '6CAN': { code:'6CAN', role:{zh:'老师',ja:'先生'}, tag:{zh:'酒鬼老师',ja:'酒飲み先生'}, quote:{zh:'六罐姐可不是白叫的。',ja:'六缶姐は伊達じゃない。'}, desc:{zh:'白天你是所有人的依靠——靠谱、温和、永远在照顾别人。但下班铃一响，脱下外套，打开第一罐啤酒的那一刻，另一个你醒了。你不需要被理解，你只需要再来一罐。戒酒期间你迷上了黄油曲奇——但戒酒结束后又开了一瓶。',ja:'昼間はみんなの頼り——しっかりしていて、優しくて、いつも誰かの面倒を見ている。でも退勤のチャイムが鳴り、上着を脱いで、最初の缶ビールを開けた瞬間、もう一人のあなたが目覚める。理解される必要はない、もう一缶あればいい。禁酒中はバタークッキーにハマった——でも禁酒が終わったらまた一缶開けた。'}, partner:'USOYARE', partnerText:{zh:'喝醉后听她讲故事，你分不清是自己醉了还是故事太离谱。',ja:'酔ったあとに彼女の話を聞くと、自分が酔ってるのか話がトンデモなのか区別がつかなくなる。'}, theme:'easter',easter:true },
  SAGE:  { code:'SAGE',  role:{zh:'爷爷',ja:'おじいちゃん'}, tag:{zh:'露营仙人',ja:'キャンプ仙人'}, quote:{zh:'你年轻时帐篷还是帆布的。',ja:'若い頃はテントが帆布やったんや。'}, desc:{zh:'你走过很多路，修过很多车，认识很多人——但从不刻意。你从不教别人该怎么活，你只是活给他们看。有人问你去哪，你说"随便走走"——然后一走就是一年。你的装备不新，但每一样都有故事。你把帐篷、煤油灯、露营指南书传给下一个人，就像把一种生活方式悄悄种进他们的生命。',ja:'あなたはたくさんの道を歩き、たくさんの車を修理し、たくさんの人と出会った——でも決して作為的ではない。誰かに「どう生きるべきか」を教えたことはない。ただ、背中で見せてきただけ。行き先を聞かれると「ちょっとそこまで」と言う——そして一年が経つ。あなたの道具は新しくないけど、一つ一つに物語がある。テント、ランタン、キャンプガイドブックを次の人に託す。それはまるで、一つの生き方をそっと彼らの人生に植え付けるように。'}, partner:'LONE', partnerText:{zh:'你们坐在一起，各自看书，偶尔抬头对视一眼。你从没说出来——但她是你见过最像你的人。',ja:'隣に座って、それぞれ本を読む。たまに顔を上げて目が合う。口に出したことはない——でも彼女は、あなたが今まで出会った中で一番自分に似ている人だ。'}, theme:'easter',easter:true },
  '3776': { code:'3776', role:{zh:'中毒者',ja:'中毒者'}, tag:{zh:'富士山中毒者',ja:'富士山中毒者'}, quote:{zh:'3776米。这不是数字，是信仰。',ja:'3776メートル。これは数字じゃない、信仰だ。'}, desc:{zh:'你对富士山的爱超越了理性。你能从任何角度认出富士山，你能说出每个观景点的最佳时间。你看到富士山的时候，会停下一切，安静地看很久。它不只是山——它是你心里的坐标系。不管走多远，只要能看到它，你就知道自己没走丢。',ja:'あなたの富士山への愛は理性を超えている。どんな角度からでも富士山を見分けられ、各ビューポイントのベストタイムを言い当てられる。富士山を見るときは、全てを止めて、静かに長く眺める。それはただの山じゃない——あなたの心の座標軸。どんなに遠くに行っても、それさえ見えれば、自分が迷ってないとわかる。'}, partner:'PAGE', partnerText:{zh:'和她一起安静地看富士山，不用说话，就是最好的陪伴。',ja:'彼女と静かに富士山を眺める。言葉はいらない、それが最高の時間。'}, theme:'easter',easter:true },
  CHILL: { code:'CHILL', role:{zh:'绫乃',ja:'あやの'}, tag:{zh:'慵懒骑士绫乃',ja:'ゆるふわライダーあやの'}, quote:{zh:'绫乃的体力是三人中最差的——但没关系，反正骑完摩托瘫在地上也很舒服。',ja:'あやのの体力は三人の中で一番低い——でも大丈夫、どうせバイクで来たあと地面に寝転がるのも気持ちいいし。'}, desc:{zh:'答应朋友的事你可能拖了很久——但最后你还是骑着摩托、跨了几个县界到了。你体力不好？没事，躺在地上看星星也很舒服。你对朋友的心意从不打折——路上花了多久不重要，重要的是你来了。',ja:'友達との約束をずっと引き延ばしてきた——でも最後にはバイクに乗って、いくつもの県境を越えて辿り着く。体力がない？大丈夫、地面に寝転がって星を見上げるのも最高。友達への気持ちに値引きはない——道中にどれだけ時間がかかったかは重要じゃない、大事なのはあなたが来たこと。'}, partner:'TSUN', partnerText:{zh:'你们在路上并排骑行。她开得快，你开得慢，但最后都会在露营地碰头。她知道你一定会到，所以你迟到她也从不催。',ja:'道中で並んで走る。彼女は速く、あなたはゆっくり。でも最後はキャンプ場で必ず合流する。彼女はあなたが必ず来ると知っているから、遅れても決して急かさない。'}, theme:'easter',easter:true },
  DRIVE: { code:'DRIVE', role:{zh:'樱姐',ja:'桜姐'}, tag:{zh:'飙车党樱姐',ja:'走り屋桜姐'}, quote:{zh:'いいよ。',ja:'いいよ。'}, desc:{zh:'你不说"我爱你"，你说"いいよ"。两个字，背后是深夜三小时的山路。朋友凌晨迷路了，你没说"你疯了"，你说"发我定位"。你开车穿过黑夜，不是因为你想露营——是因为有人在那个营地里等你。你表面冷淡，但方向盘从不犹豫。',ja:'あなたは「愛してる」とは言わない。「いいよ」と言う。たった二文字、その裏には深夜三時間の山道がある。友達が夜中に迷子になったとき、あなたは「バカじゃないの」とは言わず、「位置情報送って」と言う。あなたが夜を越えて走るのは、キャンプがしたいからじゃない——あのキャンプ場に、あなたを待っている誰かがいるから。あなたは表向きは冷たく見えるけど、ハンドルは決して迷わない。'}, partner:'DASH', partnerText:{zh:'你嘴上骂她冒失，但每次都是你开车去救她。她知道你会来，所以她才敢乱跑。',ja:'口では「うっかり者」と文句を言うけど、毎回助けに行くのはあなたの車。彼女はあなたが来ると知っているから、だからこそ遠くまで行ける。'}, theme:'easter',easter:true },
  ASAKA: { code:'ASAKA', role:{zh:'亚咲花',ja:'亜咲花'}, tag:{zh:'露营之声亚咲花',ja:'キャンプの声・亜咲花'}, quote:{zh:'露营地放的歌，十首里有五首是你的。',ja:'キャンプ場で流れる曲、十曲中五曲はあなたの歌。'}, desc:{zh:'你不一定在现场，但你的声音在。你唱过的歌变成了别人的露营BGM，变成了他们出发时的闹铃，变成了篝火旁的大合唱。你创造的不是音乐——是记忆的背景音。每一次有人按下播放键，你就陪他们又出发了一次。',ja:'あなたはその場にいなくても、あなたの声はそこにある。あなたが歌った曲は誰かのキャンプBGMになり、出発のアラームになり、焚き火のそばの大合唱になっている。あなたが創り出したのは音楽じゃない——記憶のサウンドトラックだ。誰かが再生ボタンを押すたびに、あなたはまた彼らと一緒に出発している。'}, partner:'AFRO', partnerText:{zh:'你们是彼此的因果。一支笔创造一个世界，一首歌给它温度。不需要见面——歌响起的时候，你们就在一起。',ja:'あなたたちはお互いの因果。一つのペンが世界を創り、一つの歌がそれに温度を与える。会う必要はない——歌が流れた瞬間、あなたたちは一緒にいる。'}, theme:'easter',easter:true },
  AFRO:  { code:'AFRO',  role:{zh:'Afro老师',ja:'あfろ先生'}, tag:{zh:'部活创世神',ja:'部活の創世神'}, quote:{zh:'爆炸头是本体，露营是信仰。想不出故事的时候就出去取材。',ja:'アフロが本体、キャンプは信仰。ネタが思いつかないときは取材に出かける。'}, desc:{zh:'你喜欢把去过的地方画进作品里，把认识的人变成角色，把路边吃过的咖喱面画成名场面。你的创作不是凭空想象——是你把生活嚼碎了，重新拼成一幅画。你画的露营地后来变成了别人出发的理由。',ja:'あなたは行った場所を作品に描き、知り合った人をキャラクターに変え、道端で食べたカレー麺を名シーンに描く。あなたの創作は空想じゃない——生活を噛み砕いて、一枚の絵に組み直したもの。あなたが描いたキャンプ場は、後に誰かの出発の理由になった。'}, partner:'ASAKA', partnerText:{zh:'你的世界给了她歌唱的理由，她的歌声让你的世界有了温度。一支笔，一首歌——同一个世界，两种表达。',ja:'あなたの世界が彼女に歌う理由を与え、彼女の歌声があなたの世界に温度を与えた。一本のペン、一つの歌——同じ世界、二つの表現。'}, theme:'easter',easter:true },
  MONO:  { code:'MONO',  role:{zh:'摄影部',ja:'写真部'}, tag:{zh:'摄影部部员',ja:'写真部員'}, quote:{zh:'用镜头记录的日常，和用帐篷记录的星空，是同一种浪漫。',ja:'レンズで切り取る日常と、テントで記録する星空は、同じロマン。'}, desc:{zh:'别人忽略的瞬间——黄昏的光线角度、路边野猫的哈欠——在你眼里全是宝藏。按下快门不是技术活，是本能。你带着相机走走停停，不知道会拍到什么——但你知道，一定会拍到什么。露营的时候，你比谁都安静，但你的眼里装满了别人没注意到的风景。',ja:'みんなが見逃す瞬間——夕暮れの光の角度、道端の野良猫のあくび——あなたの目には全てが宝物。シャッターを切るのは技術じゃなく本能。カメラを持って歩きながら、何が撮れるかわからない——でも、必ず何か撮れると知っている。キャンプ中、あなたは誰よりも静かだけど、その目には誰も気づかない風景が溢れている。'}, partner:'AFRO', partnerText:{zh:'你们都是「用画面讲故事」的人。一个画，一个拍——同一个世界，两种表达。',ja:'あなたたちはみんな「絵で物語を語る」人。一人は描き、一人は撮る——同じ世界、二つの表現。'}, theme:'easter',easter:true },
  AQUA:  { code:'AQUA',  role:{zh:'水水人',ja:'水水人'}, tag:{zh:'沼津水水人',ja:'沼津の水水人'}, quote:{zh:'山里的咖喱面确实不错。但你来沼津尝尝海边的橘子——那是另一种甜。',ja:'山のカレー麺は確かにうまい。でも沼津に来て海辺のみかんを食べてみて——それはまた別の甘さだから。'}, desc:{zh:'当全世界的露营爱好者都涌向山梨和富士山的时候，你站在駿河湾边微微一笑。你知道好风景不只在山里——海岸线、海上的鸟居、海风里的咸味，同样是出发的理由。你去过本栖湖，也去过海边。你心里的地图，山和海各占一半。',ja:'世界中のキャンプ好きが山梨と富士山に殺到しているとき、あなたは駿河湾のほとりでほほえむ。いい景色は山だけじゃないと知っている——海岸線、海の上の鳥居、潮風の塩味、それもまた出発の理由。あなたは本栖湖にも行ったし、海辺にも行った。あなたの心の地図は、山と海が半分ずつ。'}, partner:'3776', partnerText:{zh:'你们是静冈的一体两面：你爱海，她爱山。3776米加駿河湾，刚好拼成一个完整的静冈。',ja:'あなたたちは静岡の表裏一体：あなたは海を愛し、彼女は山を愛する。3776メートルに駿河湾を足せば、ちょうど完璧な静岡ができる。'}, theme:'easter',easter:true },
};

function t(key) { return I18N[currentLang][key] || key; }
function tf(key, ...args) {
  let s = I18N[currentLang][key] || key;
  for (let i = 0; i < args.length; i++) s = s.replace('{' + i + '}', args[i]);
  return s;
}
function toggleLang() {
  currentLang = currentLang === 'zh' ? 'ja' : 'zh';
  try { localStorage.setItem('ycti_lang', currentLang); } catch(e) {}
  applyI18N();
  var btn = document.getElementById('langSwitch');
  if (btn) btn.textContent = currentLang === 'zh' ? '日本語' : '中文';
}
function applyI18N() {
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  document.querySelectorAll('.bottom-bar').forEach(function(el) {
    el.textContent = t('bottomBar');
  });
  var btn = document.getElementById('langSwitch');
  if (btn) btn.textContent = currentLang === 'zh' ? '日本語' : '中文';
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'ja';
}
document.addEventListener('DOMContentLoaded', initLang);
function initLang() {
  try {
    var stored = localStorage.getItem('ycti_lang');
    if (stored) { currentLang = stored; applyI18N(); return; }
  } catch(e) {}
  fetch('https://ipapi.co/json/')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      currentLang = (d.country === 'JP') ? 'ja' : 'zh';
      applyI18N();
    })
    .catch(function() { applyI18N(); });
}

// ============================================================
// STATE
// ============================================================
let shuffledQuestions = [];
let currentQ = 0;
let scores = {};
let questionOrder = [];
// 分数流水：每题 [[code, 分值], ...]，用于结果页的流星雨
let scoreLog = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// SCREENS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Language switcher only on start screen
  var langBtn = document.getElementById('langSwitch');
  if (langBtn) langBtn.style.display = (id === 'startScreen') ? '' : 'none';
  // Only result page allows scrolling; other pages locked
  if (id === 'resultScreen') {
    document.documentElement.style.overflow = 'auto';
    document.body.style.overflowY = 'auto';
    document.body.style.overflowX = 'hidden';
    document.body.style.justifyContent = 'flex-start';
  } else {
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    document.body.style.justifyContent = 'center';
  }
}

function selectQuestions(questions, count) {
  // 阵营均衡抽题：五大阵营各至少 2 题，彩蛋至少 1 题
  const byCamp = {};
  for (let i = 0; i < questions.length; i++) {
    const c = questions[i].camp;
    if (!byCamp[c]) byCamp[c] = [];
    byCamp[c].push(i);
  }
  const mainCamps = ['rin', 'nadeshiko', 'chiaki', 'aoi', 'ena'];
  const guaranteed = [];
  for (const camp of mainCamps) {
    const pool = byCamp[camp] || [];
    shuffleArray(pool);
    guaranteed.push(...pool.slice(0, 2));
  }
  if (byCamp['easter']) {
    shuffleArray(byCamp['easter']);
    guaranteed.push(byCamp['easter'][0]);
  }
  const used = new Set(guaranteed);
  const remaining = [];
  for (let i = 0; i < questions.length; i++) {
    if (!used.has(i)) remaining.push(i);
  }
  shuffleArray(remaining);
  const selected = [...guaranteed, ...remaining.slice(0, count - guaranteed.length)];
  shuffleArray(selected);
  return selected.map(i => questions[i]);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function startQuiz() {
  scores = {};
  scoreLog = [];
  resetPreloads();   // 每次重测重置预取（含隐藏容器）
  currentQ = 0;
  // 阵营均衡抽题：从 50 题中选 20 题
  shuffledQuestions = selectQuestions(QUESTIONS, 20);
  questionOrder = shuffledQuestions.map((_, i) => i);
  showScreen('quizScreen');
  renderQuestion();
}

// ============================================================
// 图片预取：只预判"最可能的结果"（2~4 张），不再一次性预取 32 张
// ============================================================
var preloadedSet = {};        // url -> <img>（挂在隐藏容器里，保持引用）
var preloadBox = null;
var PRELOAD_CAP = 8;

function preloadBoxGet() {
  if (preloadBox && preloadBox.parentNode) return preloadBox;
  preloadBox = document.createElement('div');
  preloadBox.id = 'imgPreload';
  preloadBox.setAttribute('aria-hidden', 'true');
  preloadBox.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
  document.body.appendChild(preloadBox);
  return preloadBox;
}

// 预取图必须真的挂进 DOM：
// 微信 X5 / 部分 WebView 对"没插入文档的 new Image()"会惰性加载甚至直接丢弃，
// 桌面浏览器看不出差别，微信里就表现为"预取了、结果页还在干等"。
function preloadImage(url) {
  if (preloadedSet[url]) return;
  var im = document.createElement('img');
  im.alt = '';
  im.setAttribute('decoding', 'async');
  im.src = url;
  preloadBoxGet().appendChild(im);
  preloadedSet[url] = im;
  if (im.decode) im.decode().catch(function() {});
}

// 结果页要用这张图了：把其它预取全部掐掉，让出连接槽和带宽
// （微信 X5 每域名只有 6 条连接，排队的预取会把结果图堵在后面）
function releasePreloads(keepUrl) {
  Object.keys(preloadedSet).forEach(function(u) {
    if (u === keepUrl) return;
    var im = preloadedSet[u];
    try { im.removeAttribute('src'); } catch (e) {}
    if (im.parentNode) im.parentNode.removeChild(im);
    delete preloadedSet[u];
  });
}

function resetPreloads() {
  releasePreloads(null);
  if (preloadBox && preloadBox.parentNode) preloadBox.parentNode.removeChild(preloadBox);
  preloadBox = null;
  preloadedSet = {};
}

function preloadPredicted() {
  // 前 2 题分数还散着，预判没有意义
  if (currentQ < 2) return;
  if (Object.keys(preloadedSet).length >= PRELOAD_CAP) return;

  var mainKeys = Object.keys(PERSONALITIES).filter(function(k) { return !PERSONALITIES[k].easter; });
  mainKeys.sort(function(a, b) { return (scores[b] || 0) - (scores[a] || 0); });

  var remain = shuffledQuestions.length - currentQ;
  // 前半程只备第一名（少下几张，别和后面的请求抢带宽）；剩 5 题时把第二名也备上
  var wanted = mainKeys.slice(0, remain <= 5 ? 2 : 1);
  // 最后 2 题把够格的彩蛋也备上（computeResult 可能在彩蛋里随机命中）
  if (remain <= 2) {
    Object.keys(PERSONALITIES).filter(function(k) {
      return PERSONALITIES[k].easter && (scores[k] || 0) >= 3;
    }).sort(function(a, b) { return (scores[b] || 0) - (scores[a] || 0); })
      .slice(0, 2).forEach(function(k) { wanted.push(k); });
  }

  wanted.forEach(function(k) { preloadImage('imgs/' + PERSONALITIES[k].code + '.webp'); });
}

// 首屏优先：封面先渲染，页面可交互之后再去拉循环视频；
// 用户已经在答题/看结果就先别拉，别和结果图抢带宽（微信里这点很明显）
(function deferHomeVideo() {
  var v = document.getElementById('homeVideo');
  if (!v) return;
  var tries = 0;
  function busy() {
    var q = document.getElementById('quizScreen');
    var r = document.getElementById('resultScreen');
    var rs = document.getElementById('statsScreen');
    return (q && q.classList.contains('active')) || (r && r.classList.contains('active')) || (rs && rs.classList.contains('active'));
  }
  function loadVideo() {
    if (v.getAttribute('src')) return;
    if (busy() && tries < 10) { tries++; setTimeout(loadVideo, 2000); return; }
    var src = v.getAttribute('data-src');
    if (!src) return;
    v.setAttribute('src', src);
    try { v.load(); } catch (e) {}
    var pr = v.play();
    if (pr && pr.catch) pr.catch(function() {});
  }
  if (document.readyState === 'complete') setTimeout(loadVideo, 300);
  else window.addEventListener('load', function() { setTimeout(loadVideo, 300); });
})();

function renderQuestion() {
  const q = shuffledQuestions[currentQ];
  const total = shuffledQuestions.length;
  document.getElementById('progressFill').style.width = ((currentQ / total) * 100) + '%';
  document.getElementById('qCounter').textContent = tf('qCounter', currentQ + 1, total);
  document.getElementById('qText').textContent = q[currentLang];
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  // Shuffle options for variety
  const labels = ['A','B','C','D'];
  const shuffled = q.options.map((opt, i) => ({...opt, origIdx: i}));
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = labels[i] + '. ' + opt[currentLang];
    btn.addEventListener('click', () => selectOption(opt.origIdx));
    optsEl.appendChild(btn);
  });
}

function selectOption(idx) {
  const q = shuffledQuestions[currentQ];
  const opt = q.options[idx];
  
  // Visual feedback: highlight selected
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.style.pointerEvents = 'none');
  // Find the button that corresponds to this option
  const buttons = document.querySelectorAll('#options .option');
  for (const btn of buttons) {
    if (btn.textContent.includes(opt[currentLang].substring(0, 10))) {
      btn.classList.add('selected');
      break;
    }
  }
  
  // Add scores
  var logEntry = [];
  for (const [key, val] of Object.entries(opt.scores)) {
    scores[key] = (scores[key] || 0) + val;
    if (val > 0) logEntry.push([key, val]);
  }
  scoreLog.push(logEntry);
  
  // 立即按新分数预判要用的图（最后一题也走这里，抢出 200ms 转场时间）
  preloadPredicted();
  
  setTimeout(() => {
    currentQ++;
    if (currentQ >= shuffledQuestions.length) {
      showResult();
    } else {
      renderQuestion();
      document.getElementById('progressFill').style.width = ((currentQ / shuffledQuestions.length) * 100) + '%';
      document.getElementById('qCounter').textContent = tf('qCounter', currentQ + 1, shuffledQuestions.length);
    }
  }, 200);
}

// ============================================================
// MATCHING ALGORITHM
// ============================================================
function computeResult() {
  // Get all 22 main personalities sorted by score
  const mainKeys = Object.keys(PERSONALITIES).filter(k => !PERSONALITIES[k].easter);
  mainKeys.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
  
  // Get top 2, randomly pick one
  const top2 = mainKeys.slice(0, 2);
  const pick = top2[Math.floor(Math.random() * Math.min(2, top2.length))];
  
  // Check easter eggs: score >= 3 AND probabilistic chance
  // Easter triggers with probability = easterScore / (mainMax * 7)
  const mainMax = scores[top2[0]] || 0;
  const easterKeys = Object.keys(PERSONALITIES).filter(k => PERSONALITIES[k].easter);
  const qualified = easterKeys.filter(k => (scores[k] || 0) >= 3);
  
  if (qualified.length > 0 && mainMax > 0) {
    // Sort by score descending
    qualified.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
    // Check each qualified easter with probability
    for (const ek of qualified) {
      const prob = (scores[ek] || 0) / (mainMax * 7);
      if (Math.random() < prob) {
        return { key: ek, easter: true };
      }
    }
  }
  
  return { key: pick, easter: false };
}

// ============================================================
// 结果页前的流星雨：把 20 题的得分变成一场「字雨」
//   1 分 = 1 颗字；2 分以上用更大字号表示，避免字雨过密
//   全部飞完就循环重来，直到用户点「查看结果」
// ============================================================
var FX_WAVE_MS = 5000;      // 一轮流星的总时长（放慢，让"一轮"能被感知）
var FX_METEOR_MS = 2600;    // 单颗飞行时长（越长越慢、同屏越密）
var FX_DENSITY = 0.65;      // 密度曲线：0=均匀，越大越"两头疏、中间密"
var FX_MIN_MS = 2000;       // 文案/动画的最短展示时长（也是按钮最早出现的时刻）
var FX_EXIT_MS = 1000;      // 点击「查看结果」后，字雨层淡出的时长

function prefersReducedMotion() {
  try {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) {
    return false;
  }
}

// 把分数流水摊平成流星列表
function buildMeteors() {
  var out = [];
  for (var i = 0; i < scoreLog.length; i++) {
    var entry = scoreLog[i] || [];
    for (var j = 0; j < entry.length; j++) {
      var code = entry[j][0], pts = entry[j][1];
      if (!PERSONALITIES[code] || !(pts > 0)) continue;
      var g = campOf(code);
      out.push({ ch: g.short, color: g.color, pts: pts });
    }
  }
  return out;
}

function startAnalysisFx(onView) {
  var meteors = buildMeteors();

  var layer = document.createElement('div');
  layer.id = 'analysisFx';

  var rain = document.createElement('div');
  rain.className = 'fx-rain';
  layer.appendChild(rain);

  var tip = document.createElement('div');
  tip.className = 'fx-tip';
  tip.setAttribute('data-i18n', 'loadingAnalyzing');
  tip.textContent = t('loadingAnalyzing');
  layer.appendChild(tip);

  var btn = document.createElement('button');
  btn.className = 'fx-btn';
  btn.setAttribute('data-i18n', 'fxView');
  btn.textContent = t('fxView');
  btn.onclick = function() {
    if (leaving) return;
    leaving = true;
    if (onView) onView();             // 结果页先渲染在下层
    layer.classList.add('fx-out');    // 字雨层整体淡出（含按钮/流星/背景）
    exitTimer = setTimeout(cleanup, FX_EXIT_MS);
  };
  layer.appendChild(btn);

  document.body.appendChild(layer);

  // 按当前视口生成关键帧（所有流星共用同一段位移）
  var vw = window.innerWidth, vh = window.innerHeight;
  // 位移取对角线长度即可：再长就是屏幕外的空飞，会显得很稀
  var D = Math.round(Math.sqrt(vw * vw + vh * vh) * 1.02);
  var kf = document.getElementById('fxKF');
  if (kf && kf.parentNode) kf.parentNode.removeChild(kf);
  kf = document.createElement('style');
  kf.id = 'fxKF';
  kf.textContent = '@keyframes fxFly{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:1}78%{opacity:1}100%{transform:translate3d(' + (-D) + 'px,' + D + 'px,0);opacity:0}}';
  document.head.appendChild(kf);

  var stopped = false;
  var leaving = false;
  var startedAt = Date.now();
  var waveTimer = null, btnTimer = null, exitTimer = null;
  var btnShown = false, btnPending = false;

  function cleanup() {
    stopped = true;
    if (waveTimer) clearTimeout(waveTimer);
    if (btnTimer) clearTimeout(btnTimer);
    if (exitTimer) clearTimeout(exitTimer);
    if (layer.parentNode) layer.parentNode.removeChild(layer);
    var k = document.getElementById('fxKF');
    if (k && k.parentNode) k.parentNode.removeChild(k);
  }

  function nextWave() {
    if (stopped) return;
    if (document.hidden) { waveTimer = setTimeout(nextWave, 1000); return; }
    emitWave();
  }

  function emitWave() {
    if (stopped) return;
    var W = window.innerWidth, H = window.innerHeight;
    var n = meteors.length || 1;
    // 发射节奏由下面的密度曲线决定，不再用均匀 stagger

    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i];

      // 起点铺在「右侧边」和「顶部边」上（不是一条斜线，否则会排成串珠）
      var sx, sy;
      if (Math.random() < 0.6) {
        sx = W + 10 + Math.random() * 90;            // 右侧进入
        sy = -10 + Math.random() * (H * 1.0);
      } else {
        sx = W * 0.1 + Math.random() * (W * 1.0);    // 顶部进入
        sy = -10 - Math.random() * 80;
      }

      // 远近层次：远景更小更暗更慢，近景更大更亮更快
      var far = Math.random() < 0.35;

      var el = document.createElement('span');
      el.className = 'fx-m';
      el.textContent = m.ch;
      el.style.color = far ? hexToRgba(m.color, 0.55) : m.color;
      el.style.fontSize = (far ? 12 : 19) + (Math.min(m.pts, 4) - 1) * (far ? 2 : 7) + 'px';
      el.style.left = Math.round(sx) + 'px';
      el.style.top = Math.round(sy) + 'px';
      el.style.animationDuration = (far ? FX_METEOR_MS * 1.35 : FX_METEOR_MS) + 'ms';
      // 疏→密→疏：把"第 i 颗"映射到时间轴
      // t(u) = W*(u + a*sin(2πu)/2π)：导数在 u=0/1 最大（两头疏），u=0.5 最小（中间密）
      var u = n > 1 ? i / (n - 1) : 0.5;
      var t = FX_WAVE_MS * (u + FX_DENSITY * Math.sin(2 * Math.PI * u) / (2 * Math.PI));
      el.style.animationDelay = Math.round(Math.max(0, t) + Math.random() * 40) + 'ms';
      (function(node) {
        node.addEventListener('animationend', function() {
          if (node.parentNode) node.parentNode.removeChild(node);
        });
      })(el);
      rain.appendChild(el);
    }

    // 一轮飞完接着下一轮；页面在后台时先不发射（否则动画暂停、节点会堆积）
    waveTimer = setTimeout(nextWave, FX_WAVE_MS);
  }

  emitWave();

  function tryShow() {
    if (stopped || btnShown) return;
    var wait = FX_MIN_MS - (Date.now() - startedAt);
    if (wait > 0) {
      if (btnPending) return;
      btnPending = true;
      btnTimer = setTimeout(function() { btnPending = false; tryShow(); }, wait + 20);
      return;
    }
    btnShown = true;
    tip.style.display = 'none';
    btn.classList.add('show');
  }

  return { setReady: tryShow, stop: cleanup };
}
// 结果页前的流程：
//   ① 立刻开始加载结果图（和动画并行）
//   ② 流星雨循环播放，把 20 题的得分"飞"一遍
//   ③ 图到位后，在流星雨下方淡入「分析完成 · 查看结果」，用户点了才进结果页
//   ④ 用户一直不点也没关系，流星雨继续循环；图确实取不到（404）时用兜底图
var RESULT_IMG_STALL_MS = 8000;   // 单次请求多久没动静视为连接卡死，静默换 URL 重试

function showResult() {
  var result = computeResult();
  var p = PERSONALITIES[result.key];
  var partner = PERSONALITIES[p.partner];
  var imgSrc = 'imgs/' + p.code + '.webp';
  var overlay = document.getElementById('loadingOverlay');

  var done = false;
  var attempt = 0;
  var overlayTimer = null, stallTimer = null, retryTimer = null, decodeTimer = null;
  var fx = null;
  var finalSrc = imgSrc;
  var useFx = !prefersReducedMotion();

  function stopTimers() {
    if (overlayTimer) { clearTimeout(overlayTimer); overlayTimer = null; }
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    if (decodeTimer) { clearTimeout(decodeTimer); decodeTimer = null; }
  }

  function enter() {
    if (done) return;
    done = true;
    stopTimers();
    revealResult(p, partner, result, finalSrc);   // 字雨层由它自己淡出后移除
  }

  // 图就绪：有动画就等用户点按钮，没有动画（降级）就直接进
  function imageReady(src) {
    if (done) return;
    finalSrc = src;
    if (fx) fx.setReady();
    else enter();
  }

  function attemptLoad() {
    attempt++;
    var usePre = (attempt === 1 && preloadedSet[imgSrc]) ? preloadedSet[imgSrc] : null;
    var img = usePre || new Image();
    var src = (attempt === 1) ? imgSrc : imgSrc + '?r=' + attempt + '-' + Date.now();
    var settled = false;

    function ok() {
      if (settled || done) return;
      settled = true;
      if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
      // 图已到手，decode 只为避免切页后首帧空白；个别内核不 resolve，1s 后照样继续
      if (img.decode) {
        var called = false;
        decodeTimer = setTimeout(function() {
          if (called) return;
          called = true; decodeTimer = null;
          imageReady(src);
        }, 1000);
        img.decode().then(function() {
          if (called) return;
          called = true;
          if (decodeTimer) { clearTimeout(decodeTimer); decodeTimer = null; }
          imageReady(src);
        }, function() {
          if (called) return;
          called = true;
          if (decodeTimer) { clearTimeout(decodeTimer); decodeTimer = null; }
          imageReady(src);
        });
      } else {
        imageReady(src);
      }
    }

    // 明确失败（404 等）：用兜底图，不让用户一直卡着
    function bad() {
      if (settled || done) return;
      settled = true;
      if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
      imageReady(HERO_DEFAULT);
    }

    // 卡死（8 秒没动静）：静默换 URL 再来一次，界面继续播放流星雨，不换图
    stallTimer = setTimeout(function() {
      if (settled || done) return;
      settled = true;
      stallTimer = null;
      img.onload = null;
      img.onerror = null;
      try { img.src = ''; } catch (e) {}
      retryTimer = setTimeout(function() { retryTimer = null; attemptLoad(); }, 300);
    }, RESULT_IMG_STALL_MS);

    img.onload = ok;
    img.onerror = bad;

    if (usePre) {
      if (img.complete) { if (img.naturalWidth) ok(); else bad(); }
      else if (!img.getAttribute('src')) img.src = src;
    } else {
      img.src = src;
    }
  }

  releasePreloads(imgSrc);   // 掐掉其它预取，让结果图独占连接与带宽

  if (useFx) {
    if (overlay) overlay.style.display = 'none';
    fx = startAnalysisFx(enter);
  }

  attemptLoad();

  // 无动画时退回原来的 loading 遮罩（延迟 120ms，命中缓存不闪）
  if (!useFx) {
    overlayTimer = setTimeout(function() {
      if (!done) overlay.style.display = 'flex';
    }, 120);
  }
}

// STATS (GitHub API)
// ============================================================
const STATS_COLORS = {
  LONE:'#7eb8da',TSUN:'#7eb8da',PAGE:'#7eb8da',OWL:'#7eb8da',SPA:'#7eb8da',
  NOM:'#e8a0b0',SUNNY:'#e8a0b0','BOO!':'#e8a0b0',CHEF:'#e8a0b0',CHOO:'#e8a0b0',
  CHAOS:'#b89ad4',WEEP:'#b89ad4',BROKE:'#b89ad4',DASH:'#b89ad4',
  SEYANA:'#a8b878',MOM:'#a8b878',USOYARE:'#a8b878',CARB:'#a8b878',
  LURK:'#c0b8a8',SHIP:'#c0b8a8',DOGGO:'#c0b8a8',COZY:'#c0b8a8',
  'WAN!':'#d4b840','6CAN':'#d4b840',SAGE:'#d4b840','3776':'#d4b840',
  CHILL:'#d4b840',DRIVE:'#d4b840',ASAKA:'#d4b840',AFRO:'#d4b840',
  MONO:'#d4b840',AQUA:'#d4b840'
};
const OPACITIES = [1.0, 0.82, 0.66, 0.52, 0.40];

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function openStats() {
  document.getElementById('resultScreen').classList.remove('active');
  // Mobile: lock body with position:fixed to prevent touch-scroll-through
  const scrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${scrollY}px`;
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
  document.body.style.justifyContent = 'center';
  const ss = document.getElementById('statsScreen');
  ss.style.display = 'flex';

}

function closeStats() {

  const scrollY = parseInt(document.body.style.top || '0', 10);
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  document.documentElement.style.overflow = 'auto';
  document.body.style.overflowY = 'auto';
  document.body.style.overflowX = 'hidden';
  document.body.style.justifyContent = 'flex-start';
  window.scrollTo(0, -scrollY);
}

async function loadStats() {
  const canvas = document.getElementById('statsCanvas');
  const ctx = canvas.getContext('2d');
  // Dynamic canvas size — fill the container, mobile-optimized
  const container = canvas.parentElement;
  const maxW = container.clientWidth - 16;
  const maxH = container.clientHeight - 8;
  const W = Math.max(Math.min(maxW, 600), 280);
  const H = Math.max(Math.min(maxH, Math.round(W * 1.6)), 360);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#9a8c7a';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(currentLang==='ja'?'読み込み中...':'加载中...', W/2, H/2);
  try {
    const stats = await ghStatsRead();
    const counts = stats.results || {};
    // Migration: TROLL → SHIP (old data rename)
    if (counts['TROLL']) {
      counts['SHIP'] = (counts['SHIP'] || 0) + counts['TROLL'];
      delete counts['TROLL'];
    }
    const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
    const total = stats.total || 0;
    ctx.clearRect(0, 0, W, H);
    const info = document.getElementById('statsInfo');
    const list = document.getElementById('statsList');
    if (total === 0) {
      info.textContent = '';
      list.innerHTML = '';
      ctx.fillText(t('statsEmpty'), W/2, H/2);
      return;
    }
    // --- Stats info ---
    info.textContent = '';
    list.innerHTML = '';

    // --- Stacked Percentage Bar ---
    const groups = CAMP_GROUPS.map(function(g) {
      return { name: g.name, short: g.short, color: g.color, codes: g.codes, count: 0 };
    });
    for (const [code, count] of entries) {
      for (const g of groups) { if (g.codes.includes(code)) { g.count += count; break; } }
    }
    const activeGroups = groups.filter(g => g.count > 0);
    activeGroups.sort((a, b) => b.count - a.count); // descending by %

    const barWrap = document.getElementById('statsStackedBar');
    if (activeGroups.length > 0) {
      // Bar row — same width & border-radius as treemap canvas
      const barRow = document.createElement('div');
      barRow.style.cssText = `display:flex;height:24px;border-radius:12px;overflow:hidden;width:${W}px;max-width:100%;margin:0 auto;`;
      for (const g of activeGroups) {
        const pct = (g.count / total) * 100;
        const seg = document.createElement('div');
        seg.style.cssText = `width:${pct}%;background:${g.color};display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3);`;
        seg.textContent = pct >= 3 ? g.short : '';
        seg.title = `${g.name}: ${pct.toFixed(1)}%`;
        barRow.appendChild(seg);
      }
      // Labels row below — percentages only
      const lblRow = document.createElement('div');
      lblRow.style.cssText = `display:flex;width:${W}px;max-width:100%;margin:4px auto 0;`;
      for (const g of activeGroups) {
        const pct = (g.count / total) * 100;
        const lbl = document.createElement('div');
        lbl.style.cssText = `width:${pct}%;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap;`;
        lbl.textContent = `${pct.toFixed(1)}%`;
        lbl.title = `${g.name}: ${pct.toFixed(1)}%`;
        lblRow.appendChild(lbl);
      }
      barWrap.innerHTML = '';
      barWrap.appendChild(barRow);
      barWrap.appendChild(lblRow);
    } else {
      barWrap.innerHTML = '';
    }

    // --- Squarified Treemap ---
    const PAD = 3;
    window._treemapBlocks = []; // store for click detection
    const items = entries.map(([code, count], idx) => {
      const p = PERSONALITIES[code];
      return {
        code, count,
        pct: ((count / total) * 100).toFixed(1),
        area: (count / total) * (W * H),
        hex: STATS_COLORS[code] || '#888',
        tag: p ? (p.easter ? (currentLang==='ja'?'隠し人格':'隐藏人格') : p.tag[currentLang]) : code,
        idx
      };
    });
    // Sort by area descending
    items.sort((a, b) => b.area - a.area);

    // Assign opacity: within each theme, rank by count desc
    const sortedByTheme = [...items].sort((a,b) => {
      if (a.hex !== b.hex) return a.hex.localeCompare(b.hex);
      return b.count - a.count;
    });
    let prevHex = '';
    let rank = 0;
    for (const it of sortedByTheme) {
      if (it.hex !== prevHex) { rank = 0; prevHex = it.hex; }
      it.alpha = (it.hex === '#d4b840') ? 1.0 : OPACITIES[Math.min(rank, 4)];
      rank++;
    }

    squarifyTreemap(ctx, items, PAD, PAD, W - 2*PAD, H - 2*PAD);

    // Canvas click → tooltip
    canvas.onclick = function(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = canvas.width / rect.width;
      const sy = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * sx / dpr;
      const my = (e.clientY - rect.top) * sy / dpr;
      const tt = document.getElementById('treemapTooltip');
      for (const b of window._treemapBlocks) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          tt.innerHTML = `<b style="color:${b.hex};font-size:15px;">${b.code}</b> <span style="font-size:12px;color:var(--muted)">${b.tag}</span><br><span style="color:var(--muted)">${b.pct}%</span>`;
          tt.style.display = 'block';
          tt.style.left = Math.min(e.clientX + 12, window.innerWidth - 220) + 'px';
          tt.style.top = (e.clientY - 40) + 'px';
          setTimeout(() => { tt.style.display = 'none'; }, 2000);
          return;
        }
      }
      tt.style.display = 'none';
    };

  } catch(e) {
      // 失败（限流/网络）与"真的没数据"必须是两种状态，不能都画成空态
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#9a8c7a';
      ctx.fillText(t('statsLoadFail'), W/2, H/2);
      var failInfo = document.getElementById('statsInfo');
      var failList = document.getElementById('statsList');
      if (failInfo) failInfo.textContent = '';
      if (failList) failList.innerHTML = '';
      console.error('Stats load error:', e);
    }
}

// ---- Squarified Treemap (D3.js d3-hierarchy) ----
function squarifyTreemap(ctx, items, x, y, w, h) {
  if (items.length === 0 || w <= 0 || h <= 0) return;
  if (items.length === 1) {
    drawItem(ctx, items[0], x, y, w, h);
    return;
  }
  // Build hierarchy tree for D3
  const root = d3.hierarchy({ children: items })
    .sum(d => d.area)
    .sort((a, b) => b.value - a.value);
  // Compute squarified treemap layout
  d3.treemap()
    .tile(d3.treemapSquarify)
    .size([w, h])
    .paddingInner(2)
    .paddingOuter(1)
    (root);
  // Draw each leaf block
  for (const leaf of root.leaves()) {
    drawItem(ctx, leaf.data, x + leaf.x0, y + leaf.y0, leaf.x1 - leaf.x0, leaf.y1 - leaf.y0);
  }
}

function drawItem(ctx, item, x, y, w, h) {
  if (w <= 0 || h <= 0) return;
  const R = Math.min(8, w/4, h/4); // rounded corner radius
  ctx.fillStyle = hexToRgba(item.hex, item.alpha);
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, R);
  ctx.fill();

  // Store block for click detection
  window._treemapBlocks.push({ x, y, w, h, code: item.code, count: item.count, pct: item.pct, hex: item.hex, tag: item.tag });

  // Text inside block
  const minDim = Math.min(w, h);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (minDim >= 50) {
    // Big block: show code + count + pct
    const fs = Math.max(11, Math.min(Math.floor(minDim / 5), 16));
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.fillText(item.code, x + w/2, y + h/2 - fs/2);
    ctx.font = `${Math.max(9, fs - 2)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(`${item.pct}%`, x + w/2, y + h/2 + fs/2);
  } else if (minDim >= 24) {
    // Medium block: show code only
    const fs = Math.max(10, Math.floor(minDim / 4));
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.fillText(item.code, x + w/2, y + h/2);
  } else if (minDim >= 14) {
    // Tiny block: code at min 8px, clickable for tooltip
    const fs = Math.max(8, Math.floor(minDim / 3));
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(item.code, x + w/2, y + h/2);
  }
  // Ultra-tiny (<14px): no text, but tooltip still works via click
}
