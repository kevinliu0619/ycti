<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YCTI · 摇曳露营人格测试</title>
<style>
:root {
--bg-deep: #0d0d1f;
--bg: #141428;
--card: #1e1e38;
--card-hover: #28284a;
--warm: #e8a850;
--warm-glow: #f0c070;
--fire: #f4a261;
--text: #e8e0d8;
--muted: #9a8c7a;
--accent: #7aa87d;
--border: #333350;
--shadow: rgba(0,0,0,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
background: linear-gradient(180deg, #0d0d1f 0%, #141428 25%, #0a0a18 45%, #010108 60%, #010108 100%);
color: var(--text);
min-height: 100dvh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 16px;
line-height: 1.6;
position: relative;
overflow: hidden;
}
/* Stars */
body::before {
content: '';
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background-image:
radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.6), transparent),
radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,.4), transparent),
radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,.5), transparent),
radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,.3), transparent),
radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,.5), transparent),
radial-gradient(1.5px 1.5px at 85% 10%, rgba(255,255,255,.4), transparent),
radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,.3), transparent),
radial-gradient(1px 1px at 60% 28%, rgba(255,255,255,.35), transparent),
radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,.3), transparent),
radial-gradient(1px 1px at 35% 38%, rgba(255,255,255,.25), transparent),
radial-gradient(1.5px 1.5px at 78% 40%, rgba(255,255,255,.35), transparent);
pointer-events: none; z-index: 0;
}
#app {
width: 100%;
max-width: 480px;
position: relative;
z-index: 1;
}
.screen { display: none; animation: fadeSlide .4s ease; }
.screen.active { display: block; }
@keyframes fadeSlide {
from { opacity: 0; transform: translateY(12px); }
to { opacity: 1; transform: translateY(0); }
}

/* Start Screen */
.start-screen { text-align: center; padding: 8px 0 0; }
.start-screen .camp-icon { font-size: 40px; margin-bottom: 4px; }
.start-screen h1 {
font-size: 28px; font-weight: 800; color: var(--warm);
letter-spacing: 6px; margin-bottom: 2px;
text-shadow: 0 0 20px rgba(232,168,80,.25);
}
.start-screen .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 6px; }
.start-screen .subtitle-cn { font-size: 13px; color: var(--warm); letter-spacing: 2px; margin-bottom: 60px; }

.btn {
display: inline-block;
padding: 14px 48px;
border-radius: 32px;
border: none;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: all .25s;
font-family: inherit;
position: relative;
overflow: hidden;
}
.btn-primary {
background: linear-gradient(135deg, var(--warm), #d49540);
color: #1a1a2e;
box-shadow: 0 4px 20px rgba(232,168,80,.25);
}
.btn-primary:hover {
background: linear-gradient(135deg, var(--warm-glow), var(--warm));
transform: translateY(-2px);
box-shadow: 0 6px 28px rgba(232,168,80,.35);
}
.btn-primary:active { transform: translateY(0) scale(.98); }
.btn-secondary {
background: var(--card);
color: var(--text);
border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--card-hover); border-color: #555; }

.btn-outline {
background: transparent;
color: var(--warm);
border: 1px solid var(--warm);
opacity: 0.8;
}
.btn-outline:hover { background: rgba(232,168,80,0.1); border-color: var(--warm-glow); opacity: 1; }

/* Quiz Screen */
.quiz-screen { padding: 16px 0; }
.progress-bar {
height: 4px;
background: var(--border);
border-radius: 2px;
margin-bottom: 32px;
overflow: hidden;
}
.progress-fill {
height: 100%;
background: linear-gradient(90deg, var(--warm), var(--fire));
border-radius: 2px;
transition: width .4s ease;
box-shadow: 0 0 8px rgba(232,168,80,.3);
}
.question-counter {
font-size: 11px;
color: var(--muted);
margin-bottom: 20px;
letter-spacing: 2px;
text-transform: uppercase;
}
.question-text {
font-size: 18px;
font-weight: 600;
margin-bottom: 28px;
line-height: 1.7;
color: var(--text);
min-height: 60px;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
width: 100%;
padding: 16px 20px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 14px;
text-align: left;
color: var(--text);
font-size: 15px;
cursor: pointer;
transition: all .2s ease;
font-family: inherit;
line-height: 1.5;
position: relative;
}
.option:hover {
border-color: var(--warm);
background: var(--card-hover);
transform: translateX(4px);
box-shadow: 0 2px 12px rgba(232,168,80,.1);
}
.option:active { transform: scale(.98) translateX(4px); }
.option.selected { border-color: var(--warm); background: rgba(232,168,80,.12); }

/* Result Screen */
.result-screen { text-align: center; padding: 0 0 24px; }

/* Hero Image — full-bleed edge-to-edge, flush with viewport top */
.result-hero {
width: 100vw;
margin-top: -16px;
margin-left: calc(-50vw + 50%);
margin-right: calc(-50vw + 50%);
aspect-ratio: 16 / 9;
background: var(--card);
border-radius: 0;
overflow: hidden;
position: relative;
}
.result-hero img {
width: 100%; height: 100%;
object-fit: cover;
display: block;
}
.result-hero::after {
content: '';
position: absolute;
bottom: 0; left: 0; right: 0;
height: 40px;
background: linear-gradient(transparent, var(--bg));
pointer-events: none;
}

/* Result theme colors — text only, no background */
.result-screen.theme-rin .result-code { color: #7eb8da; text-shadow: 0 0 30px rgba(126,184,218,.3); }
.result-screen.theme-rin .result-badge { color: #7eb8da; }
.result-screen.theme-nadeshiko .result-code { color: #e8a0b0; text-shadow: 0 0 30px rgba(232,160,176,.3); }
.result-screen.theme-nadeshiko .result-badge { color: #e8a0b0; }
.result-screen.theme-chiaki .result-code { color: #b89ad4; text-shadow: 0 0 30px rgba(184,154,212,.3); }
.result-screen.theme-chiaki .result-badge { color: #b89ad4; }
.result-screen.theme-aoi .result-code { color: #a8b878; text-shadow: 0 0 30px rgba(168,184,120,.3); }
.result-screen.theme-aoi .result-badge { color: #a8b878; }
.result-screen.theme-ena .result-code { color: #c0b8a8; text-shadow: 0 0 30px rgba(192,184,168,.3); }
.result-screen.theme-ena .result-badge { color: #c0b8a8; }
.result-screen.theme-easter .result-code { color: #d4b840; text-shadow: 0 0 30px rgba(212,184,64,.4); }
.result-screen.theme-easter .result-badge { color: #d4b840; }

.result-badge {
font-size: 11px; letter-spacing: 3px;
margin: 14px 0 6px; text-transform: uppercase;
}
.result-code {
font-size: 52px; font-weight: 800; color: var(--warm);
letter-spacing: 6px; margin-bottom: 4px;
text-shadow: 0 0 30px rgba(232,168,80,.3);
animation: codeReveal .6s ease;
}
@keyframes codeReveal {
from { opacity: 0; transform: scale(.8); letter-spacing: 20px; }
to { opacity: 1; transform: scale(1); letter-spacing: 6px; }
}
.result-role { font-size: 18px; color: var(--text); margin-bottom: 14px; }
.result-quote {
font-size: 14px;
color: var(--muted);
font-style: italic;
margin-bottom: 16px;
line-height: 1.7;
padding: 0 12px;
position: relative;
}
.result-desc {
font-size: 13px;
color: var(--text);
text-align: left;
line-height: 1.8;
padding: 16px;
background: var(--card);
border-radius: 14px;
margin: 0 12px 14px;
border: 1px solid var(--border);
box-shadow: 0 4px 16px var(--shadow);
}
.result-partner {
font-size: 13px;
color: var(--muted);
margin: 0 12px 20px;
line-height: 1.7;
background: var(--card);
padding: 12px 16px;
border-radius: 12px;
border: 1px dashed var(--border);
}
.result-partner strong { color: var(--warm); }
.result-actions { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: nowrap; margin: 0 12px 6px; }
.result-actions .btn { padding: 11px 0; font-size: 14px; flex: 1; }
.result-actions .btn-icon {
width: 42px; height: 42px;
border-radius: 50%;
padding: 0;
display: inline-flex; align-items: center; justify-content: center;
font-size: 20px;
line-height: 1;
border: 1px solid var(--border);
background: var(--card);
color: var(--text);
cursor: pointer;
transition: all .2s;
flex-shrink: 0;
}
.result-actions .btn-icon:hover { background: var(--card-hover); }
.result-actions .btn-icon:active { transform: scale(.95); }

/* Easter Egg */
.easter-tag {
display: inline-block;
padding: 5px 14px;
background: rgba(232,168,80,.15);
color: var(--warm);
border-radius: 12px;
font-size: 11px;
letter-spacing: 2px;
margin-bottom: 12px;
border: 1px solid rgba(232,168,80,.3);
animation: easterGlow 2s ease-in-out infinite;
}
@keyframes easterGlow {
0%,100% { box-shadow: 0 0 8px rgba(232,168,80,.1); }
50% { box-shadow: 0 0 18px rgba(232,168,80,.25); }
}

/* Author Credit */
.author-credit {
font-size: 11px;
color: rgba(255,255,255,.18);
text-align: center;
margin-top: 10px;
letter-spacing: 1px;
}
.version-tag {
font-size: 9px;
color: rgba(255,255,255,.10);
text-align: center;
margin-top: 2px;
}

/* Toast */
.toast {
position: fixed;
bottom: 32px;
left: 50%;
transform: translateX(-50%);
background: var(--card);
color: var(--text);
padding: 10px 24px;
border-radius: 20px;
font-size: 13px;
border: 1px solid var(--border);
opacity: 0;
transition: opacity .3s;
pointer-events: none;
z-index: 100;
box-shadow: 0 4px 16px var(--shadow);
}
.toast.show { opacity: 1; }

/* Canvas hidden */
#shareCanvas { display: none; }

/* ===== Share Modal ===== */
.share-overlay {
display: none;
position: fixed; top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,.75);
z-index: 200;
justify-content: center; align-items: center;
padding: 20px;
}
.share-overlay.show { display: flex; }
.share-modal {
background: var(--card);
border: 1px solid var(--border);
border-radius: 16px;
padding: 28px 24px 24px;
max-width: 360px; width: 100%;
text-align: center;
position: relative;
box-shadow: 0 8px 40px rgba(0,0,0,.5);
}
.share-close {
position: absolute; top: 12px; right: 16px;
background: none; border: none;
color: var(--muted); font-size: 22px;
cursor: pointer; line-height: 1;
}
.share-modal .share-title {
font-size: 13px; color: var(--warm);
letter-spacing: 2px; margin-bottom: 16px;
}
.share-modal .share-code {
font-size: 36px; font-weight: 800;
letter-spacing: 6px;
margin-bottom: 4px;
}
.share-modal .share-tag {
font-size: 16px; color: var(--text);
margin-bottom: 8px;
}
.share-modal .share-quote {
font-size: 12px; color: var(--muted);
font-style: italic;
margin-bottom: 20px;
line-height: 1.6;
padding: 0 12px;
}
.share-qr-wrap {
display: inline-block;
background: #fff;
padding: 12px;
border-radius: 12px;
margin-bottom: 16px;
}
.share-qr-wrap img {
display: block;
width: 150px; height: 150px;
}
.share-modal .share-hint {
font-size: 13px; color: var(--text);
margin-bottom: 8px;
}
.share-modal .share-footer {
font-size: 11px;
color: rgba(255,255,255,.25);
line-height: 1.5;
}

/* Homepage animation */
.video-wrapper {
width: 100%;
margin: 36px 0 0;
padding: 0;
}
.home-video {
width: 100%;
height: auto;
display: block;
margin: 0;
background: #010108;
pointer-events: none;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
position: relative;
z-index: 1;
object-fit: contain;
}

/* Bottom bar (author + version) */
.bottom-bar {
font-size: 11px;
color: rgba(255,255,255,.15);
text-align: center;
padding: 16px 0 4px;
letter-spacing: 1px;
}
</style>
</head>

const GH_STATS_FILE = 'stats.json';

function ghAuth() {

async function ghStatsRead() {

const resp = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'User-Agent': 'YCTI' }
});
if (!resp.ok) return { total: 0, results: {} };

}

async function ghStatsSubmit(personality) {
try {
// Step 1: GET 当前文件 + SHA
const getResp = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'User-Agent': 'YCTI' }
});
let stats = { total: 0, results: {} }, sha = null;
if (getResp.ok) {
const d = await getResp.json();
sha = d.sha;
stats = JSON.parse(atob(d.content));
}
// Step 2: 更新数据
stats.total = (stats.total || 0) + 1;
stats.results[personality] = (stats.results[personality] || 0) + 1;
// Step 3: PUT 写回
const content = btoa(unescape(encodeURIComponent(JSON.stringify(stats))));
const body = { message: 'record: ' + personality, content, branch: 'main' };
if (sha) body.sha = sha;
const putResp = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
method: 'PUT',
headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'YCTI' },
body: JSON.stringify(body)
});
if (!putResp.ok && putResp.status === 409) {
// SHA 冲突：重试一次
const r2 = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'User-Agent': 'YCTI' }
});
if (r2.ok) {
const d2 = await r2.json();
let s2 = JSON.parse(atob(d2.content));
s2.total = (s2.total || 0) + 1;
s2.results[personality] = (s2.results[personality] || 0) + 1;
const c2 = btoa(unescape(encodeURIComponent(JSON.stringify(s2))));
await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
method: 'PUT',
headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'YCTI' },
body: JSON.stringify({ message: 'record: ' + personality, content: c2, sha: d2.sha, branch: 'main' })
});
}
}
} catch(e) { console.warn('stats submit error:', e); }
}

CARB:  { code:'CARB',  role:'葵',  tag:'碳水狂魔葵',  quote:'骑车40公里？不，是为了去那个便利店看看有没有新出的面包。', desc:'你的骑行路线规划不是按距离，是按沿途便利店的数量。你能骑出41km/h的速度——但每次停下来都是因为"这家店看起来不错"。你骑车是为了吃，吃是为了骑车，这是一个完美的循环。', partner:'NOM', partnerText:'你们一起骑车，一起吃饭，一起感叹"人生啊"。', theme:'aoi',easter:false },
LURK:  { code:'LURK',  role:'惠那', tag:'云露营惠那',  quote:'人在被炉，心在营地。点赞从不缺席，出门下次一定。', desc:'你是野活组的编外成员——从未正式加入，但每次露营的群聊你都全程在线。你远程给凛提供建议，撮合野活组和凛认识，偶尔还通风报信。你的参与感不靠到场，靠信息量。你知道的永远比在场的人多。', partner:'OWL', partnerText:'你们在不同的地方，看着同一片星空，互相发消息。', theme:'ena',easter:false },
SHIP:  { code:'SHIP', role:'惠那', tag:'搞事精惠那',  quote:'りんりん～抚子说她马上到哦～', desc:'其实你根本没告诉抚子。你最大的乐趣不是自己搞事，是看别人因为你的安排而相遇。你促成了凛和野活组的第一次接触，方式是"卖队友"。你笑眯眯地站在幕后，看着一切如你所料地发生。', partner:'CHAOS', partnerText:'你们俩的整活组合，能让整个营地鸡飞狗跳。', theme:'ena',easter:false },
DOGGO: { code:'DOGGO', role:'惠那', tag:'爱犬惠那',  quote:'竹轮在哪我在哪。露营可以不去，狗不能不撸。', desc:'你给竹轮买了35000日元的专属露营装备——包括一顶10000日元的狗帐篷。你计划18岁考驾照，不是为了自己，是为了带竹轮去更远的地方。别人问你为什么不加入野活部，你说"还没打算从归宅部毕业"——其实就是想多陪竹轮。', partner:'WAN!', partnerText:'你们不需要语言。你懂它，它懂你。', theme:'ena',easter:false },
COZY:  { code:'COZY',  role:'惠那', tag:'被炉星人惠那',  quote:'被炉是宇宙的中心。冬天+被炉+零食+手机=幸福。', desc:'你的作息极其不规律，早起是你最大的敌人。你可以在被炉里度过整个冬天，靠手机远程参与一切社交活动。你知道这样不太好——但被炉真的很暖和，手机真的很好玩，外面的世界可以再等等。', partner:'SEYANA', partnerText:'你们一起躺在被炉里，一句话不说，但都觉得"这样就挺好"。', theme:'ena',easter:false },
// Easter eggs
'WAN!': { code:'WAN!', role:'竹轮', tag:'竹轮本犬', quote:'汪！', desc:'你不需要成为人群的焦点——你只需要一个人。你的世界不大：就是那个人 + 一个温暖的窝 + 永远摸不完的头。你的幸福公式很简单：被需要 = 幸福。人类露营关你什么事？你在你的小窝里等着就行——反正那个人会带你去。', partner:'DOGGO', partnerText:'她是你的全世界，你是她的全部。', theme:'easter',easter:true },
'6CAN': { code:'6CAN', role:'老师', tag:'酒鬼老师', quote:'六罐姐可不是白叫的。', desc:'白天你是所有人的依靠——靠谱、温和、永远在照顾别人。但下班铃一响，脱下外套，打开第一罐啤酒的那一刻，另一个你醒了。你不需要被理解，你只需要再来一罐。戒酒期间你迷上了黄油曲奇——但戒酒结束后又开了一瓶。', partner:'USOYARE', partnerText:'喝醉后听她讲故事，你分不清是自己醉了还是故事太离谱。', theme:'easter',easter:true },
SAGE:  { code:'SAGE',  role:'爷爷', tag:'露营仙人', quote:'你年轻时帐篷还是帆布的。', desc:'你走过很多路，修过很多车，认识很多人——但从不刻意。你从不教别人该怎么活，你只是活给他们看。有人问你去哪，你说"随便走走"——然后一走就是一年。你的装备不新，但每一样都有故事。你把帐篷、煤油灯、露营指南书传给下一个人，就像把一种生活方式悄悄种进他们的生命。', partner:'LONE', partnerText:'你们坐在一起，各自看书，偶尔抬头对视一眼。你从没说出来——但她是你见过最像你的人。', theme:'easter',easter:true },
'3776': { code:'3776', role:'中毒者', tag:'富士山中毒者', quote:'3776米。这不是数字，是信仰。', desc:'你对富士山的爱超越了理性。你能从任何角度认出富士山，你能说出每个观景点的最佳时间。你看到富士山的时候，会停下一切，安静地看很久。它不只是山——它是你心里的坐标系。不管走多远，只要能看到它，你就知道自己没走丢。', partner:'PAGE', partnerText:'和她一起安静地看富士山，不用说话，就是最好的陪伴。', theme:'easter',easter:true },
CHILL: { code:'CHILL', role:'绫乃', tag:'慵懒骑士绫乃', quote:'绫乃的体力是三人中最差的——但没关系，反正骑完摩托瘫在地上也很舒服。', desc:'答应朋友的事你可能拖了很久——但最后你还是骑着摩托、跨了几个县界到了。你体力不好？没事，躺在地上看星星也很舒服。你对朋友的心意从不打折——路上花了多久不重要，重要的是你来了。', partner:'TSUN', partnerText:'你们在路上并排骑行。她开得快，你开得慢，但最后都会在露营地碰头。她知道你一定会到，所以你迟到她也从不催。', theme:'easter',easter:true },
DRIVE: { code:'DRIVE', role:'樱姐', tag:'飙车党樱姐', quote:'いいよ。', desc:'你不说"我爱你"，你说"いいよ"。两个字，背后是深夜三小时的山路。朋友凌晨迷路了，你没说"你疯了"，你说"发我定位"。你开车穿过黑夜，不是因为你想露营——是因为有人在那个营地里等你。你表面冷淡，但方向盘从不犹豫。', partner:'DASH', partnerText:'你嘴上骂她冒失，但每次都是你开车去救她。她知道你会来，所以她才敢乱跑。', theme:'easter',easter:true },
ASAKA: { code:'ASAKA', role:'亚咲花', tag:'露营之声亚咲花', quote:'露营地放的歌，十首里有五首是你的。', desc:'你不一定在现场，但你的声音在。你唱过的歌变成了别人的露营BGM，变成了他们出发时的闹铃，变成了篝火旁的大合唱。你创造的不是音乐——是记忆的背景音。每一次有人按下播放键，你就陪他们又出发了一次。', partner:'AFRO', partnerText:'你们是彼此的因果。一支笔创造一个世界，一首歌给它温度。不需要见面——歌响起的时候，你们就在一起。', theme:'easter',easter:true },
AFRO:  { code:'AFRO',  role:'Afro老师', tag:'部活创世神', quote:'爆炸头是本体，露营是信仰。想不出故事的时候就出去取材。', desc:'你喜欢把去过的地方画进作品里，把认识的人变成角色，把路边吃过的咖喱面画成名场面。你的创作不是凭空想象——是你把生活嚼碎了，重新拼成一幅画。你画的露营地后来变成了别人出发的理由。', partner:'ASAKA', partnerText:'你的世界给了她歌唱的理由，她的歌声让你的世界有了温度。一支笔，一首歌——同一个世界，两种表达。', theme:'easter',easter:true },
MONO:  { code:'MONO',  role:'摄影部', tag:'摄影部部员', quote:'用镜头记录的日常，和用帐篷记录的星空，是同一种浪漫。', desc:'别人忽略的瞬间——黄昏的光线角度、路边野猫的哈欠——在你眼里全是宝藏。按下快门不是技术活，是本能。你带着相机走走停停，不知道会拍到什么——但你知道，一定会拍到什么。露营的时候，你比谁都安静，但你的眼里装满了别人没注意到的风景。', partner:'AFRO', partnerText:'你们都是「用画面讲故事」的人。一个画，一个拍——同一个世界，两种表达。', theme:'easter',easter:true },
AQUA:  { code:'AQUA',  role:'水水人', tag:'沼津水水人', quote:'山里的咖喱面确实不错。但你来沼津尝尝海边的橘子——那是另一种甜。', desc:'当全世界的露营爱好者都涌向山梨和富士山的时候，你站在駿河湾边微微一笑。你知道好风景不只在山里——海岸线、海上的鸟居、海风里的咸味，同样是出发的理由。你去过本栖湖，也去过海边。你心里的地图，山和海各占一半。', partner:'3776', partnerText:'你们是静冈的一体两面：你爱海，她爱山。3776米加駿河湾，刚好拼成一个完整的静冈。', theme:'easter',easter:true },
};

{ text:'露营当晚，有人开始讲山里的怪谈。帐篷外有风声，远处有动物叫……', camp:'nadeshiko', options:[
{text:'「别讲了别讲了别讲了——」整个人缩进睡袋，只露出眼睛',scores:{'BOO!': 2, 'WEEP': 1, 'NOM': 1}},
{text:'「嗯～」其实已经快睡着了，根本没在听',scores:{'SEYANA': 2, 'COZY': 1}},
{text:'面无表情听着，等讲到最恐怖的地方，突然冷冷地补了一句更吓人的',scores:{'TSUN': 2, 'SHIP': 1, 'BOO!': 1}}
]},
{ text:'出远门旅行时，你的包里一定会有……', camp:'nadeshiko', options:[
{text:'一本书。目的地可以变，书不能不带',scores:{'SPA': 1, 'OWL': 1, 'LONE': 1}},
{text:'零食。而且是那种到了目的地会变得更好吃的零食',scores:{'NOM': 1, 'CHEF': 1}},
{text:'一本铁道时刻表。你甚至在出发前就把换乘方案做好了',scores:{'CHOO': 2, 'PAGE': 1}}
]},
{ text:'社团经费捉襟见肘。有人从二手店买回来一个「超便宜的碗」，发现……', camp:'chiaki', options:[
{text:'「一千日元买了个破碗？下次经费申请必须过我这关」',scores:{'MOM': 1, '6CAN': 1}},
{text:'「七百日元！你被人骗了吧？！」笑得最大声，但也帮忙想办法',scores:{'CHAOS': 2, 'BROKE': 1, 'CHEF': 1}},
{text:'「算了算了，反正可以拿回家给我妈装仙人掌」——反正不是你的钱',scores:{'SEYANA': 1, 'USOYARE': 1, 'WEEP': 1}}
]},
{ text:'大家围坐在篝火旁，有人提议每个人讲一个自己最糗的露营经历……', camp:'chiaki', options:[
{text:'「第一次露营忘了带打火机，用放大镜生的火」——讲完发现大家看你的眼神不太对',scores:{'PAGE': 1, 'LONE': 1, 'SHIP': 1}},
{text:'「我上次把帐篷搭在斜坡上，半夜滚到了帐篷底部，像睡在滑梯上」——边说边笑到岔气',scores:{'CHAOS': 1, 'BROKE': 1, 'DASH': 1}},
{text:'「我……我没什么糗事。真的。」——但脸已经红到篝火都黯然失色',scores:{'USOYARE': 1, 'BOO!': 2, 'DOGGO': 1}}
]},
{ text:'社团群里有人发了一张新的露营装备图，价格不菲……', camp:'chiaki', options:[
{text:'默默存图，打开二手网站搜索同款',scores:{'BROKE': 2, 'CARB': 1, 'LURK': 1}},
{text:'「这个好棒！谁买了借我用用！」——然后被群嘲「你自己买啊」',scores:{'CHAOS': 2, 'WEEP': 1}},
{text:'「我上次在店里看到过，实际重量比标称重了200克，建议买老款」——发完没人回了',scores:{'CHOO': 2, 'PAGE': 1, '6CAN': 1}}
]},
{ text:'新年第一天。你许了一个关于露营的愿望……', camp:'chiaki', options:[
{text:'「今年也要一个人去更多没去过的地方」',scores:{'LONE': 1, 'OWL': 1, 'CARB': 1}},
{text:'「希望今年能带家人/朋友来一次露营」——虽然他们不一定想来',scores:{'SUNNY': 1, 'WEEP': 1, 'MOM': 1, 'DOGGO': 1}},
{text:'「希望今年能攒够钱把想买的装备都买了……」——去年的愿望也是这个',scores:{'BROKE': 2, '6CAN': 1}}
]},
{ text:'露营时，你发现有人偷偷把你的篝火柴抱走了（他以为是公共柴堆）……', camp:'chiaki', options:[
{text:'默默去捡了新的柴。反正山里到处都是',scores:{'OWL': 1, 'SHIP': 1, 'COZY': 1}},
{text:'「喂喂喂那是我的柴！你拿之前至少问一句吧！」——但最后又分了他一半',scores:{'TSUN': 2, 'CHAOS': 1, 'MOM': 1}},
{text:'追上去：「你拿柴要干嘛？要不要顺便一起烤红薯？」——结果变成了一场小型野餐',scores:{'SUNNY': 1, 'CHEF': 1, 'NOM': 1, 'SHIP': 1}}
]},
{ text:'学校文化祭，社团的展位该怎么布置？', camp:'chiaki', options:[
{text:'用卡纸搭了个迷你帐篷展示区，旁边放了真实露营装备给人摸',scores:{'CARB': 1, 'CHEF': 1}},
{text:'搞了个「野活部咖啡厅」——卖手冲咖啡和烤棉花糖，生意好到排长队',scores:{'CHEF': 2, 'NOM': 1}},
{text:'「我们把被炉搬来吧！」——最后展位变成了一堆人挤在被炉里聊露营趣事',scores:{'COZY': 1, 'AFRO': 1, 'BROKE': 1}}
]},
{ text:'你发现一条绝美的林间小路，地图上没有标注……', camp:'chiaki', options:[
{text:'骑过去看看——大不了掉头。未知本身就是风景',scores:{'DASH': 2, 'LONE': 1, 'DRIVE': 1}},
{text:'「这条路太棒了！回头一定要带大家来！」已经在心里列好了邀请名单',scores:{'SUNNY': 1, 'NOM': 1, 'DOGGO': 1}},
{text:'先用手机记下路口坐标，查了一遍安全信息，再决定走不走',scores:{'LURK': 2, 'CHOO': 1, 'PAGE': 1}}
]},
{ text:'社团需要决定下一个露营地点。大家在讨论……', camp:'aoi', options:[
{text:'「我推荐这个营地，海拔1500米，有温泉，晚上能看到银河。」——资料已经整理好了',scores:{'LURK': 2, 'PAGE': 1, '3776': 1}},
{text:'「去哪都行！只要有好吃的！上次那个营地的烤红薯真的太绝了！」',scores:{'NOM': 1, 'CHEF': 1}},
{text:'「随便。你们定吧，反正我跟着去就行。」——其实心里已经想好了三个备选方案',scores:{'SEYANA': 1, 'USOYARE': 2}},
{text:'「山里去了很多次了，要不要试试海边？海边露营看日出不用爬山」',scores:{'AQUA': 1}}
]},
{ text:'你的朋友说「想尝试一个人露营但有点害怕」。你怎么回应？', camp:'aoi', options:[
{text:'「一开始害怕很正常。先从离家近的营地开始，带上喜欢的书和吃的，慢慢就习惯了」',scores:{'MOM': 2, 'PAGE': 1}},
{text:'「我陪你第一次去！第二次你就不怕了——大概吧！」',scores:{'DASH': 1, 'SUNNY': 1, 'CHAOS': 1}},
{text:'发了一堆链接：必买装备清单、推荐的营地、天气预报、附近温泉……比旅行社还详细',scores:{'LURK': 2, 'DOGGO': 1, 'COZY': 1}}
]},
{ text:'夏天露营，蚊虫非常多。你的防蚊策略是……', camp:'aoi', options:[
{text:'全身喷满防蚊喷雾，带了蚊香，帐篷有防蚊网——三重防护，万无一失',scores:{'MOM': 2, 'LONE': 1, 'CARB': 1}},
{text:'「蚊子也是大自然的一部分嘛～」——十分钟后，「蚊子太多了救命啊啊啊」',scores:{'BOO!': 2, 'WEEP': 1, 'CHAOS': 1}},
{text:'「穿长袖长裤就行了吧？」——结果只有脸被咬了，看起来像过敏',scores:{'SEYANA': 1, 'USOYARE': 1, '6CAN': 1}},
{text:'「海边就没那么多蚊子——海风吹着，蚊虫站不住脚」',scores:{'AQUA': 1}}
]},
{ text:'你正骑着自行车爬一个看不到尽头的上坡。导航显示还有3公里，但你的腿已经快没知觉了……', camp:'aoi', options:[
{text:'「嗯～算了，下来推吧。」——推着车走也是一种骑行',scores:{'SEYANA': 2, 'COZY': 1}},
{text:'咬牙继续踩——因为山顶有家面包店，据说他们家的蜜瓜包是附近最好吃的',scores:{'CARB': 2, 'NOM': 1, 'DASH': 1}},
{text:'「这算什么！上次我从滨松骑到山梨都没死！」——然后开始跟路人吹自己骑过的最远距离',scores:{'USOYARE': 2, 'CHAOS': 1}}
]},
{ text:'露营时，有人在你面前一本正经地讲了一个「亲身经历」——但你总觉得哪里不对……', camp:'aoi', options:[
{text:'「真的假的？！」——然后全信了，还追问细节',scores:{'WEEP': 2, 'SUNNY': 1, 'BOO!': 1}},
{text:'「嘛～」——其实你一个字都不信，但懒得拆穿',scores:{'SEYANA': 2, 'SHIP': 1}},
{text:'听完之后，面不改色地补了一句更离谱的，现在轮到他怀疑你了',scores:{'USOYARE': 2, 'TSUN': 1, 'CHAOS': 1}}
]},
{ text:'你在餐厅打工攒钱买露营装备。有顾客来买东西，你发现他买的都是露营相关的东西……', camp:'aoi', options:[
{text:'默默算了一下总价，心想「这位也是露营人啊」',scores:{'PAGE': 1, 'MOM': 1, 'CARB': 1, 'BROKE': 1}},
{text:'「这个炉子超好用的！上次我用它烧水泡了杯咖喱面，绝了！」',scores:{'SUNNY': 1, 'NOM': 1, '6CAN': 1, 'AFRO': 1}},
{text:'结完账对着顾客的背影说了一句「一路顺风」，虽然不知道对方要去哪',scores:{'MOM': 2, 'USOYARE': 1, 'SEYANA': 1}},
{text:'「您也是露营爱好者啊？山里还是海边？我两个都喜欢，但最近觉得海边也不错——」',scores:{'AQUA': 1}}
]},
{ text:'大家决定去泡温泉。脱了衣服发现旁边池子里居然是熟人……', camp:'aoi', options:[
{text:'装作若无其事继续泡。内心：「为什么她们也在」——但也没走',scores:{'SPA': 2, 'LONE': 1, 'TSUN': 1}},
{text:'「哇好巧好巧好巧！」——直接跨池子过来了',scores:{'SUNNY': 1, 'CHAOS': 1, 'NOM': 1, 'CHEF': 1}},
{text:'泡在温泉里闭着眼，一句话没说，脸不知道是被蒸气烫的还是别的什么原因',scores:{'USOYARE': 1, 'ASAKA': 1, 'CHILL': 1}}
]},
{ text:'你的LINE状态栏写着「正在露营中」。有人评论「好想一起去」，你……', camp:'ena', options:[
{text:'已读不回。默默计划着下次独自出发的路线',scores:{'OWL': 2, 'LONE': 1, 'PAGE': 1}},
{text:'「来呀来呀！下次一起去！」——但你已经在群里发完定位了',scores:{'SUNNY': 1, 'COZY': 1, 'LURK': 1, 'SHIP': 2}},
{text:'「りんりん～下次一起去怎么样？」——其实你根本没打算去，但不妨碍你撮合别人去',scores:{'SHIP': 2, 'WAN!': 1, 'CHILL': 1}}
]},
{ text:'社团的LINE群里，有人深夜三点发了一条「好想去看星星」……', camp:'ena', options:[
{text:'第二天早上看到，回了一句「看到了。下次去。晚安。」',scores:{'LONE': 1, 'TSUN': 1, 'PAGE': 1, 'SHIP': 1}},
{text:'「走啊！！现在就去！！」——然后发现只有自己在激动，其他人全在睡',scores:{'CHAOS': 1, 'SHIP': 1, 'CHILL': 1}},
{text:'你也是凌晨三点没睡的人。你回了一句「走吧」，然后真的拿着车钥匙出门了',scores:{'DRIVE': 1, 'DASH': 1, 'USOYARE': 1}}
]},
{ text:'一个雨天，你本来计划去露营但取消了。在家你怎么过？', camp:'ena', options:[
{text:'搭了个室内帐篷，泡了杯咖啡，打开露营视频当背景音——假装自己在山里',scores:{'SPA': 2, 'LONE': 1, 'COZY': 1}},
{text:'把所有装备翻出来擦了一遍，重新整理了背包，列了下一次露营的采购清单',scores:{'CARB': 2, 'MOM': 1, 'CHOO': 1}},
{text:'窝在被炉里刷了一整天露营博主的视频，然后给每个人发了「下次一起去这里！！」',scores:{'COZY': 1, 'LURK': 1}}
]},
{ text:'有人提议大家一起去看元旦日出。凌晨四点集合，有人迟到了……', camp:'ena', options:[
{text:'四点钟准时到了，给每个人发了一条「人呢」的LINE，然后就安静等着',scores:{'LONE': 1, 'PAGE': 1, 'MOM': 1, 'CHOO': 1}},
{text:'「对不起对不起对不起！！！」从远处跑过来，围巾都跑散了一半',scores:{'DASH': 1, 'BROKE': 1, 'WEEP': 1, 'BOO!': 1}},
{text:'你根本没来。你躺在被炉里刷着群聊，看他们一边等人一边骂你',scores:{'COZY': 1, 'LURK': 1, 'CHILL': 1, 'DRIVE': 1}}
]},
{ text:'你在地铁/公交上看到有人背着大包露营装备……', camp:'ena', options:[
{text:'默默观察对方的装备品牌和型号，心里评估了一下搭配',scores:{'LURK': 2, 'CHOO': 1, 'CARB': 1}},
{text:'「您好！请问您是要去露营吗？去哪？用什么帐篷？推荐吗？」——对方可能想换车厢',scores:{'SUNNY': 1, 'CHAOS': 1, 'AFRO': 1, 'BROKE': 1}},
{text:'看了一眼，然后继续看手机。但嘴角微微上扬——「同好」',scores:{'TSUN': 2, 'LONE': 1}}
]},
{ text:'你在房间墙上贴了一张地图，上面标记了……', camp:'ena', options:[
{text:'所有去过的地方，用不同颜色的图钉区分季节。下面还有一本手写笔记',scores:{'PAGE': 1, 'OWL': 1, 'CHOO': 2, 'AFRO': 1}},
{text:'所有想去的地方，已经插了快三十个图钉。每次看到都觉得自己还有好多地方没去',scores:{'DASH': 1, 'SUNNY': 1, '3776': 1, 'BROKE': 1}},
{text:'其实没有地图。你在手机备忘录里存了一个列表，但自己也经常忘了看',scores:{'SEYANA': 2, 'LURK': 1, 'COZY': 1}}
]},
{ text:'凌晨一点，你朋友从露营地打来电话，声音有点慌：「我好像……找不到回帐篷的路了。」你……', camp:'ena', options:[
{text:'「发我定位，我马上到。」——虽然你离她有两个小时车程，但你已经拿起了车钥匙',scores:{'DRIVE': 2, 'DASH': 1, 'MOM': 1}},
{text:'打开地图，远程指导她：「你先往东走，看到那个大石头了吗？对，就是那个，然后左转……」',scores:{'LURK': 2, 'MOM': 1, 'CHOO': 1}},
{text:'「你往天上看，看到北斗七星了吗？朝着那个方向走。」——你其实也不知道管不管用',scores:{'SAGE': 2, 'SHIP': 1, 'USOYARE': 1}}
]},
{ text:'露营结束，大家聚在居酒屋。有人提议干杯……', camp:'easter', options:[
{text:'「先来六罐啤酒，一人一罐。」——然后一个人喝了四罐，开始讲年轻时露营的故事',scores:{'6CAN': 2, 'SAGE': 1, 'CHAOS': 1}},
{text:'「我不喝酒，给我乌龙茶。」——但旁边的人都在说「你上次也这么说」',scores:{'USOYARE': 1, 'SHIP': 1}},
{text:'发了一条动态到SNS：「又一次露营，又一次干杯」',scores:{'ASAKA': 1, 'LURK': 1, 'SUNNY': 1}}
]},
{ text:'你最喜欢的一件露营装备，它的故事是……', camp:'easter', options:[
{text:'是爷爷用过的老式煤油灯，有几十年的历史，上面的划痕都是故事',scores:{'SAGE': 2, 'LONE': 1, 'WAN!': 1}},
{text:'是自己打工攒了两个月买的睡袋——拿到手那晚抱着睡了一觉',scores:{'SUNNY': 1, 'BROKE': 2, 'NOM': 1, 'DOGGO': 1}},
{text:'其实是别人送的。每次用它的时候都会想起那个人',scores:{'DOGGO': 2, 'COZY': 1, 'SEYANA': 1, 'CHOO': 1}}
]},
{ text:'你正准备出门露营，你的狗（或者你想象中的狗）看到你拿出装备……', camp:'easter', options:[
{text:'直接跳进你的背包里，用眼神告诉你：「不带我，你也别想走。」',scores:{'WAN!': 1, 'SUNNY': 1, 'DASH': 1}},
{text:'淡定地趴在窝里，一副「你走吧，反正你回来还得撸我」的表情',scores:{'DOGGO': 2, 'TSUN': 1, 'SEYANA': 1}},
{text:'叼着它最喜欢的玩具过来，放在你的装备旁边，然后抬头看你',scores:{'WEEP': 1, 'MOM': 1}}
]},
{ text:'圣诞节。社团决定办圣诞露营，每个人要带一份礼物来交换……', camp:'mixed', options:[
{text:'非常认真地挑了一个实用露营装备，包装得工工整整',scores:{'DOGGO': 2, 'LONE': 1, 'MOM': 1}},
{text:'「我带了袜子和暖宝宝！」——把家里多余的东西拿来凑数，但包装纸是全场最闪的',scores:{'SUNNY': 1, 'COZY': 1, 'BROKE': 1, 'CARB': 1}},
{text:'带了一本露营指南书，扉页上写着「爷爷年轻时用的就是这本」——全场最复古',scores:{'SAGE': 2, 'PAGE': 1, 'DASH': 1}}
]},
{ text:'毕业季。大家讨论毕业后各自的打算……', camp:'mixed', options:[
{text:'「继续露营。一个人也好，一群人也罢，帐篷在哪我在哪」',scores:{'DASH': 2, 'LONE': 1, 'TSUN': 1}},
{text:'「去哪不重要，重要的是露营的时候还能不能吃到好吃的……」',scores:{'NOM': 1, 'WEEP': 1, 'SUNNY': 1}},
{text:'「嗯～反正你们的群聊我不会退，到时候你们去哪我就跟去哪」',scores:{'SEYANA': 1, 'MOM': 1, 'COZY': 1}}
]},
{ text:'旅途中看到一个绝佳的风景。你停下来，发现这个位置……', camp:'mixed', options:[
{text:'安静地看了很久，把它记在心里，不拍照不发动态',scores:{'OWL': 1, 'PAGE': 1, 'LONE': 1}},
{text:'从五个角度看了十五分钟，选了最好看的角度，发了一条SNS动态',scores:{'ASAKA': 1, 'LURK': 1, 'SUNNY': 1}},
{text:'掏出笔记本，只画了一张速写，对自己说「剩下的等回去再慢慢想」',scores:{'CARB': 1, 'PAGE': 1, 'CHOO': 1}},
{text:'「这个角度……如果等日落再看，光线会更好。」——然后真的坐下来等了二十分钟',scores:{'MONO': 1}}
]},
{ text:'樱花季，你来到一个樱花树下的露营地点。樱花正满开……', camp:'mixed', options:[
{text:'把帐篷搭在花瓣飘不到的地方（要清理很麻烦），然后安静地看书赏花',scores:{'LONE': 1, 'PAGE': 1, 'SPA': 1, 'WAN!': 1}},
{text:'「樱花+露营！这是什么神仙组合！！」——激动得原地转了三圈，然后开始做樱花主题的露营便当',scores:{'CHEF': 2, 'SUNNY': 1, 'AFRO': 1}},
{text:'把帐篷搭在樱花树下，然后躺在帐篷里透过天窗看花瓣飘落——被花瓣埋了半截帐篷也不在意',scores:{'COZY': 2, 'CHILL': 1, 'SEYANA': 1}}
]},
{ text:'秋天露营，营地周围全是红叶。你……', camp:'mixed', options:[
{text:'泡了杯茶，坐在折叠椅上，看着红叶发呆——这就是秋天的正确打开方式',scores:{'SPA': 2, 'OWL': 1, 'PAGE': 1, 'CHILL': 1}},
{text:'捡了一大把红叶，说要带回去做书签，结果一路掉了一大半',scores:{'DASH': 1, 'BOO!': 1, 'SUNNY': 1}},
{text:'捡了一大把红叶夹进笔记本里，说「等压干了就知道好不好看了」——可能要等半年',scores:{'CARB': 1, 'CHOO': 1, 'ASAKA': 1}}

// ============================================================
// STATE
// ============================================================
let shuffledQuestions = [];
let currentQ = 0;
let scores = {};
let questionOrder = [];

function shuffle(arr) {
const a = [...arr];
for (let i = a.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}
return a;
}

// ============================================================
// SCREENS
// ============================================================
function showScreen(id) {
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById(id).classList.add('active');
// Only result page allows scrolling; other pages locked
if (id === 'resultScreen') {
document.body.style.overflowY = 'auto';
document.body.style.overflowX = 'hidden';
document.body.style.justifyContent = 'flex-start';
} else {
document.body.style.overflow = 'hidden';
document.body.style.justifyContent = 'center';
}
}

function selectQuestions(questions, count) {
// 阵营均衡抽题：五大阵营各至少 2 题，彩蛋至少 1 题
const byCamp = {};
for (let i = 0; i < questions.length; i++) {
const c = questions[i].camp;
if (!byCamp[c]) byCamp[c] = [];
byCamp[c].push(i);
}
const mainCamps = ['rin', 'nadeshiko', 'chiaki', 'aoi', 'ena'];
const guaranteed = [];
for (const camp of mainCamps) {
const pool = byCamp[camp] || [];
shuffleArray(pool);
guaranteed.push(...pool.slice(0, 2));
}
if (byCamp['easter']) {
shuffleArray(byCamp['easter']);
guaranteed.push(byCamp['easter'][0]);
}
const used = new Set(guaranteed);
const remaining = [];
for (let i = 0; i < questions.length; i++) {
if (!used.has(i)) remaining.push(i);
}
shuffleArray(remaining);
const selected = [...guaranteed, ...remaining.slice(0, count - guaranteed.length)];
shuffleArray(selected);
return selected.map(i => questions[i]);
}

function shuffleArray(arr) {
for (let i = arr.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
}

function startQuiz() {
scores = {};
currentQ = 0;
// 阵营均衡抽题：从 50 题中选 20 题
shuffledQuestions = selectQuestions(QUESTIONS, 20);
questionOrder = shuffledQuestions.map((_, i) => i);
showScreen('quizScreen');
renderQuestion();
}

function renderQuestion() {
const q = shuffledQuestions[currentQ];
const total = shuffledQuestions.length;
document.getElementById('progressFill').style.width = ((currentQ / total) * 100) + '%';
document.getElementById('qCounter').textContent = `第 ${currentQ + 1} / ${total} 题`;
document.getElementById('qText').textContent = q.text;
const optsEl = document.getElementById('options');
optsEl.innerHTML = '';
// Shuffle options for variety
const labels = ['A','B','C','D'];
const shuffled = q.options.map((opt, i) => ({...opt, origIdx: i}));
for (let i = shuffled.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
}
shuffled.forEach((opt, i) => {
const btn = document.createElement('button');
btn.className = 'option';
btn.textContent = labels[i] + '. ' + opt.text;
btn.addEventListener('click', () => selectOption(opt.origIdx));
optsEl.appendChild(btn);
});
}

function selectOption(idx) {
const q = shuffledQuestions[currentQ];
const opt = q.options[idx];

// Visual feedback: highlight selected
const allOpts = document.querySelectorAll('.option');
allOpts.forEach(o => o.style.pointerEvents = 'none');
// Find the button that corresponds to this option
const buttons = document.querySelectorAll('#options .option');
for (const btn of buttons) {
if (btn.textContent.includes(opt.text.substring(0, 10))) {
btn.classList.add('selected');
break;
}
}

// Add scores
for (const [key, val] of Object.entries(opt.scores)) {
scores[key] = (scores[key] || 0) + val;
}

setTimeout(() => {
currentQ++;
if (currentQ >= shuffledQuestions.length) {
showResult();
} else {
renderQuestion();
document.getElementById('progressFill').style.width = ((currentQ / shuffledQuestions.length) * 100) + '%';
document.getElementById('qCounter').textContent = `第 ${currentQ + 1} / ${shuffledQuestions.length} 题`;
}
}, 200);
}

// ============================================================
// MATCHING ALGORITHM
// ============================================================
function computeResult() {
// Get all 22 main personalities sorted by score
const mainKeys = Object.keys(PERSONALITIES).filter(k => !PERSONALITIES[k].easter);
mainKeys.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));

// Get top 2, randomly pick one
const top2 = mainKeys.slice(0, 2);
const pick = top2[Math.floor(Math.random() * Math.min(2, top2.length))];

// Check easter eggs: score >= 3 AND probabilistic chance
// Easter triggers with probability = easterScore / (mainMax * 7)
const mainMax = scores[top2[0]] || 0;
const easterKeys = Object.keys(PERSONALITIES).filter(k => PERSONALITIES[k].easter);
const qualified = easterKeys.filter(k => (scores[k] || 0) >= 3);

if (qualified.length > 0 && mainMax > 0) {
// Sort by score descending
qualified.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
// Check each qualified easter with probability
for (const ek of qualified) {
const prob = (scores[ek] || 0) / (mainMax * 7);
if (Math.random() < prob) {
return { key: ek, easter: true };
}
}
}

return { key: pick, easter: false };
}

function showResult() {
const result = computeResult();
const p = PERSONALITIES[result.key];
const partner = PERSONALITIES[p.partner];

showScreen('resultScreen');

// Apply theme color
const rs = document.getElementById('resultScreen').querySelector('.result-screen');
rs.className = 'result-screen theme-' + (p.theme || 'rin');

// Hero image — use default for now, personality-specific images later
var heroImg = document.querySelector('#resultHero img');
heroImg.src = HERO_DEFAULT;

document.getElementById('easterTag').innerHTML = result.easter ? '<span class="easter-tag">🔒 隐藏人格解锁</span>' : '';
document.getElementById('resultBadge').textContent = 'YCTI · 摇曳露营人格';
document.getElementById('resultCode').textContent = p.code;
document.getElementById('resultRole').textContent = p.tag;
document.getElementById('resultQuote').textContent = p.quote;
document.getElementById('resultDesc').textContent = p.desc;
var ptColor = THEME_COLORS[partner.theme] || '#7eb8da';
document.getElementById('resultPartner').innerHTML = 
'🤝 最佳拍档：<strong style="color:' + ptColor + '">' + partner.code + '</strong> <span style="color:var(--text)">' + partner.tag + '</span> — ' + p.partnerText;

// Store for sharing
window._resultData = { code: p.code, tag: p.tag, quote: p.quote, desc: p.desc, 
partnerCode: partner.code, partnerTag: partner.tag, partnerText: p.partnerText, easter: result.easter, theme: p.theme, partnerTheme: partner.theme };

// Submit to GitHub stats
ghStatsSubmit(result.key);
}

// ============================================================
// SHARE (Canvas) — mirrors #resultScreen layout exactly
// ============================================================
function shareResult() {
const d = window._resultData;
if (!d) return;

const canvas = document.getElementById('shareCanvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 853;

// Theme-derived colors
const codeColor = THEME_COLORS[d.theme] || '#e8a850';
const ptColor = THEME_COLORS[d.partnerTheme] || '#7eb8da';

// ===================================================================
// 1. BACKGROUND — mirror body CSS gradient
// ===================================================================
const bg = ctx.createLinearGradient(0, 0, 0, H);
bg.addColorStop(0,     '#0d0d1f');
bg.addColorStop(0.25,  '#141428');
bg.addColorStop(0.45,  '#0a0a18');
bg.addColorStop(0.60,  '#010108');
bg.addColorStop(1,     '#010108');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// Stars — a few subtle dots to match body::before
ctx.fillStyle = 'rgba(255,255,255,.35)';
var stars = [[48,36],[120,22],[216,30],[312,18],[408,26],[168,62],[288,54],[96,80],[384,72],[240,66]];
for (var si = 0; si < stars.length; si++) {
ctx.beginPath();
ctx.arc(stars[si][0], stars[si][1], 0.8, 0, Math.PI * 2);
ctx.fill();
}

// ===================================================================
// 2. HERO IMAGE — 270 px (16:9 aspect on 480 width)
// ===================================================================
var heroImg = document.querySelector('#resultHero img');
if (heroImg && heroImg.complete && heroImg.naturalWidth > 0) {
var iw = heroImg.naturalWidth, ih = heroImg.naturalHeight;
var scale = Math.max(W / iw, 270 / ih);
var sw = W / scale, sh = 270 / scale;
var sx = (iw - sw) / 2, sy = (ih - sh) / 2;
ctx.drawImage(heroImg, sx, sy, sw, sh, 0, 0, W, 270);
} else {
ctx.fillStyle = '#1e1e38';
ctx.fillRect(0, 0, W, 270);
}
var fade = ctx.createLinearGradient(0, 230, 0, 270);
fade.addColorStop(0, 'rgba(20,20,40,0)');
fade.addColorStop(1, '#141428');
ctx.fillStyle = fade;
ctx.fillRect(0, 230, W, 40);

// ===================================================================
// 3. TOP ACCENT BAR — thin gold line
// ===================================================================
const ag = ctx.createLinearGradient(0, 0, W, 0);
ag.addColorStop(0, '#e8a850');
ag.addColorStop(1, '#f4a261');
ctx.fillStyle = ag;
ctx.fillRect(0, 0, W, 3);

// ===================================================================
// 4. HEADER: badge / easter / code / role / quote
// ===================================================================
ctx.textAlign = 'center';
ctx.textBaseline = 'top';

// Badge
ctx.font = 'bold 11px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
ctx.fillStyle = codeColor;
ctx.fillText('YCTI · 摇曳露营人格', 240, 284);

// Easter tag
if (d.easter) {
ctx.font = '11px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
ctx.fillStyle = 'rgba(232,168,80,.7)';
ctx.fillText('🔒 隐藏人格解锁', 240, 302);
}

// Code — 52 px / bold / THEME COLOR
ctx.font = 'bold 52px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
ctx.fillStyle = codeColor;
ctx.fillText(d.code, 240, 308);

// Role / tag — 18 px / normal / #e8e0d8
ctx.font = '18px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
ctx.fillStyle = '#e8e0d8';
ctx.fillText(d.tag, 240, 388);

// Quote — 14 px / italic / #9a8c7a
ctx.font = 'italic 14px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
ctx.fillStyle = '#9a8c7a';
var q = d.quote.replace(/^["\u201c]|["\u201d]$/g, '');
ctx.fillText('\u201c' + q + '\u201d', 240, 432);

// ===================================================================
// 5. DESC CARD
// ===================================================================
ctx.textAlign = 'left';
ctx.textBaseline = 'top';
ctx.font = '13px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';

var words = d.desc.split('');
var lines = [];
var line = '';
var maxW = 386;
for (var i = 0; i < words.length; i++) {
var tl = line + words[i];
if (ctx.measureText(tl).width > maxW && line.length > 0) {
lines.push(line);
line = words[i];
} else { line = tl; }
}
if (line) lines.push(line);

var lineH = 23;                       // CSS line-height:1.8 -> 13*1.8≈23.4
var cardPad = 16;
var descCardY = 476;
var descCardW = 420;
var descCardH = lines.length * lineH + cardPad * 2;

ctx.fillStyle = '#1e1e38';
roundRect(ctx, 30, descCardY, descCardW, descCardH, 14);
ctx.fill();
ctx.strokeStyle = '#333350';
ctx.lineWidth = 1;
roundRect(ctx, 30, descCardY, descCardW, descCardH, 14);
ctx.stroke();

ctx.fillStyle = '#e8e0d8';
for (var li = 0; li < lines.length; li++) {
ctx.fillText(lines[li], 46, descCardY + cardPad + li * lineH);
}

var afterDesc = descCardY + descCardH + 14;

// ===================================================================
// 6. PARTNER CARD — multi-line wrapping with per-segment colors
//    Segments: label (gray) + code (colored bold) + tag (white) + rest (gray)
// ===================================================================
var segs = [
{ text: '最佳拍档：', color: '#9a8c7a', bold: false },
{ text: d.partnerCode, color: ptColor, bold: true },
{ text: ' ' + d.partnerTag, color: '#e8e0d8', bold: false },
{ text: ' — ' + d.partnerText, color: '#9a8c7a', bold: false }
];

var fullPartnerText = '';
for (var si = 0; si < segs.length; si++) fullPartnerText += segs[si].text;

ctx.font = '13px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
var pMaxW = 386;

// Wrap full text into lines
var pChars = fullPartnerText.split('');
var pLines = [];
var pLine = '';
for (var i = 0; i < pChars.length; i++) {
var ptl = pLine + pChars[i];
if (ctx.measureText(ptl).width > pMaxW && pLine.length > 0) {
pLines.push(pLine);
pLine = pChars[i];
} else { pLine = ptl; }
}
if (pLine) pLines.push(pLine);

var pCardPad = 12;
var pLineH = 22;
var pCardH = pLines.length * pLineH + pCardPad * 2;

// Partner card background
ctx.fillStyle = '#1e1e38';
roundRect(ctx, 30, afterDesc, descCardW, pCardH, 12);
ctx.fill();
ctx.strokeStyle = '#333350';
ctx.lineWidth = 1;
ctx.setLineDash([4, 4]);
roundRect(ctx, 30, afterDesc, descCardW, pCardH, 12);
ctx.stroke();
ctx.setLineDash([]);

// Draw partner text: for each line, determine which segments appear
ctx.textAlign = 'left';
ctx.textBaseline = 'top';
var cursor = 0;
for (var li = 0; li < pLines.length; li++) {
var lineText = pLines[li];
var lineStartX = Math.max(42, (480 - ctx.measureText(lineText).width) / 2);
var lineY = afterDesc + pCardPad + li * pLineH;
var segX = lineStartX;
var lineEnd = cursor + lineText.length;

var segStart = 0;
for (var si = 0; si < segs.length; si++) {
var segEnd = segStart + segs[si].text.length;
if (segEnd > cursor && segStart < lineEnd) {
var overlapStart = Math.max(segStart, cursor);
var overlapEnd = Math.min(segEnd, lineEnd);
var segText = fullPartnerText.substring(overlapStart, overlapEnd);
if (segText.length > 0) {
ctx.fillStyle = segs[si].color;
ctx.font = (segs[si].bold ? 'bold ' : '') + '13px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
ctx.fillText(segText, segX, lineY);
segX += ctx.measureText(segText).width;
}
}
segStart = segEnd;
}
cursor = lineEnd;
}

// ===================================================================
// 7. BOTTOM BAR
// ===================================================================
ctx.textAlign = 'center';
ctx.font = '11px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
ctx.fillStyle = 'rgba(255,255,255,.15)';
ctx.fillText('@悠哉日常大囧 · v0.13.0', 240, 830);

// ===================================================================
// DOWNLOAD
// ===================================================================
const link = document.createElement('a');
link.download = 'YCTI_' + d.code + '.png';
link.href = canvas.toDataURL('image/png');
link.click();

showToast('图片已保存！');
}

function roundRect(ctx, x, y, w, h, r) {
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.lineTo(x + w - r, y);
ctx.quadraticCurveTo(x + w, y, x + w, y + r);
ctx.lineTo(x + w, y + h - r);
ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
ctx.lineTo(x + r, y + h);
ctx.quadraticCurveTo(x, y + h, x, y + h - r);
ctx.lineTo(x, y + r);
ctx.quadraticCurveTo(x, y, x + r, y);
ctx.closePath();
}

function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// STATS (GitHub API)
// ============================================================
const STATS_COLORS = {
LONE:'#7eb8da',TSUN:'#7eb8da',PAGE:'#7eb8da',OWL:'#7eb8da',SPA:'#7eb8da',
NOM:'#e8a0b0',SUNNY:'#e8a0b0','BOO!':'#e8a0b0',CHEF:'#e8a0b0',CHOO:'#e8a0b0',
CHAOS:'#b89ad4',WEEP:'#b89ad4',BROKE:'#b89ad4',DASH:'#b89ad4',
SEYANA:'#a8b878',MOM:'#a8b878',USOYARE:'#a8b878',CARB:'#a8b878',
LURK:'#c0b8a8',SHIP:'#c0b8a8',DOGGO:'#c0b8a8',COZY:'#c0b8a8',
'WAN!':'#d4b840','6CAN':'#d4b840',SAGE:'#d4b840','3776':'#d4b840',
CHILL:'#d4b840',DRIVE:'#d4b840',ASAKA:'#d4b840',AFRO:'#d4b840',
MONO:'#d4b840',AQUA:'#d4b840'
};
const OPACITIES = [1.0, 0.82, 0.66, 0.52, 0.40];

function hexToRgba(hex, alpha) {
const r = parseInt(hex.slice(1,3), 16);
const g = parseInt(hex.slice(3,5), 16);
const b = parseInt(hex.slice(5,7), 16);
return `rgba(${r},${g},${b},${alpha})`;
}

function openStats() {
document.getElementById('resultScreen').classList.remove('active');
// Mobile: lock body with position:fixed to prevent touch-scroll-through
const scrollY = window.scrollY;
document.body.style.position = 'fixed';
document.body.style.top = `-${scrollY}px`;
document.body.style.width = '100%';
document.body.style.overflow = 'hidden';
document.body.style.justifyContent = 'center';
const ss = document.getElementById('statsScreen');
ss.style.display = 'flex';
loadStats();
}

function closeStats() {
document.getElementById('statsScreen').style.display = 'none';
document.getElementById('resultScreen').classList.add('active');
// Restore body scroll position
const scrollY = parseInt(document.body.style.top || '0', 10);
document.body.style.position = '';
document.body.style.top = '';
document.body.style.width = '';
document.body.style.overflowY = 'auto';
document.body.style.overflowX = 'hidden';
document.body.style.justifyContent = 'flex-start';
window.scrollTo(0, -scrollY);
}

async function loadStats() {
const canvas = document.getElementById('statsCanvas');
const ctx = canvas.getContext('2d');
// Dynamic canvas size — fill the container, mobile-optimized
const container = canvas.parentElement;
const maxW = container.clientWidth - 16;
const maxH = container.clientHeight - 8;
const W = Math.max(Math.min(maxW, 600), 280);
const H = Math.max(Math.min(maxH, Math.round(W * 1.6)), 360);
const dpr = window.devicePixelRatio || 1;
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);
ctx.clearRect(0, 0, W, H);
ctx.fillStyle = '#9a8c7a';
ctx.font = '14px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('加载中...', W/2, H/2);
try {
const stats = await ghStatsRead();
const counts = stats.results || {};
const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
const total = stats.total || 0;
ctx.clearRect(0, 0, W, H);
const info = document.getElementById('statsInfo');
const list = document.getElementById('statsList');
if (total === 0) {
info.textContent = '';
list.innerHTML = '';
ctx.fillText('还没有人做过测试，快来留下第一份答卷吧！', W/2, H/2);
return;
}
// --- Stats info ---
info.textContent = `共 ${total} 份答卷`;
list.innerHTML = '';

// --- Stacked Percentage Bar ---
const groups = [
{ name:'凛', short:'凛', color:'#7eb8da', codes:['LONE','TSUN','PAGE','OWL','SPA'], count:0 },
{ name:'抚子', short:'抚', color:'#e8a0b0', codes:['NOM','SUNNY','BOO!','CHEF','CHOO'], count:0 },
{ name:'千明', short:'千', color:'#b89ad4', codes:['CHAOS','WEEP','BROKE','DASH'], count:0 },
{ name:'葵', short:'葵', color:'#a8b878', codes:['SEYANA','MOM','USOYARE','CARB'], count:0 },
{ name:'惠那', short:'惠', color:'#c0b8a8', codes:['LURK','SHIP','DOGGO','COZY'], count:0 },
{ name:'隐藏', short:'隐', color:'#d4b840', codes:['WAN!','6CAN','SAGE','3776','CHILL','DRIVE','ASAKA','AFRO','MONO','AQUA'], count:0 }
];
for (const [code, count] of entries) {
for (const g of groups) { if (g.codes.includes(code)) { g.count += count; break; } }
}
const activeGroups = groups.filter(g => g.count > 0);
activeGroups.sort((a, b) => b.count - a.count); // descending by %

const barWrap = document.getElementById('statsStackedBar');
if (activeGroups.length > 0) {
// Bar row — same width & border-radius as treemap canvas
const barRow = document.createElement('div');
barRow.style.cssText = `display:flex;height:24px;border-radius:12px;overflow:hidden;width:${W}px;max-width:100%;margin:0 auto;`;
for (const g of activeGroups) {
const pct = (g.count / total) * 100;
const seg = document.createElement('div');
seg.style.cssText = `width:${pct}%;background:${g.color};display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3);`;
seg.textContent = pct >= 3 ? g.short : '';
barRow.appendChild(seg);
}
// Labels row below — percentages only
const lblRow = document.createElement('div');
lblRow.style.cssText = `display:flex;width:${W}px;max-width:100%;margin:4px auto 0;`;
for (const g of activeGroups) {
const pct = (g.count / total) * 100;
const lbl = document.createElement('div');
lbl.style.cssText = `width:${pct}%;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap;`;
lbl.textContent = `${pct.toFixed(1)}%`;
lblRow.appendChild(lbl);
}
barWrap.innerHTML = '';
barWrap.appendChild(barRow);
barWrap.appendChild(lblRow);
} else {
barWrap.innerHTML = '';
}

// --- Squarified Treemap ---
const PAD = 3;
window._treemapBlocks = []; // store for click detection
const items = entries.map(([code, count], idx) => {
const p = PERSONALITIES[code];
return {
code, count,
pct: ((count / total) * 100).toFixed(1),
area: (count / total) * (W * H),
hex: STATS_COLORS[code] || '#888',
tag: p ? (p.easter ? '隐藏人格' : p.tag) : code,
idx
};
});
// Sort by area descending
items.sort((a, b) => b.area - a.area);

// Assign opacity: within each theme, rank by count desc
// Easter/hidden personalities always full opacity (bright gold)
const sortedByTheme = [...items].sort((a,b) => {
if (a.hex !== b.hex) return a.hex.localeCompare(b.hex);
return b.count - a.count;
});
let prevHex = '';
let rank = 0;
for (const it of sortedByTheme) {
if (it.hex !== prevHex) { rank = 0; prevHex = it.hex; }
it.alpha = (it.hex === '#d4b840') ? 1.0 : OPACITIES[Math.min(rank, 4)];
rank++;
}

squarifyTreemap(ctx, items, PAD, PAD, W - 2*PAD, H - 2*PAD);

// Canvas click → tooltip
canvas.onclick = function(e) {
const rect = canvas.getBoundingClientRect();
const sx = canvas.width / rect.width;
const sy = canvas.height / rect.height;
const mx = (e.clientX - rect.left) * sx / dpr;
const my = (e.clientY - rect.top) * sy / dpr;
const tt = document.getElementById('treemapTooltip');
for (const b of window._treemapBlocks) {
if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
tt.innerHTML = `<b style="color:${b.hex};font-size:15px;">${b.code}</b> <span style="font-size:12px;color:var(--muted)">${b.tag}</span><br><span style="color:var(--muted)">${b.count}份 · ${b.pct}%</span>`;
tt.style.display = 'block';
tt.style.left = Math.min(e.clientX + 12, window.innerWidth - 220) + 'px';
tt.style.top = (e.clientY - 40) + 'px';
setTimeout(() => { tt.style.display = 'none'; }, 2000);
return;
}
}
tt.style.display = 'none';
};

} catch(e) {
ctx.clearRect(0, 0, W, H);
ctx.fillStyle = '#9a8c7a';
ctx.fillText('加载失败，请稍后再试', W/2, H/2);
console.error('Stats load error:', e);
}
}

// ---- Squarified Treemap (D3.js d3-hierarchy) ----
function squarifyTreemap(ctx, items, x, y, w, h) {
if (items.length === 0 || w <= 0 || h <= 0) return;
if (items.length === 1) {
drawItem(ctx, items[0], x, y, w, h);
return;
}
// Build hierarchy tree for D3
const root = d3.hierarchy({ children: items })
.sum(d => d.area)
.sort((a, b) => b.value - a.value);
// Compute squarified treemap layout
d3.treemap()
.tile(d3.treemapSquarify)
.size([w, h])
.paddingInner(2)
.paddingOuter(1)
(root);
// Draw each leaf block
for (const leaf of root.leaves()) {
drawItem(ctx, leaf.data, x + leaf.x0, y + leaf.y0, leaf.x1 - leaf.x0, leaf.y1 - leaf.y0);
}
}

function drawItem(ctx, item, x, y, w, h) {
if (w <= 0 || h <= 0) return;
const R = Math.min(8, w/4, h/4); // rounded corner radius
ctx.fillStyle = hexToRgba(item.hex, item.alpha);
ctx.beginPath();
ctx.roundRect(x, y, w, h, R);
ctx.fill();

// Store block for click detection
window._treemapBlocks.push({ x, y, w, h, code: item.code, count: item.count, pct: item.pct, hex: item.hex, tag: item.tag });

// Text inside block
const minDim = Math.min(w, h);
ctx.fillStyle = '#fff';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';

if (minDim >= 50) {
// Big block: show code + count + pct
const fs = Math.max(11, Math.min(Math.floor(minDim / 5), 16));
ctx.font = `bold ${fs}px sans-serif`;
ctx.fillText(item.code, x + w/2, y + h/2 - fs/2);
ctx.font = `${Math.max(9, fs - 2)}px sans-serif`;
ctx.fillStyle = 'rgba(255,255,255,0.8)';
ctx.fillText(`${item.count}份 ${item.pct}%`, x + w/2, y + h/2 + fs/2);
} else if (minDim >= 24) {
// Medium block: show code only
const fs = Math.max(10, Math.floor(minDim / 4));
ctx.font = `bold ${fs}px sans-serif`;
ctx.fillText(item.code, x + w/2, y + h/2);
} else if (minDim >= 14) {
// Tiny block: code at min 8px, clickable for tooltip
const fs = Math.max(8, Math.floor(minDim / 3));
ctx.font = `bold ${fs}px sans-serif`;
ctx.textAlign = 'center';
ctx.fillText(item.code, x + w/2, y + h/2);
}
// Ultra-tiny (<14px): no text, but tooltip still works via click
}
</script>
