<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YCTI · 摇曳露营人格测试</title>
<style>
:root {
  --bg-deep: #0d0d1f;
  --bg: #141428;
  --card: #1e1e38;
  --card-hover: #28284a;
  --warm: #e8a850;
  --warm-glow: #f0c070;
  --fire: #f4a261;
  --text: #e8e0d8;
  --muted: #9a8c7a;
  --accent: #7aa87d;
  --border: #333350;
  --shadow: rgba(0,0,0,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0d0d1f 0%, #141428 25%, #0a0a18 45%, #010108 60%, #010108 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  line-height: 1.6;
  position: relative;
  overflow-x: hidden;
}
/* Stars */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 85% 10%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 60% 28%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 35% 38%, rgba(255,255,255,.25), transparent),
    radial-gradient(1.5px 1.5px at 78% 40%, rgba(255,255,255,.35), transparent);
  pointer-events: none; z-index: 0;
}
#app {
  width: 100%;
  max-width: 480px;
  position: relative;
  z-index: 1;
}
.screen { display: none; animation: fadeSlide .4s ease; }
.screen.active { display: block; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Start Screen */
.start-screen { text-align: center; padding: 8px 0 0; }
.start-screen .camp-icon { font-size: 40px; margin-bottom: 4px; }
.start-screen h1 {
  font-size: 28px; font-weight: 800; color: var(--warm);
  letter-spacing: 6px; margin-bottom: 2px;
  text-shadow: 0 0 20px rgba(232,168,80,.25);
}
.start-screen .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 6px; }
.start-screen .subtitle-cn { font-size: 13px; color: var(--warm); letter-spacing: 2px; margin-bottom: 32px; }

.btn {
  display: inline-block;
  padding: 14px 48px;
  border-radius: 32px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--warm), #d49540);
  color: #1a1a2e;
  box-shadow: 0 4px 20px rgba(232,168,80,.25);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--warm-glow), var(--warm));
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(232,168,80,.35);
}
.btn-primary:active { transform: translateY(0) scale(.98); }
.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--card-hover); border-color: #555; }

.btn-outline {
  background: transparent;
  color: var(--warm);
  border: 1px solid var(--warm);
  opacity: 0.8;
}
.btn-outline:hover { background: rgba(232,168,80,0.1); border-color: var(--warm-glow); opacity: 1; }

/* Quiz Screen */
.quiz-screen { padding: 16px 0; }
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--warm), var(--fire));
  border-radius: 2px;
  transition: width .4s ease;
  box-shadow: 0 0 8px rgba(232,168,80,.3);
}
.question-counter {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.question-text {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 28px;
  line-height: 1.7;
  color: var(--text);
  min-height: 60px;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  width: 100%;
  padding: 16px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-align: left;
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  transition: all .2s ease;
  font-family: inherit;
  line-height: 1.5;
  position: relative;
}
.option:hover {
  border-color: var(--warm);
  background: var(--card-hover);
  transform: translateX(4px);
  box-shadow: 0 2px 12px rgba(232,168,80,.1);
}
.option:active { transform: scale(.98) translateX(4px); }
.option.selected { border-color: var(--warm); background: rgba(232,168,80,.12); }

/* Result Screen */
.result-screen { text-align: center; padding: 0 0 24px; }

/* Hero Image — full-bleed edge-to-edge, flush with viewport top */
.result-hero {
  width: 100vw;
  margin-top: -16px;
  margin-left: calc(-50vw + 50%);
  margin-right: calc(-50vw + 50%);
  aspect-ratio: 16 / 9;
  background: var(--card);
  border-radius: 0;
  overflow: hidden;
  position: relative;
}
.result-hero img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.result-hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(transparent, var(--bg));
  pointer-events: none;
}

/* Result theme colors — text only, no background */
.result-screen.theme-rin .result-code { color: #7eb8da; text-shadow: 0 0 30px rgba(126,184,218,.3); }
.result-screen.theme-rin .result-badge { color: #7eb8da; }
.result-screen.theme-nadeshiko .result-code { color: #e8a0b0; text-shadow: 0 0 30px rgba(232,160,176,.3); }
.result-screen.theme-nadeshiko .result-badge { color: #e8a0b0; }
.result-screen.theme-chiaki .result-code { color: #b89ad4; text-shadow: 0 0 30px rgba(184,154,212,.3); }
.result-screen.theme-chiaki .result-badge { color: #b89ad4; }
.result-screen.theme-aoi .result-code { color: #a8b878; text-shadow: 0 0 30px rgba(168,184,120,.3); }
.result-screen.theme-aoi .result-badge { color: #a8b878; }
.result-screen.theme-ena .result-code { color: #c0b8a8; text-shadow: 0 0 30px rgba(192,184,168,.3); }
.result-screen.theme-ena .result-badge { color: #c0b8a8; }
.result-screen.theme-easter .result-code { color: #d4b840; text-shadow: 0 0 30px rgba(212,184,64,.4); }
.result-screen.theme-easter .result-badge { color: #d4b840; }

.result-badge {
  font-size: 11px; letter-spacing: 3px;
  margin: 14px 0 6px; text-transform: uppercase;
}
.result-code {
  font-size: 52px; font-weight: 800; color: var(--warm);
  letter-spacing: 6px; margin-bottom: 4px;
  text-shadow: 0 0 30px rgba(232,168,80,.3);
  animation: codeReveal .6s ease;
}
@keyframes codeReveal {
  from { opacity: 0; transform: scale(.8); letter-spacing: 20px; }
  to { opacity: 1; transform: scale(1); letter-spacing: 6px; }
}
.result-role { font-size: 18px; color: var(--text); margin-bottom: 14px; }
.result-quote {
  font-size: 14px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 16px;
  line-height: 1.7;
  padding: 0 12px;
  position: relative;
}
.result-desc {
  font-size: 13px;
  color: var(--text);
  text-align: left;
  line-height: 1.8;
  padding: 16px;
  background: var(--card);
  border-radius: 14px;
  margin: 0 12px 14px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px var(--shadow);
}
.result-partner {
  font-size: 13px;
  color: var(--muted);
  margin: 0 12px 20px;
  line-height: 1.7;
  background: var(--card);
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px dashed var(--border);
}
.result-partner strong { color: var(--warm); }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 6px; }
.result-actions .btn { padding: 11px 28px; font-size: 14px; }

/* Easter Egg */
.easter-tag {
  display: inline-block;
  padding: 5px 14px;
  background: rgba(232,168,80,.15);
  color: var(--warm);
  border-radius: 12px;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  border: 1px solid rgba(232,168,80,.3);
  animation: easterGlow 2s ease-in-out infinite;
}
@keyframes easterGlow {
  0%,100% { box-shadow: 0 0 8px rgba(232,168,80,.1); }
  50% { box-shadow: 0 0 18px rgba(232,168,80,.25); }
}

/* Author Credit */
.author-credit {
  font-size: 11px;
  color: rgba(255,255,255,.18);
  text-align: center;
  margin-top: 10px;
  letter-spacing: 1px;
}
.version-tag {
  font-size: 9px;
  color: rgba(255,255,255,.10);
  text-align: center;
  margin-top: 2px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  color: var(--text);
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 100;
  box-shadow: 0 4px 16px var(--shadow);
}
.toast.show { opacity: 1; }

/* Canvas hidden */
#shareCanvas { display: none; }

/* Homepage animation */
.video-wrapper {
  width: 100%;
  margin: 28px 0 0;
  padding: 0;
}
.home-video {
  width: 100%;
  height: auto;
  display: block;
  margin: 0;
  background: #010108;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  position: relative;
  z-index: 1;
  object-fit: contain;
}

/* Bottom bar (author + version) */
.bottom-bar {
  font-size: 11px;
  color: rgba(255,255,255,.15);
  text-align: center;
  padding: 16px 0 4px;
  letter-spacing: 1px;
}
</style>
</head>

<script>
// ============================================================
// WeChat / QQ video autoplay fix
// ============================================================
(function() {

    if (!v) return;

      playPromise.catch(function() {

        if (typeof WeixinJSBridge !== 'undefined') {

        }
        document.addEventListener('WeixinJSBridgeReady', doPlay, {once:true});
        document.addEventListener('touchstart', doPlay, {once:true});
        document.addEventListener('click', doPlay, {once:true});
      });
    }
  } catch(e) {}
})();
// ============================================================
// GitHub API 统计后端
// 读写均走 api.github.com，无缓存延迟
// ============================================================
const GH_REPO = 'kevinliu0619/ycti';
const GH_TOKEN='github_pat_11CAM5OLQ0SOTuKfNXfV0X' + '_O6Aas5Fz21Fjfw3j15TvzaLv1SRI1uuoejnorMqWE7jEYRLKCOE98X7rJ7c';
const GH_STATS_FILE = 'stats.json';

function ghAuth() {
  return 'Basic ' + btoa('kevinliu0619:' + GH_TOKEN);
}

async function ghStatsRead() {
  // 直读 GitHub API，不走 CDN，无缓存延迟
  const resp = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
    headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'User-Agent': 'YCTI' }
  });
  if (!resp.ok) return { total: 0, results: {} };
  const d = await resp.json();
  return JSON.parse(atob(d.content));
}

async function ghStatsSubmit(personality) {
  try {
    // Step 1: GET 当前文件 + SHA
    const getResp = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
      headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'User-Agent': 'YCTI' }
    });
    let stats = { total: 0, results: {} }, sha = null;
    if (getResp.ok) {
      const d = await getResp.json();
      sha = d.sha;
      stats = JSON.parse(atob(d.content));
    }
    // Step 2: 更新数据
    stats.total = (stats.total || 0) + 1;
    stats.results[personality] = (stats.results[personality] || 0) + 1;
    // Step 3: PUT 写回
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(stats))));
    const body = { message: 'record: ' + personality, content, branch: 'main' };
    if (sha) body.sha = sha;
    const putResp = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
      method: 'PUT',
      headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'YCTI' },
      body: JSON.stringify(body)
    });
    if (!putResp.ok && putResp.status === 409) {
      // SHA 冲突：重试一次
      const r2 = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
        headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'User-Agent': 'YCTI' }
      });
      if (r2.ok) {
        const d2 = await r2.json();
        let s2 = JSON.parse(atob(d2.content));
        s2.total = (s2.total || 0) + 1;
        s2.results[personality] = (s2.results[personality] || 0) + 1;
        const c2 = btoa(unescape(encodeURIComponent(JSON.stringify(s2))));
        await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_STATS_FILE, {
          method: 'PUT',
          headers: { Authorization: ghAuth(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'YCTI' },
          body: JSON.stringify({ message: 'record: ' + personality, content: c2, sha: d2.sha, branch: 'main' })
        });
      }
    }
  } catch(e) { console.warn('stats submit error:', e); }
}

// ============================================================
// DATA: 30 Personalities

  OWL:   { code:'OWL',   role:'凛',  tag:'夜猫子凛',  quote:'深夜才是主场。凌晨三点的富士山，只属于醒着的人。', desc:'你习惯在别人都睡着之后，一个人坐在篝火旁。有时候看星星，有时候就是发呆。你不是失眠——你只是觉得夜晚比白天更诚实。凌晨的风吹过来的时候，你觉得全世界都是你的。', partner:'LURK', partnerText:'她也在线。你们在不同的地方，看同一片星空。', theme:'rin',easter:false },
  SPA:   { code:'SPA',   role:'凛',  tag:'温泉凛',  quote:'露营地选在温泉旁边不是偶然，是信仰。', desc:'对你来说，露营的终极享受不是帐篷也不是篝火——是泡完温泉后那一瞬间。你愿意为了一个有温泉的营地多骑几十公里。泡在热水里看着远山的时候，你觉得人生没有过不去的坎。', partner:'SEYANA', partnerText:'她泡温泉的时候一句话不说，你们都很享受这种沉默。', theme:'rin',easter:false },
  NOM:   { code:'NOM',   role:'抚子', tag:'饿鬼抚子',  quote:'露营的终极奥义就是吃！50个饺子只是开胃菜！', desc:'你看到美食的眼神会让朋友害怕。你的露营计划核心不是"去哪"，而是"吃什么"。你可以在吃完2kg汉堡肉+超大份炒面+拉面之后，说一句"又饿了"——并且是认真的。但你也从不吝啬分享，你做的饭永远够所有人吃。', partner:'CHEF', partnerText:'或者更准确地说，你们就是同一个人。做饭和吃饭，都是你。', theme:'nadeshiko',easter:false },
  SUNNY: { code:'SUNNY', role:'抚子', tag:'小太阳抚子', quote:'好耶！一起去！大家一起去！', desc:'你像一只金毛——看到谁都热情，去哪都开心，遇到什么事都先笑。你的快乐不需要理由，而且传染性极强。三分钟前还陌生的人，聊完就觉得认识很久了。你不是没有烦恼，你只是觉得没必要让烦恼占太多时间。', partner:'LONE', partnerText:'你是唯一能让她露出笑容的那个人。', theme:'nadeshiko',easter:false },
  'BOO!':{ code:'BOO!', role:'抚子', tag:'胆小鬼抚子', quote:'别讲了别讲了别讲了——', desc:'怕黑、怕鬼、怕怪谈。听到帐篷外有奇怪的声音会缩进睡袋最深处。但奇怪的是——为了给朋友拍夜景照，你可以一个人走半小时的黑暗山路。恐惧不会让你停下，你只是需要先尖叫一下。', partner:'MOM', partnerText:'她会一边说"真拿你没办法"一边陪你走夜路。', theme:'nadeshiko',easter:false },
  CHEF:  { code:'CHEF',  role:'抚子', tag:'实验料理王抚子',  quote:'试试这个——巧克力放进咖喱里？还有这个熏制奶酪……', desc:'你对料理没有边界感。锡纸包整颗蔬菜烤？甜酒曲奇？咖喱里放巧克力？你什么都敢试。有时候成功，有时候翻车，但翻车了你也会笑着吃完。你的厨房（或者说篝火旁）永远是最热闹的地方。', partner:'NOM', partnerText:'她负责吃，你负责做，完美循环。', theme:'nadeshiko',easter:false },
  CHOO:  { code:'CHOO',  role:'抚子', tag:'铁道宅抚子',  quote:'坐齿轨列车比露营还兴奋！露营只是顺便啦。', desc:'你本来只是去露营，结果在途中迷上了Abt式齿轨列车、蒸汽机车、无人车站。你开始研究铁道时刻表，买印着铁道发明家头像的T恤。朋友说"我们不是来露营的吗"，你说"对啊，但你看这个列车——"', partner:'DRIVE', partnerText:'她开车，你坐电车，在不同的轨道上奔赴同一个方向。', theme:'nadeshiko',easter:false },
  CHAOS: { code:'CHAOS', role:'千明', tag:'整活王千明',  quote:'把自己打包成快递寄到露营地？我觉得可行！', desc:'你就是野活部叫"整活部"的原因。你的脑洞没有边界，你的行动力也没有。你策划的露营计划永远包含至少一个离谱的环节，但最后总能莫名其妙地成功。朋友说你是"麻烦制造机"，你说"不，我是惊喜制造机"。', partner:'DASH', partnerText:'整活需要执行，你们就是彼此的加速器。', theme:'chiaki',easter:false },
  WEEP:  { code:'WEEP',  role:'千明', tag:'爱哭鬼千明',  quote:'呜呜呜这个露营场太棒了我好感动——', desc:'你是嗓门最大的人，也是泪腺最浅的人。篝火旁聊着聊着突然哭了，看日出哭了，看到朋友偷偷给你准备的生日惊喜哭得更凶。你从不掩饰自己的情绪，哭完笑完，继续整活。', partner:'MOM', partnerText:'她会默默递纸巾，然后假装没看见你哭。', theme:'chiaki',easter:false },
  BROKE: { code:'BROKE', role:'千明', tag:'穷鬼千明',  quote:'700日元！买了个爹！', desc:'你的露营装备几乎全是二手店淘的。你买过700日元的木碗（后来变成了仙人掌盆），用劣化吊床替代露营椅，自制的熏制器用纸箱做的。你不觉得穷是问题——你觉得穷是创意的催化剂。', partner:'CARB', partnerText:'两人一起逛二手店，互相怂恿"这个可以买"。', theme:'chiaki',easter:false },
  DASH:  { code:'DASH',  role:'千明', tag:'热血笨蛋千明',  quote:'迷路也是体验！反正会被救的——大概吧！', desc:'你是那种想到什么就冲的人。先出发再查路线，先买了再说怎么用。你经常搞砸，但从不后悔。因为最棒的故事往往来自最离谱的意外。而且你有一个（或者好几个）无论如何都会来救你的朋友。', partner:'DRIVE', partnerText:'她会开车来救你。虽然嘴上骂你，但油门下得很稳。', theme:'chiaki',easter:false },
  SEYANA:{ code:'SEYANA',role:'葵',  tag:'佛系葵',  quote:'せやな～', desc:'天塌下来？主打一个随缘。你是那个在所有人焦虑的时候说"まあ、なんとかなる"（总会有办法的）的人。你说话带着关西腔的慵懒，行动带着一种从容的节奏。不是不在乎，而是你知道——急也没用。', partner:'CHAOS', partnerText:'她是龙卷风，你是风眼。没有你，她早就把自己吹飞了。', theme:'aoi',easter:false },
  MOM:   { code:'MOM',   role:'葵',  tag:'老妈子葵',  quote:'先把饭做好，热水烧好，然后你们再闹。', desc:'你是野活组真正的幕后支柱。千明负责整活，你负责善后；抚子负责吃，你负责做。你记得每个人的口味，知道谁需要加衣服，在所有人疯完闹完之后，你已经默默把一切收拾好了。你从不说"我来照顾你们"，但每个人都知道你会的。', partner:'WEEP', partnerText:'她哭的时候，只有你知道什么时候该递纸巾，什么时候该假装没看见。', theme:'aoi',easter:false },
  USOYARE: { code:'USOYARE', role:'葵',  tag:'嘘やれ葵',  quote:'我跟你们说，上次我骑自行车……', desc:'你的浓眉一挑，死鱼眼一翻，一段真假难辨的故事即将出口。你编故事的时候面不改色，细节丰富到让人怀疑"难道是真的？"——但谢天谢地，你从不拿重要的事开玩笑。你的「嘘やれ」是野活组的保留节目。', partner:'TROLL', partnerText:'你们俩凑在一起，没人能分清哪句是真的。', theme:'aoi',easter:false },
  CARB:  { code:'CARB',  role:'葵',  tag:'碳水狂魔葵',  quote:'骑车40公里？不，是为了去那个便利店看看有没有新出的面包。', desc:'你的骑行路线规划不是按距离，是按沿途便利店的数量。你能骑出41km/h的速度——但每次停下来都是因为"这家店看起来不错"。你骑车是为了吃，吃是为了骑车，这是一个完美的循环。', partner:'NOM', partnerText:'你们一起骑车，一起吃饭，一起感叹"人生啊"。', theme:'aoi',easter:false },
  LURK:  { code:'LURK',  role:'惠那', tag:'云露营惠那',  quote:'人在被炉，心在营地。点赞从不缺席，出门下次一定。', desc:'你是野活组的编外成员——从未正式加入，但每次露营的群聊你都全程在线。你远程给凛提供建议，撮合野活组和凛认识，偶尔还通风报信。你的参与感不靠到场，靠信息量。你知道的永远比在场的人多。', partner:'OWL', partnerText:'你们在不同的地方，看着同一片星空，互相发消息。', theme:'ena',easter:false },
  TROLL: { code:'TROLL', role:'惠那', tag:'搞事精惠那',  quote:'りんりん～抚子说她马上到哦～', desc:'其实你根本没告诉抚子。你最大的乐趣不是自己搞事，是看别人因为你的安排而相遇。你促成了凛和野活组的第一次接触，方式是"卖队友"。你笑眯眯地站在幕后，看着一切如你所料地发生。', partner:'CHAOS', partnerText:'你们俩的整活组合，能让整个营地鸡飞狗跳。', theme:'ena',easter:false },
  DOGGO: { code:'DOGGO', role:'惠那', tag:'爱犬惠那',  quote:'竹轮在哪我在哪。露营可以不去，狗不能不撸。', desc:'你给竹轮买了35000日元的专属露营装备——包括一顶10000日元的狗帐篷。你计划18岁考驾照，不是为了自己，是为了带竹轮去更远的地方。别人问你为什么不加入野活部，你说"还没打算从归宅部毕业"——其实就是想多陪竹轮。', partner:'WAN!', partnerText:'你们不需要语言。你懂它，它懂你。', theme:'ena',easter:false },
  COZY:  { code:'COZY',  role:'惠那', tag:'被炉星人惠那',  quote:'被炉是宇宙的中心。冬天+被炉+零食+手机=幸福。', desc:'你的作息极其不规律，早起是你最大的敌人。你可以在被炉里度过整个冬天，靠手机远程参与一切社交活动。你知道这样不太好——但被炉真的很暖和，手机真的很好玩，外面的世界可以再等等。', partner:'SEYANA', partnerText:'你们一起躺在被炉里，一句话不说，但都觉得"这样就挺好"。', theme:'ena',easter:false },
  // Easter eggs
  'WAN!': { code:'WAN!', role:'竹轮', tag:'竹轮本犬', quote:'汪！', desc:'你是齐藤惠那的吉娃娃，品种虽小，待遇极大——35000日元的专属露营套装的含金量，人类们自己体会。圣诞露营时你被装扮成兔子、驯鹿，你忍了。你最大的愿望是：被窝+摸摸，永远不要停。人类露营关你什么事？你有狗帐篷。', partner:'DOGGO', partnerText:'她是你的全世界，你是她的全部。', theme:'easter',easter:true },
  '6CAN': { code:'6CAN', role:'老师', tag:'酒鬼老师', quote:'六罐姐可不是白叫的。', desc:'你表面上是温柔贤淑的新人教师，每天下班后光顾酒庄，雷打不动买半打啤酒。喝醉之后你像换了一个人，眼神从眯眯眼变成死鱼眼。你的学生叫你"六罐姐"，你的妹妹吐槽你，你戒酒期间迷上了黄油曲奇——但戒酒结束后又开了一瓶。', partner:'USOYARE', partnerText:'喝醉后听她讲故事，你分不清是自己醉了还是故事太离谱。', theme:'easter',easter:true },
  SAGE:  { code:'SAGE',  role:'爷爷', tag:'露营仙人', quote:'你年轻时帐篷还是帆布的。', desc:'你是凛露营的起点。你骑Triumph THRUXTON 1200R，一整年都在旅行。你把自己用过的露营装备传给凛，就像把一种生活方式悄悄种进她的生命。你在mono里帮路人修过摩托车，然后继续上路。你从不教人怎么露营——你只是做给他们看。', partner:'LONE', partnerText:'她是你生命中最满意的作品，虽然你从没说出来。', theme:'easter',easter:true },
  '3776': { code:'3776', role:'中毒者', tag:'富士山中毒者', quote:'3776。这不是数字，是信仰。', desc:'你对富士山的爱超越了理性。你能从任何角度认出富士山，你能说出每个观景点的最佳时间，你的手机号码尾号是3776——你说只是巧合，没人信。你看到富士山的时候，会停下一切，安静地看很久。然后脱口而出："3776米……"', partner:'PAGE', partnerText:'和她一起安静地看富士山，不用说话，就是最好的陪伴。', theme:'easter',easter:true },
  CHILL: { code:'CHILL', role:'绫乃', tag:'慵懒骑士绫乃', quote:'绫乃的体力是三人中最差的——但没关系，反正骑完摩托瘫在地上也很舒服。', desc:'你是抚子的青梅竹马，和凛一样骑摩托。你说话拖长音，动作懒洋洋，长距离骑行后会直接瘫在地上。但你对朋友的心意从不打折——你从滨松骑到山梨，只为了兑现"总有一天一起露营"的约定。', partner:'TSUN', partnerText:'你们在酷道152上并排骑行，她开得快，你开得慢，但最后都会在露营地碰头。', theme:'easter',easter:true },
  DRIVE: { code:'DRIVE', role:'樱姐', tag:'飙车党樱姐', quote:'いいよ。', desc:'两个字，背后是深夜三小时山路。你是抚子的大学生姐姐，爱车是一台蓝色的日产Rasheen。你表面冷淡，实则重度妹控。你强迫初中时的抚子每天骑车绕滨名湖一圈，把她从"抚壮壮"变成了体力怪物。你和凛不约而同跟踪抚子的首次单人露营，在山下偶遇，相视一笑——然后你请她吃了晚饭。', partner:'DASH', partnerText:'你嘴上骂她冒失，但每次都是你开车去救她。', theme:'easter',easter:true },
  ASAKA: { code:'ASAKA', role:'亚咲花', tag:'露营之声亚咲花', quote:'SHINY DAYS. Seize The Day. The Sunshower. Sun Is Coming Up. So Precious. 五首歌，一部露营。', desc:'你是摇曳露营的音乐代言人。你的声音响起的瞬间，粉丝就知道——又要出发了。你17岁出道，SHINY DAYS成了露营粉的国歌。但你不止唱了一首，你唱了五首。每一季的OP，每一部剧场版，你的声音都在。你不是露营者，但你是露营的空气。', partner:'AFRO', partnerText:'没有他创造的世界，就没有你的歌声。你们是彼此的因果。', theme:'easter',easter:true },
  AFRO:  { code:'AFRO',  role:'Afro老师', tag:'部活创世神', quote:'爆炸头是本体，露营是信仰。想不出故事的时候就出去取材。', desc:'你是静冈县滨松市出身的漫画家，笔名来自爆炸头发型。你创造了摇曳露营，创造了mono，顺便创造了无数人的露营梦想。你喜欢大型犬，喜欢摩托车，喜欢粗眉角色，喜欢在作品里埋各种彩蛋。你画的露营装备都是真实品牌，你画的露营地后来都成了圣地。', partner:'ASAKA', partnerText:'你的世界给了她歌唱的理由，她的歌声让你的世界有了温度。', theme:'easter',easter:true },
  MONO:  { code:'MONO',  role:'摄影部', tag:'摄影部部员', quote:'用镜头记录的日常，和用帐篷记录的星空，是同一种浪漫。', desc:'你有一双会发现美的眼睛。黄昏的光线穿过树叶的角度、路边野猫打哈欠的弧度、朋友笑到模糊的表情——这些别人忽略的瞬间，在你眼里全是宝藏。按下快门对你来说不是技术活，是本能：你觉得「这个世界值得被记住」的证据太多了，不拍下来太可惜。你有时候会一个人出门，带着相机走走停停，不知道会拍到什么——但你知道，一定会拍到什么。露营的时候，你比谁都安静，但你的眼睛里装满了别人没注意到的风景。', partner:'AFRO', partnerText:'你们都是「用画面讲故事」的人。一个画，一个拍——同一个世界，两种表达。', theme:'easter',easter:true },
  AQUA:  { code:'AQUA',  role:'水水人', tag:'沼津水水人', quote:'山里的咖喱面确实不错。但你来沼津尝尝海边的橘子——那是另一种甜。', desc:'你是静冈县沼津市的海边住民——也是Aqours的粉丝，江湖人称"水水人"。当全世界的动画宅都涌向山梨和富士山的时候，你站在駿河湾边微微一笑。你知道静冈的动画圣地不只有露营——沼津的海岸线、淡岛的鸟居、内浦的海风，同样是无数人朝圣的理由。你去过本栖湖，也去过三津海岸。你心里的静冈地图，山和海各占一半。', partner:'3776', partnerText:'你们是静冈的一体两面：你爱海，她爱山。3776米加駿河湾，刚好拼成一个完整的静冈。', theme:'easter',easter:true },
};

  { text:'你在本栖湖畔搭好帐篷，篝火燃起，天黑了。这时候你……', camp:'rin', options:[

    {text:'发了条消息到群里：「本栖湖～今晚在这里」',scores:{'LURK': 1, 'ASAKA': 1, 'COZY': 1}},
    {text:'安静地坐在湖边，看着湖面倒映的星空——好了，现在可以安心发呆了',scores:{'MONO': 1}}

    {text:'在心里列了一张清单：下次要买更好的睡袋、更好的防潮垫、更好的……',scores:{'BROKE': 2, 'USOYARE': 1}},
    {text:'拍了段视频发给朋友：「你看，在下雪诶，超美的～」手机还剩2%电',scores:{'LURK': 1, 'DOGGO': 1, 'ASAKA': 1, 'BOO!': 1}}

  { text:'你骑着摩托车在山路上转弯，富士山突然出现在眼前，大得不像话。你……', camp:'rin', options:[
    {text:'停下车，安静地看了五分钟。然后继续上路——但嘴角一直没下来',scores:{'3776': 1, 'SPA': 1, 'CHILL': 1}},
    {text:'「富士山！！！」大叫一声，掏出手机连发了十五条消息，虽然每条内容都差不多',scores:{'3776': 1, 'DASH': 1}},
    {text:'「3776米……」喃喃自语，然后拿出便当，对着富士山吃了起来',scores:{'3776': 1, 'NOM': 1, 'PAGE': 1}}
  ]},
  { text:'一个人露营的清晨。天还没亮你自然醒了。拉开帐篷……', camp:'rin', options:[
    {text:'泡一杯手冲咖啡，对着富士山慢慢喝。没人说话，也不需要',scores:{'3776': 1, 'SPA': 1}},
    {text:'掏出手机狂发消息给所有人：「富士山！！你们看！！！」',scores:{'AFRO': 1, 'COZY': 1}},
    {text:'愣了三秒，然后开始计算这座山海拔多少、从哪个角度拍最好',scores:{'CHOO': 2, 'PAGE': 1}},
    {text:'走到湖边，发现湖面和天空是同一个颜色。坐在那里看了整整一个小时。后来你经常想起这个黄昏',scores:{'MONO': 1, '3776': 1}}
  ]},
  { text:'露营时手机信号不好，一整晚没收到任何消息……', camp:'rin', options:[
    {text:'本来也没打算看手机。没有信号 = 真正的露营',scores:{'OWL': 1, 'SPA': 1, 'TROLL': 1}},
    {text:'突然觉得好孤独。录了一段语音想发给朋友，等有信号再发',scores:{'BOO!': 2, 'ASAKA': 1, 'WEEP': 1}},
    {text:'信号断了之后，某个人发疯一样给你发了三十几条LINE消息——你明早才能看到',scores:{'TROLL': 2, 'CHAOS': 1, 'COZY': 1}},
    {text:'太好了。没有信号的时候，反而能注意到更多细节——篝火的火焰在黑暗中画出各种形状，一看就是半小时',scores:{'MONO': 1}}
  ]},
  { text:'你在山路上看到骑摩托车旅行的陌生人停下来休息。你……', camp:'rin', options:[
    {text:'如果对方需要帮助，会停下来帮忙——但不会主动搭话',scores:{'OWL': 1, 'DRIVE': 1}},
    {text:'「这个型号的车好酷！你骑了多远？从哪来的？路上有什么好玩的？」',scores:{'CHOO': 1, 'CHAOS': 1}},
    {text:'看着对方的摩托车背影，心里想「也许有一天我也能这样」',scores:{'USOYARE': 1, 'DASH': 1, 'DRIVE': 1}},
    {text:'看着对方和摩托车的背影出了神——不是偷看，是觉得这个画面值得被记住',scores:{'MONO': 1, 'DRIVE': 1}}
  ]},
  { text:'露营时，有人在你旁边大声放音乐……', camp:'rin', options:[
    {text:'戴上降噪耳机，继续看书。各有各的玩法，不干涉',scores:{'OWL': 1, 'PAGE': 1, 'SEYANA': 1}},
    {text:'「这首歌不错！什么乐队？」——然后变成了一起听歌，还加了LINE好友',scores:{'CHAOS': 1, 'ASAKA': 1, 'TROLL': 1}},
    {text:'走过去委婉地说：「不好意思，能不能小声一点？我想听篝火的声音。」',scores:{'TSUN': 2, 'MOM': 1}}
  ]},
  { text:'露营最后一晚，篝火快灭了。你……', camp:'rin', options:[
    {text:'看着最后一点火星慢慢熄灭，觉得这一刻和旅途本身一样重要',scores:{'OWL': 1, 'LONE': 1, 'SPA': 1}},
    {text:'「不要灭啊——」往里面扔了最后几根柴，然后对着火焰发了好一会儿呆',scores:{'BOO!': 2, 'ASAKA': 1}},
    {text:'已经睡着了。篝火？什么篝火？',scores:{'COZY': 1, 'SEYANA': 1, 'CHILL': 1}}
  ]},
  { text:'深夜，一个陌生女孩瑟瑟发抖地出现在你的营地——她骑车来看富士山，结果迷路到现在。你……', camp:'nadeshiko', options:[
    {text:'虽然有点慌但还是让她坐下了，还分了热可可给她',scores:{'TSUN': 2, 'DOGGO': 1, 'LONE': 1, 'WAN!': 1}},
    {text:'「骑自行车来的？！你疯了吧！」然后赶紧让她进帐篷暖和',scores:{'MOM': 1, 'WEEP': 1, 'CHAOS': 1}},
    {text:'打了个电话给她姐姐，确认安全后默默把篝火添旺了些',scores:{'PAGE': 1, 'OWL': 1, 'DRIVE': 1}}
  ]},
  { text:'社团讨论第一次正式露营的装备清单。你……', camp:'nadeshiko', options:[
    {text:'「我带帐篷和炉子就够了，多了装不下」',scores:{'DOGGO': 1, 'CARB': 1}},
    {text:'「熏制奶酪！烤棉花糖！还有这个新出的限定口味薯片！」——清单上全是吃的',scores:{'CHEF': 2, 'SUNNY': 1}},
    {text:'「把自己打包寄到露营地比较省运费吧？」——然后真的开始算快递费用',scores:{'CHAOS': 1, 'BROKE': 1, 'DASH': 1, 'TROLL': 1}}
  ]},
  { text:'隔壁营地的人煮了一锅超级香的料理，香味飘过来了……', camp:'nadeshiko', options:[
    {text:'闻着香味继续吃自己的泡面——别人的是别人的',scores:{'TSUN': 1, 'SPA': 1, 'OWL': 1}},
    {text:'端着自己的碗走过去：「你们在吃什么呀？闻起来好香！」——然后被分了一碗',scores:{'NOM': 1, 'DASH': 1, 'CHEF': 1}},
    {text:'心里盘算着要不要假装没带够吃的，然后被某个热情的人发现并投喂',scores:{'USOYARE': 1, 'COZY': 1, 'NOM': 1}}
  ]},
  { text:'你的朋友在营地煮了一大锅咖喱，结果盐放多了，咸得不行……', camp:'nadeshiko', options:[
    {text:'默默加了点水，什么都没说。反正能喝',scores:{'TSUN': 2, 'SPA': 1, 'OWL': 1}},
    {text:'「没事没事，配米饭吃刚刚好！再来一碗！」——然后真的又添了一碗',scores:{'NOM': 1, 'CHEF': 1, 'WEEP': 1}},
    {text:'「啊……我好像忘了买饮料。算了，咸了就多喝水吧」——其实根本没帮上忙',scores:{'SEYANA': 1, 'WEEP': 1, 'USOYARE': 1}}
  ]},
  { text:'你在便利店看到一款新出的「露营限定」口味零食……', camp:'nadeshiko', options:[
    {text:'拿起来看了看配料表，放下了。下次露营再说',scores:{'CARB': 1}},
    {text:'「露营限定？买了买了买了！！」——然后买了三包，当场拆了一包',scores:{'NOM': 1, 'DASH': 1}},
    {text:'发消息到社团群里：「这个有人吃过吗？好吃吗？在线等」——然后在便利店等了十分钟',scores:{'LURK': 1, 'TROLL': 1, 'WEEP': 1}}
  ]},
  { text:'你第一次一个人去露营。到了营地，搭好帐篷，天已经全黑了。篝火烧起来之后，你……', camp:'nadeshiko', options:[
    {text:'掏出手机给朋友发消息：「我一个人到了！这里好安静……有点害怕但又好开心！」',scores:{'SUNNY': 1, 'BOO!': 1, 'LURK': 1, 'WEEP': 1}},
    {text:'把带来的食材全部摆出来——一个人也要吃三菜一汤，这是原则问题',scores:{'NOM': 1, 'CHEF': 1}},
    {text:'坐在篝火旁，突然理解了为什么有人喜欢一个人露营。给那个「独行侠前辈」发了条LINE：「我好像懂了。」',scores:{'PAGE': 1, 'TSUN': 1, 'OWL': 1}}
  ]},
  { text:'露营当晚，有人开始讲山里的怪谈。帐篷外有风声，远处有动物叫……', camp:'nadeshiko', options:[
    {text:'「别讲了别讲了别讲了——」整个人缩进睡袋，只露出眼睛',scores:{'BOO!': 2, 'WEEP': 1, 'NOM': 1}},
    {text:'「嗯～」其实已经快睡着了，根本没在听',scores:{'SEYANA': 2, 'COZY': 1}},
    {text:'面无表情听着，等讲到最恐怖的地方，突然冷冷地补了一句更吓人的',scores:{'TSUN': 2, 'TROLL': 1, 'BOO!': 1}}
  ]},
  { text:'出远门旅行时，你的包里一定会有……', camp:'nadeshiko', options:[
    {text:'一本书。目的地可以变，书不能不带',scores:{'SPA': 1, 'OWL': 1, 'LONE': 1}},
    {text:'零食。而且是那种到了目的地会变得更好吃的零食',scores:{'NOM': 1, 'CHEF': 1}},
    {text:'一本铁道时刻表。你甚至在出发前就把换乘方案做好了',scores:{'CHOO': 2, 'WAN!': 1, 'CHILL': 1}}
  ]},
  { text:'社团经费捉襟见肘。有人从二手店买回来一个「超便宜的碗」，发现……', camp:'chiaki', options:[
    {text:'「一千日元买了个破碗？下次经费申请必须过我这关」',scores:{'MOM': 1, '6CAN': 1}},
    {text:'「七百日元！你被人骗了吧？！」笑得最大声，但也帮忙想办法',scores:{'CHAOS': 2, 'BROKE': 1, 'CHEF': 1}},
    {text:'「算了算了，反正可以拿回家给我妈装仙人掌」——反正不是你的钱',scores:{'SEYANA': 1, 'USOYARE': 1, 'WEEP': 1}}
  ]},
  { text:'大家围坐在篝火旁，有人提议每个人讲一个自己最糗的露营经历……', camp:'chiaki', options:[
    {text:'「第一次露营忘了带打火机，用放大镜生的火」——讲完发现大家看你的眼神不太对',scores:{'PAGE': 1, 'LONE': 1, 'TROLL': 1}},
    {text:'「我上次把帐篷搭在斜坡上，半夜滚到了帐篷底部，像睡在滑梯上」——边说边笑到岔气',scores:{'CHAOS': 1, 'BROKE': 1, 'DASH': 1}},
    {text:'「我……我没什么糗事。真的。」——但脸已经红到篝火都黯然失色',scores:{'USOYARE': 1, 'BOO!': 1, 'DOGGO': 1}}
  ]},
  { text:'社团群里有人发了一张新的露营装备图，价格不菲……', camp:'chiaki', options:[
    {text:'默默存图，打开二手网站搜索同款',scores:{'BROKE': 2, 'CARB': 1, 'LURK': 1}},
    {text:'「这个好棒！谁买了借我用用！」——然后被群嘲「你自己买啊」',scores:{'CHAOS': 2, 'WEEP': 1}},
    {text:'「我上次在店里看到过，实际重量比标称重了200克，建议买老款」——发完没人回了',scores:{'CHOO': 2, 'PAGE': 1, '6CAN': 1}}
  ]},
  { text:'新年第一天。你许了一个关于露营的愿望……', camp:'chiaki', options:[
    {text:'「今年也要一个人去更多没去过的地方」',scores:{'LONE': 1, 'OWL': 1, 'CARB': 1}},
    {text:'「希望今年能带家人/朋友来一次露营」——虽然他们不一定想来',scores:{'SUNNY': 1, 'WEEP': 1, 'MOM': 1, 'DOGGO': 1}},
    {text:'「希望今年能攒够钱把想买的装备都买了……」——去年的愿望也是这个',scores:{'BROKE': 2, '6CAN': 1}}
  ]},
  { text:'露营时，你发现有人偷偷把你的篝火柴抱走了（他以为是公共柴堆）……', camp:'chiaki', options:[
    {text:'默默去捡了新的柴。反正山里到处都是',scores:{'OWL': 1, 'TROLL': 1, 'COZY': 1}},
    {text:'「喂喂喂那是我的柴！你拿之前至少问一句吧！」——但最后又分了他一半',scores:{'TSUN': 2, 'CHAOS': 1, 'MOM': 1}},
    {text:'追上去：「你拿柴要干嘛？要不要顺便一起烤红薯？」——结果变成了一场小型野餐',scores:{'SUNNY': 1, 'CHEF': 1, 'NOM': 1, 'TROLL': 1}}
  ]},
  { text:'学校文化祭，社团的展位该怎么布置？', camp:'chiaki', options:[
    {text:'用卡纸搭了个迷你帐篷展示区，旁边放了真实露营装备给人摸',scores:{'CARB': 1, 'CHEF': 1}},
    {text:'搞了个「野活部咖啡厅」——卖手冲咖啡和烤棉花糖，生意好到排长队',scores:{'CHEF': 2, 'NOM': 1}},
    {text:'「我们把被炉搬来吧！」——最后展位变成了一堆人挤在被炉里聊露营趣事',scores:{'COZY': 1, 'AFRO': 1, 'BROKE': 1}}
  ]},
  { text:'你发现一条绝美的林间小路，地图上没有标注……', camp:'chiaki', options:[
    {text:'骑过去看看——大不了掉头。未知本身就是风景',scores:{'DASH': 2, 'LONE': 1, 'DRIVE': 1}},
    {text:'「这条路太棒了！回头一定要带大家来！」已经在心里列好了邀请名单',scores:{'SUNNY': 1, 'NOM': 1, 'DOGGO': 1}},
    {text:'先用手机记下路口坐标，查了一遍安全信息，再决定走不走',scores:{'LURK': 2, 'CHOO': 1, 'PAGE': 1}}
  ]},
  { text:'社团需要决定下一个露营地点。大家在讨论……', camp:'aoi', options:[
    {text:'「我推荐这个营地，海拔1500米，有温泉，晚上能看到银河。」——资料已经整理好了',scores:{'LURK': 2, 'PAGE': 1, '3776': 1}},
    {text:'「去哪都行！只要有好吃的！上次那个营地的烤红薯真的太绝了！」',scores:{'NOM': 1, 'CHEF': 1}},
    {text:'「随便。你们定吧，反正我跟着去就行。」——其实心里已经想好了三个备选方案',scores:{'SEYANA': 1, 'USOYARE': 1}},
    {text:'「山里去了很多次了，要不要试试海边？海边露营看日出不用爬山」',scores:{'AQUA': 1}}
  ]},
  { text:'你的朋友说「想尝试一个人露营但有点害怕」。你怎么回应？', camp:'aoi', options:[
    {text:'「一开始害怕很正常。先从离家近的营地开始，带上喜欢的书和吃的，慢慢就习惯了」',scores:{'MOM': 2, 'PAGE': 1}},
    {text:'「我陪你第一次去！第二次你就不怕了——大概吧！」',scores:{'DASH': 1, 'SUNNY': 1, 'CHAOS': 1}},
    {text:'发了一堆链接：必买装备清单、推荐的营地、天气预报、附近温泉……比旅行社还详细',scores:{'LURK': 2, 'DOGGO': 1, 'COZY': 1}}
  ]},
  { text:'夏天露营，蚊虫非常多。你的防蚊策略是……', camp:'aoi', options:[
    {text:'全身喷满防蚊喷雾，带了蚊香，帐篷有防蚊网——三重防护，万无一失',scores:{'MOM': 2, 'LONE': 1, 'CARB': 1}},
    {text:'「蚊子也是大自然的一部分嘛～」——十分钟后，「蚊子太多了救命啊啊啊」',scores:{'BOO!': 2, 'WEEP': 1, 'CHAOS': 1}},
    {text:'「穿长袖长裤就行了吧？」——结果只有脸被咬了，看起来像过敏',scores:{'SEYANA': 1, 'USOYARE': 1, '6CAN': 1}},
    {text:'「海边就没那么多蚊子——海风吹着，蚊虫站不住脚」',scores:{'AQUA': 1}}
  ]},
  { text:'你正骑着自行车爬一个看不到尽头的上坡。导航显示还有3公里，但你的腿已经快没知觉了……', camp:'aoi', options:[
    {text:'「嗯～算了，下来推吧。」——推着车走也是一种骑行',scores:{'SEYANA': 2, 'COZY': 1}},
    {text:'咬牙继续踩——因为山顶有家面包店，据说他们家的蜜瓜包是附近最好吃的',scores:{'CARB': 2, 'NOM': 1, 'DASH': 1}},
    {text:'「这算什么！上次我从滨松骑到山梨都没死！」——然后开始跟路人吹自己骑过的最远距离',scores:{'USOYARE': 2, 'CHAOS': 1}}
  ]},
  { text:'露营时，有人在你面前一本正经地讲了一个「亲身经历」——但你总觉得哪里不对……', camp:'aoi', options:[
    {text:'「真的假的？！」——然后全信了，还追问细节',scores:{'WEEP': 2, 'SUNNY': 1, 'BOO!': 1}},
    {text:'「嘛～」——其实你一个字都不信，但懒得拆穿',scores:{'SEYANA': 2, 'TROLL': 1}},
    {text:'听完之后，面不改色地补了一句更离谱的，现在轮到他怀疑你了',scores:{'USOYARE': 2, 'TSUN': 1, 'CHAOS': 1}}
  ]},
  { text:'你在餐厅打工攒钱买露营装备。有顾客来买东西，你发现他买的都是露营相关的东西……', camp:'aoi', options:[
    {text:'默默算了一下总价，心想「这位也是露营人啊」',scores:{'PAGE': 1, 'MOM': 1, 'CARB': 1, 'BROKE': 1}},
    {text:'「这个炉子超好用的！上次我用它烧水泡了杯咖喱面，绝了！」',scores:{'SUNNY': 1, 'NOM': 1, '6CAN': 1, 'AFRO': 1}},
    {text:'结完账对着顾客的背影说了一句「一路顺风」，虽然不知道对方要去哪',scores:{'MOM': 2, 'USOYARE': 1, 'SEYANA': 1}},
    {text:'「您也是露营爱好者啊？山里还是海边？我两个都喜欢，但最近觉得海边也不错——」',scores:{'AQUA': 1}}
  ]},
  { text:'大家决定去泡温泉。脱了衣服发现旁边池子里居然是熟人……', camp:'aoi', options:[
    {text:'装作若无其事继续泡。内心：「为什么她们也在」——但也没走',scores:{'SPA': 2, 'LONE': 1, 'TSUN': 1}},
    {text:'「哇好巧好巧好巧！」——直接跨池子过来了',scores:{'SUNNY': 1, 'CHAOS': 1, 'NOM': 1, 'CHEF': 1}},
    {text:'泡在温泉里闭着眼，一句话没说，脸不知道是被蒸气烫的还是别的什么原因',scores:{'USOYARE': 1, 'ASAKA': 1, 'CHILL': 1}}
  ]},
  { text:'你的LINE状态栏写着「正在露营中」。有人评论「好想一起去」，你……', camp:'ena', options:[
    {text:'已读不回。默默计划着下次独自出发的路线',scores:{'OWL': 2, 'LONE': 1, 'PAGE': 1}},
    {text:'「来呀来呀！下次一起去！」——但你已经在群里发完定位了',scores:{'SUNNY': 1, 'COZY': 1, 'LURK': 1, 'TROLL': 1}},
    {text:'「りんりん～下次一起去怎么样？」——其实你根本没打算去，但不妨碍你撮合别人去',scores:{'TROLL': 1, 'WAN!': 1, 'CHILL': 1}}
  ]},
  { text:'社团的LINE群里，有人深夜三点发了一条「好想去看星星」……', camp:'ena', options:[
    {text:'第二天早上看到，回了一句「看到了。下次去。晚安。」',scores:{'LONE': 1, 'TSUN': 1, 'PAGE': 1, 'TROLL': 1}},
    {text:'「走啊！！现在就去！！」——然后发现只有自己在激动，其他人全在睡',scores:{'CHAOS': 1, 'TROLL': 1, 'CHILL': 1}},
    {text:'你也是凌晨三点没睡的人。你回了一句「走吧」，然后真的拿着车钥匙出门了',scores:{'DRIVE': 1, 'DASH': 1, 'USOYARE': 1}}
  ]},
  { text:'一个雨天，你本来计划去露营但取消了。在家你怎么过？', camp:'ena', options:[
    {text:'搭了个室内帐篷，泡了杯咖啡，打开露营视频当背景音——假装自己在山里',scores:{'SPA': 2, 'LONE': 1, 'COZY': 1}},
    {text:'把所有装备翻出来擦了一遍，重新整理了背包，列了下一次露营的采购清单',scores:{'CARB': 2, 'MOM': 1, 'CHOO': 1}},

// ============================================================
// STATE
// ============================================================
let shuffledQuestions = [];
let currentQ = 0;
let scores = {};
let questionOrder = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// SCREENS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectQuestions(questions, count) {
  // 阵营均衡抽题：五大阵营各至少 2 题，彩蛋至少 1 题
  const byCamp = {};
  for (let i = 0; i < questions.length; i++) {
    const c = questions[i].camp;
    if (!byCamp[c]) byCamp[c] = [];
    byCamp[c].push(i);
  }
  const mainCamps = ['rin', 'nadeshiko', 'chiaki', 'aoi', 'ena'];
  const guaranteed = [];
  for (const camp of mainCamps) {
    const pool = byCamp[camp] || [];
    shuffleArray(pool);
    guaranteed.push(...pool.slice(0, 2));
  }
  if (byCamp['easter']) {
    shuffleArray(byCamp['easter']);
    guaranteed.push(byCamp['easter'][0]);
  }
  const used = new Set(guaranteed);
  const remaining = [];
  for (let i = 0; i < questions.length; i++) {
    if (!used.has(i)) remaining.push(i);
  }
  shuffleArray(remaining);
  const selected = [...guaranteed, ...remaining.slice(0, count - guaranteed.length)];
  shuffleArray(selected);
  return selected.map(i => questions[i]);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function startQuiz() {
  scores = {};
  currentQ = 0;
  // 阵营均衡抽题：从 50 题中选 20 题
  shuffledQuestions = selectQuestions(QUESTIONS, 20);
  questionOrder = shuffledQuestions.map((_, i) => i);
  showScreen('quizScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = shuffledQuestions[currentQ];
  const total = shuffledQuestions.length;
  document.getElementById('progressFill').style.width = ((currentQ / total) * 100) + '%';
  document.getElementById('qCounter').textContent = `第 ${currentQ + 1} / ${total} 题`;
  document.getElementById('qText').textContent = q.text;
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  // Shuffle options for variety
  const labels = ['A','B','C','D'];
  const shuffled = q.options.map((opt, i) => ({...opt, origIdx: i}));
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = labels[i] + '. ' + opt.text;
    btn.addEventListener('click', () => selectOption(opt.origIdx));
    optsEl.appendChild(btn);
  });
}

function selectOption(idx) {
  const q = shuffledQuestions[currentQ];
  const opt = q.options[idx];
  
  // Visual feedback: highlight selected
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.style.pointerEvents = 'none');
  // Find the button that corresponds to this option
  const buttons = document.querySelectorAll('#options .option');
  for (const btn of buttons) {
    if (btn.textContent.includes(opt.text.substring(0, 10))) {
      btn.classList.add('selected');
      break;
    }
  }
  
  // Add scores
  for (const [key, val] of Object.entries(opt.scores)) {
    scores[key] = (scores[key] || 0) + val;
  }
  
  setTimeout(() => {
    currentQ++;
    if (currentQ >= shuffledQuestions.length) {
      showResult();
    } else {
      renderQuestion();
      document.getElementById('progressFill').style.width = ((currentQ / shuffledQuestions.length) * 100) + '%';
      document.getElementById('qCounter').textContent = `第 ${currentQ + 1} / ${shuffledQuestions.length} 题`;
    }
  }, 200);
}

// ============================================================
// MATCHING ALGORITHM
// ============================================================
function computeResult() {
  // Get all 22 main personalities sorted by score
  const mainKeys = Object.keys(PERSONALITIES).filter(k => !PERSONALITIES[k].easter);
  mainKeys.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
  
  // Get top 2, randomly pick one
  const top2 = mainKeys.slice(0, 2);
  const pick = top2[Math.floor(Math.random() * Math.min(2, top2.length))];
  
  // Check easter eggs: score >= 3 AND probabilistic chance
  // Easter triggers with probability = easterScore / (mainMax * 7)
  const mainMax = scores[top2[0]] || 0;
  const easterKeys = Object.keys(PERSONALITIES).filter(k => PERSONALITIES[k].easter);
  const qualified = easterKeys.filter(k => (scores[k] || 0) >= 3);
  
  if (qualified.length > 0 && mainMax > 0) {
    // Sort by score descending
    qualified.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
    // Check each qualified easter with probability
    for (const ek of qualified) {
      const prob = (scores[ek] || 0) / (mainMax * 7);
      if (Math.random() < prob) {
        return { key: ek, easter: true };
      }
    }
  }
  
  return { key: pick, easter: false };
}

function showResult() {
  const result = computeResult();
  const p = PERSONALITIES[result.key];
  const partner = PERSONALITIES[p.partner];
  
  showScreen('resultScreen');
  
  // Apply theme color
  const rs = document.getElementById('resultScreen').querySelector('.result-screen');
  rs.className = 'result-screen theme-' + (p.theme || 'rin');
  
  // Hero image — use default for now, personality-specific images later
  var heroImg = document.querySelector('#resultHero img');
  heroImg.src = HERO_DEFAULT;

  document.getElementById('easterTag').innerHTML = result.easter ? '<span class="easter-tag">🔒 隐藏人格解锁</span>' : '';
  document.getElementById('resultBadge').textContent = 'YCTI · 摇曳露营人格';
  document.getElementById('resultCode').textContent = p.code;
  document.getElementById('resultRole').textContent = p.tag;
  document.getElementById('resultQuote').textContent = p.quote;
  document.getElementById('resultDesc').textContent = p.desc;
  var ptColor = THEME_COLORS[partner.theme] || '#7eb8da';
  document.getElementById('resultPartner').innerHTML = 
    '🤝 最佳拍档：<strong style="color:' + ptColor + '">' + partner.code + '</strong> <span style="color:var(--text)">' + partner.tag + '</span> — ' + p.partnerText;
  
  // Store for sharing
  window._resultData = { code: p.code, tag: p.tag, quote: p.quote, desc: p.desc, 
    partnerCode: partner.code, partnerTag: partner.tag, partnerText: p.partnerText, easter: result.easter, theme: p.theme };

  // Submit to GitHub stats
  ghStatsSubmit(result.key);
}

  showScreen('startScreen');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// STATS (GitHub API)
// ============================================================
const STATS_COLORS = {
  LONE:'#7eb8da',TSUN:'#7eb8da',PAGE:'#7eb8da',OWL:'#7eb8da',SPA:'#7eb8da',
  NOM:'#e8a0b0',SUNNY:'#e8a0b0','BOO!':'#e8a0b0',CHEF:'#e8a0b0',CHOO:'#e8a0b0',
  CHAOS:'#b89ad4',WEEP:'#b89ad4',BROKE:'#b89ad4',DASH:'#b89ad4',
  SEYANA:'#a8b878',MOM:'#a8b878',USOYARE:'#a8b878',CARB:'#a8b878',
  LURK:'#c0b8a8',TROLL:'#c0b8a8',DOGGO:'#c0b8a8',COZY:'#c0b8a8',
  'WAN!':'#d4b840','6CAN':'#d4b840',SAGE:'#d4b840','3776':'#d4b840',
  CHILL:'#d4b840',DRIVE:'#d4b840',ASAKA:'#d4b840',AFRO:'#d4b840',
  MONO:'#d4b840',AQUA:'#d4b840'
};
const OPACITIES = [1.0, 0.82, 0.66, 0.52, 0.40];

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function openStats() {
  document.getElementById('resultScreen').classList.remove('active');
  const ss = document.getElementById('statsScreen');
  ss.style.display = 'flex';
  loadStats();
}

function closeStats() {
  document.getElementById('statsScreen').style.display = 'none';
  document.getElementById('resultScreen').classList.add('active');
}

async function loadStats() {
  const canvas = document.getElementById('statsCanvas');
  const ctx = canvas.getContext('2d');
  // Dynamic canvas size — fill the container, mobile-optimized
  const container = canvas.parentElement;
  const maxW = container.clientWidth - 16;
  const maxH = container.clientHeight - 8;
  const W = Math.max(Math.min(maxW, 600), 280);
  const H = Math.max(Math.min(maxH, Math.round(W * 1.6)), 360);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#9a8c7a';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('加载中...', W/2, H/2);
  try {
    const stats = await ghStatsRead();
    const counts = stats.results || {};
    const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
    const total = stats.total || 0;
    ctx.clearRect(0, 0, W, H);
    const info = document.getElementById('statsInfo');
    const list = document.getElementById('statsList');
    if (total === 0) {
      info.textContent = '';
      list.innerHTML = '';
      ctx.fillText('还没有人做过测试，快来留下第一份答卷吧！', W/2, H/2);
      return;
    }
    // --- Stats info ---
    info.textContent = `共 ${total} 份答卷`;
    list.innerHTML = '';

    // --- Stacked Percentage Bar ---
    const groups = [
      { name:'凛', short:'凛', color:'#7eb8da', codes:['LONE','TSUN','PAGE','OWL','SPA'], count:0 },
      { name:'抚子', short:'抚', color:'#e8a0b0', codes:['NOM','SUNNY','BOO!','CHEF','CHOO'], count:0 },
      { name:'千明', short:'千', color:'#b89ad4', codes:['CHAOS','WEEP','BROKE','DASH'], count:0 },
      { name:'葵', short:'葵', color:'#a8b878', codes:['SEYANA','MOM','USOYARE','CARB'], count:0 },
      { name:'惠那', short:'惠', color:'#c0b8a8', codes:['LURK','TROLL','DOGGO','COZY'], count:0 },
      { name:'隐藏', short:'隐', color:'#d4b840', codes:['WAN!','6CAN','SAGE','3776','CHILL','DRIVE','ASAKA','AFRO','MONO','AQUA'], count:0 }
    ];
    for (const [code, count] of entries) {
      for (const g of groups) { if (g.codes.includes(code)) { g.count += count; break; } }
    }
    const activeGroups = groups.filter(g => g.count > 0);
    activeGroups.sort((a, b) => b.count - a.count); // descending by %

    const barWrap = document.getElementById('statsStackedBar');
    if (activeGroups.length > 0) {
      // Bar row — same width & border-radius as treemap canvas
      const barRow = document.createElement('div');
      barRow.style.cssText = `display:flex;height:24px;border-radius:12px;overflow:hidden;width:${W}px;max-width:100%;margin:0 auto;`;
      for (const g of activeGroups) {
        const pct = (g.count / total) * 100;
        const seg = document.createElement('div');
        seg.style.cssText = `width:${pct}%;background:${g.color};display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3);`;
        seg.textContent = pct >= 3 ? g.short : '';
        seg.title = `${g.name}: ${g.count}份 (${pct.toFixed(1)}%)`;
        barRow.appendChild(seg);
      }
      // Labels row below — percentages only
      const lblRow = document.createElement('div');
      lblRow.style.cssText = `display:flex;width:${W}px;max-width:100%;margin:4px auto 0;`;
      for (const g of activeGroups) {
        const pct = (g.count / total) * 100;
        const lbl = document.createElement('div');
        lbl.style.cssText = `width:${pct}%;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap;`;
        lbl.textContent = `${pct.toFixed(1)}%`;
        lbl.title = `${g.name}: ${g.count}份 (${pct.toFixed(1)}%)`;
        lblRow.appendChild(lbl);
      }
      barWrap.innerHTML = '';
      barWrap.appendChild(barRow);
      barWrap.appendChild(lblRow);
    } else {
      barWrap.innerHTML = '';
    }

    // --- Squarified Treemap ---
    const PAD = 3;
    window._treemapBlocks = []; // store for click detection
    const items = entries.map(([code, count], idx) => {
      const p = PERSONALITIES[code];
      return {
        code, count,
        pct: ((count / total) * 100).toFixed(1),
        area: (count / total) * (W * H),
        hex: STATS_COLORS[code] || '#888',
        tag: p ? (p.easter ? '隐藏人格' : p.tag) : code,
        idx
      };
    });
    // Sort by area descending
    items.sort((a, b) => b.area - a.area);

    // Assign opacity: within each theme, rank by count desc
    const sortedByTheme = [...items].sort((a,b) => {
      if (a.hex !== b.hex) return a.hex.localeCompare(b.hex);
      return b.count - a.count;
    });
    let prevHex = '';
    let rank = 0;
    for (const it of sortedByTheme) {
      if (it.hex !== prevHex) { rank = 0; prevHex = it.hex; }
      it.alpha = OPACITIES[Math.min(rank, 4)];
      rank++;
    }

    squarifyTreemap(ctx, items, PAD, PAD, W - 2*PAD, H - 2*PAD);

    // Canvas click → tooltip
    canvas.onclick = function(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = canvas.width / rect.width;
      const sy = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * sx / dpr;
      const my = (e.clientY - rect.top) * sy / dpr;
      const tt = document.getElementById('treemapTooltip');
      for (const b of window._treemapBlocks) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          tt.innerHTML = `<b style="color:${b.hex};font-size:15px;">${b.code}</b> <span style="font-size:12px;color:var(--muted)">${b.tag}</span><br><span style="color:var(--muted)">${b.count}份 · ${b.pct}%</span>`;
          tt.style.display = 'block';
          tt.style.left = Math.min(e.clientX + 12, window.innerWidth - 220) + 'px';
          tt.style.top = (e.clientY - 40) + 'px';
          setTimeout(() => { tt.style.display = 'none'; }, 2000);
          return;
        }
      }
      tt.style.display = 'none';
    };

  } catch(e) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#9a8c7a';
    ctx.fillText('加载失败，请稍后再试', W/2, H/2);
    console.error('Stats load error:', e);
  }
}

// ---- Squarified Treemap (D3.js d3-hierarchy) ----
function squarifyTreemap(ctx, items, x, y, w, h) {
  if (items.length === 0 || w <= 0 || h <= 0) return;
  if (items.length === 1) {
    drawItem(ctx, items[0], x, y, w, h);
    return;
  }
  // Build hierarchy tree for D3
  const root = d3.hierarchy({ children: items })
    .sum(d => d.area)
    .sort((a, b) => b.value - a.value);
  // Compute squarified treemap layout
  d3.treemap()
    .tile(d3.treemapSquarify)
    .size([w, h])
    .paddingInner(2)
    .paddingOuter(1)
    (root);
  // Draw each leaf block
  for (const leaf of root.leaves()) {
    drawItem(ctx, leaf.data, x + leaf.x0, y + leaf.y0, leaf.x1 - leaf.x0, leaf.y1 - leaf.y0);
  }
}

function drawItem(ctx, item, x, y, w, h) {
  if (w <= 0 || h <= 0) return;
  const R = Math.min(8, w/4, h/4); // rounded corner radius
  ctx.fillStyle = hexToRgba(item.hex, item.alpha);
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, R);
  ctx.fill();

  // Store block for click detection
  window._treemapBlocks.push({ x, y, w, h, code: item.code, count: item.count, pct: item.pct, hex: item.hex, tag: item.tag });

  // Text inside block
  const minDim = Math.min(w, h);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (minDim >= 50) {
    // Big block: show code + count + pct
    const fs = Math.max(11, Math.min(Math.floor(minDim / 5), 16));
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.fillText(item.code, x + w/2, y + h/2 - fs/2);
    ctx.font = `${Math.max(9, fs - 2)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(`${item.count}人 ${item.pct}%`, x + w/2, y + h/2 + fs/2);
  } else if (minDim >= 30) {
    // Medium block: show code only
    const fs = Math.max(10, Math.floor(minDim / 4));
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.fillText(item.code, x + w/2, y + h/2);
  }
  // Small block: no text, click for tooltip
}
