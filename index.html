<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YCTI · 摇曳露营人格测试</title>
<style>
:root {
  --bg-deep: #0d0d1f;
  --bg: #141428;
  --card: #1e1e38;
  --card-hover: #28284a;
  --warm: #e8a850;
  --warm-glow: #f0c070;
  --fire: #f4a261;
  --text: #e8e0d8;
  --muted: #9a8c7a;
  --accent: #7aa87d;
  --border: #333350;
  --shadow: rgba(0,0,0,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0d0d1f 0%, #141428 40%, #1a1a35 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  line-height: 1.6;
  position: relative;
  overflow-x: hidden;
}
/* Stars */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 85% 10%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 60% 28%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 35% 38%, rgba(255,255,255,.25), transparent),
    radial-gradient(1.5px 1.5px at 78% 40%, rgba(255,255,255,.35), transparent);
  pointer-events: none; z-index: 0;
}
#app {
  width: 100%;
  max-width: 480px;
  position: relative;
  z-index: 1;
}
.screen { display: none; animation: fadeSlide .4s ease; }
.screen.active { display: block; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Start Screen */
.start-screen { text-align: center; padding: 48px 16px 32px; }
.start-screen .logo { font-size: 56px; margin-bottom: 8px; filter: drop-shadow(0 0 12px rgba(232,168,80,.2)); }
.start-screen h1 {
  font-size: 32px; font-weight: 800; color: var(--warm);
  letter-spacing: 6px; margin-bottom: 4px;
  text-shadow: 0 0 20px rgba(232,168,80,.25);
}
.start-screen .subtitle { font-size: 12px; color: var(--muted); letter-spacing: 2px; margin-bottom: 32px; }
.start-screen .campfire {
  font-size: 72px; margin: 20px 0 28px;
  display: inline-block;
  animation: campfirePulse 2.5s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(244,162,97,.5));
}
@keyframes campfirePulse {
  0%,100% { transform: scale(1); opacity: 1; }
  30% { transform: scale(1.08); opacity: .9; }
  60% { transform: scale(.96); opacity: .85; }
}
.start-screen .desc {
  font-size: 14px; color: var(--muted); max-width: 320px; margin: 0 auto 36px; line-height: 1.8;
  background: var(--card); padding: 16px 20px; border-radius: 14px; border: 1px solid var(--border);
}
.btn {
  display: inline-block;
  padding: 14px 48px;
  border-radius: 32px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--warm), #d49540);
  color: #1a1a2e;
  box-shadow: 0 4px 20px rgba(232,168,80,.25);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--warm-glow), var(--warm));
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(232,168,80,.35);
}
.btn-primary:active { transform: translateY(0) scale(.98); }
.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--card-hover); border-color: #555; }

/* Quiz Screen */
.quiz-screen { padding: 16px 0; }
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--warm), var(--fire));
  border-radius: 2px;
  transition: width .4s ease;
  box-shadow: 0 0 8px rgba(232,168,80,.3);
}
.question-counter {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.question-text {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 28px;
  line-height: 1.7;
  color: var(--text);
  min-height: 60px;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  width: 100%;
  padding: 16px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-align: left;
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  transition: all .2s ease;
  font-family: inherit;
  line-height: 1.5;
  position: relative;
}
.option:hover {
  border-color: var(--warm);
  background: var(--card-hover);
  transform: translateX(4px);
  box-shadow: 0 2px 12px rgba(232,168,80,.1);
}
.option:active { transform: scale(.98) translateX(4px); }
.option.selected { border-color: var(--warm); background: rgba(232,168,80,.12); }

/* Result Screen */
.result-screen { text-align: center; padding: 20px 0 32px; }
.result-badge {
  font-size: 11px; color: var(--warm); letter-spacing: 3px;
  margin-bottom: 16px; text-transform: uppercase;
}
.result-code {
  font-size: 56px; font-weight: 800; color: var(--warm);
  letter-spacing: 6px; margin-bottom: 6px;
  text-shadow: 0 0 30px rgba(232,168,80,.3);
  animation: codeReveal .6s ease;
}
@keyframes codeReveal {
  from { opacity: 0; transform: scale(.8); letter-spacing: 20px; }
  to { opacity: 1; transform: scale(1); letter-spacing: 6px; }
}
.result-role { font-size: 20px; color: var(--text); margin-bottom: 20px; }
.result-quote {
  font-size: 15px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 28px;
  line-height: 1.8;
  padding: 0 12px;
  position: relative;
}
.result-quote::before, .result-quote::after {
  content: '"';
  color: var(--warm);
  opacity: .3;
  font-size: 24px;
}
.result-desc {
  font-size: 14px;
  color: var(--text);
  text-align: left;
  line-height: 1.9;
  padding: 20px;
  background: var(--card);
  border-radius: 14px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px var(--shadow);
}
.result-partner {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 28px;
  line-height: 1.8;
  background: var(--card);
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px dashed var(--border);
}
.result-partner strong { color: var(--warm); }
.result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.result-actions .btn { padding: 12px 32px; font-size: 14px; }

/* Easter Egg */
.easter-tag {
  display: inline-block;
  padding: 5px 14px;
  background: rgba(232,168,80,.15);
  color: var(--warm);
  border-radius: 12px;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  border: 1px solid rgba(232,168,80,.3);
  animation: easterGlow 2s ease-in-out infinite;
}
@keyframes easterGlow {
  0%,100% { box-shadow: 0 0 8px rgba(232,168,80,.1); }
  50% { box-shadow: 0 0 18px rgba(232,168,80,.25); }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  color: var(--text);
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 100;
  box-shadow: 0 4px 16px var(--shadow);
}
.toast.show { opacity: 1; }

/* Canvas hidden */
#shareCanvas { display: none; }
</style>
</head>
<body>

<div id="app">
  <!-- Start Screen -->
  <div class="screen active" id="startScreen">
    <div class="start-screen">
      <div class="logo">🏕️</div>
      <h1>YCTI</h1>
      <div class="subtitle">Yuru Camp Type Indicator</div>
      <div class="campfire">🔥</div>
      <div class="desc">
        本栖湖畔的篝火，富士山下的晨曦。<br>
        从 50 题题库中随机抽取 25 题，找到属于你的露营人格。
      </div>
      <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div class="screen" id="quizScreen">
    <div class="quiz-screen">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="question-counter" id="qCounter"></div>
      <div class="question-text" id="qText"></div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="resultScreen">
    <div class="result-screen">
      <div id="easterTag"></div>
      <div class="result-badge" id="resultBadge"></div>
      <div class="result-code" id="resultCode"></div>
      <div class="result-role" id="resultRole"></div>
      <div class="result-quote" id="resultQuote"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="result-partner" id="resultPartner"></div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="shareResult()">📸 保存分享图</button>
        <button class="btn btn-secondary" onclick="restartQuiz()">重新测试</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="shareCanvas" width="480" height="720"></canvas>
<script>
// ============================================================
// DATA: 30 Personalities
// ============================================================
const PERSONALITIES = {
  LONE:  { code:'LONE',  role:'凛',  tag:'独狼凛',  quote:'"一个人最自在。篝火+书+咖啡=完美世界。"', desc:'你在爷爷的影响下爱上了露营，但比起一群人热热闹闹，你更享受一个人的节奏。搭好帐篷，烧起篝火，泡杯咖啡，翻开书——这就是你的理想假期。朋友约你你也会去，但内心最深处，你知道最好的露营地是只有自己知道的那个。', partner:'NOM', partnerText:'她会闯进你的营地，然后你发现自己居然没赶她走。', easter:false },
  TSUN:  { code:'TSUN',  role:'凛',  tag:'傲娇凛',  quote:'"我才不是为了你们才来的。"',  desc:'然后默默帮所有人劈好了柴，查好了天气，还偷偷通知了老师来救场。你嘴上说着"麻烦""不要"，但每次朋友有需要，你总是第一个到。你只是不擅长把关心说出口，但行动从不撒谎。', partner:'SUNNY', partnerText:'她总能一眼看穿你的"不要"其实是"好吧"。', easter:false },
  PAGE:  { code:'PAGE',  role:'凛',  tag:'文艺凛',  quote:'"露营的终极奥义，是换个风景好的地方看书。"', desc:'你选择露营地的标准不是设施好不好，而是——那里安静吗？能看见富士山吗？光线适合看书吗？你会在篝火旁读到深夜，然后第二天清晨被鸟鸣叫醒。世界很吵，但你有自己的节奏。', partner:'LONE', partnerText:'你们会安静地坐在一起，各自看书，偶尔抬头对视一眼，又继续低头。', easter:false },
  OWL:   { code:'OWL',   role:'凛',  tag:'夜猫子凛',  quote:'"深夜才是主场。凌晨三点的富士山，只属于醒着的人。"', desc:'你习惯在别人都睡着之后，一个人坐在篝火旁。有时候看星星，有时候就是发呆。你不是失眠——你只是觉得夜晚比白天更诚实。凌晨的风吹过来的时候，你觉得全世界都是你的。', partner:'LURK', partnerText:'她也在线。你们在不同的地方，看同一片星空。', easter:false },
  SPA:   { code:'SPA',   role:'凛',  tag:'温泉凛',  quote:'"露营地选在温泉旁边不是偶然，是信仰。"', desc:'对你来说，露营的终极享受不是帐篷也不是篝火——是泡完温泉后那一瞬间。你愿意为了一个有温泉的营地多骑几十公里。泡在热水里看着远山的时候，你觉得人生没有过不去的坎。', partner:'SEYANA', partnerText:'她泡温泉的时候一句话不说，你们都很享受这种沉默。', easter:false },
  NOM:   { code:'NOM',   role:'抚子', tag:'饿鬼抚子',  quote:'"露营的终极奥义就是吃！50个饺子只是开胃菜！"', desc:'你看到美食的眼神会让朋友害怕。你的露营计划核心不是"去哪"，而是"吃什么"。你可以在吃完2kg汉堡肉+超大份炒面+拉面之后，说一句"又饿了"——并且是认真的。但你也从不吝啬分享，你做的饭永远够所有人吃。', partner:'CHEF', partnerText:'或者更准确地说，你们就是同一个人。做饭和吃饭，都是你。', easter:false },
  SUNNY: { code:'SUNNY', role:'抚子', tag:'小太阳抚子', quote:'"好耶！一起去！大家一起去！"', desc:'你像一只金毛——看到谁都热情，去哪都开心，遇到什么事都先笑。你的快乐不需要理由，而且传染性极强。三分钟前还陌生的人，聊完就觉得认识很久了。你不是没有烦恼，你只是觉得没必要让烦恼占太多时间。', partner:'LONE', partnerText:'你是唯一能让她露出笑容的那个人。', easter:false },
  'BOO!':{ code:'BOO!', role:'抚子', tag:'胆小鬼抚子', quote:'"别讲了别讲了别讲了——"', desc:'怕黑、怕鬼、怕怪谈。听到帐篷外有奇怪的声音会缩进睡袋最深处。但奇怪的是——为了给朋友拍夜景照，你可以一个人走半小时的黑暗山路。恐惧不会让你停下，你只是需要先尖叫一下。', partner:'MOM', partnerText:'她会一边说"真拿你没办法"一边陪你走夜路。', easter:false },
  CHEF:  { code:'CHEF',  role:'抚子', tag:'实验料理王',  quote:'"试试这个——巧克力放进咖喱里？还有这个熏制奶酪……"', desc:'你对料理没有边界感。锡纸包整颗蔬菜烤？甜酒曲奇？咖喱里放巧克力？你什么都敢试。有时候成功，有时候翻车，但翻车了你也会笑着吃完。你的厨房（或者说篝火旁）永远是最热闹的地方。', partner:'NOM', partnerText:'她负责吃，你负责做，完美循环。', easter:false },
  CHOO:  { code:'CHOO',  role:'抚子', tag:'铁道宅抚子',  quote:'"坐齿轨列车比露营还兴奋！露营只是顺便啦。"', desc:'你本来只是去露营，结果在途中迷上了Abt式齿轨列车、蒸汽机车、无人车站。你开始研究铁道时刻表，买印着铁道发明家头像的T恤。朋友说"我们不是来露营的吗"，你说"对啊，但你看这个列车——"', partner:'DRIVE', partnerText:'她开车，你坐电车，在不同的轨道上奔赴同一个方向。', easter:false },
  CHAOS: { code:'CHAOS', role:'千明', tag:'整活王千明',  quote:'"把自己打包成快递寄到露营地？我觉得可行！"', desc:'你就是野活部叫"整活部"的原因。你的脑洞没有边界，你的行动力也没有。你策划的露营计划永远包含至少一个离谱的环节，但最后总能莫名其妙地成功。朋友说你是"麻烦制造机"，你说"不，我是惊喜制造机"。', partner:'DASH', partnerText:'整活需要执行，你们就是彼此的加速器。', easter:false },
  WEEP:  { code:'WEEP',  role:'千明', tag:'爱哭鬼千明',  quote:'"呜呜呜这个露营场太棒了我好感动——"', desc:'你是嗓门最大的人，也是泪腺最浅的人。篝火旁聊着聊着突然哭了，看日出哭了，看到朋友偷偷给你准备的生日惊喜哭得更凶。你从不掩饰自己的情绪，哭完笑完，继续整活。', partner:'MOM', partnerText:'她会默默递纸巾，然后假装没看见你哭。', easter:false },
  BROKE: { code:'BROKE', role:'千明', tag:'穷鬼千明',  quote:'"700日元！买了个爹！"', desc:'你的露营装备几乎全是二手店淘的。你买过700日元的木碗（后来变成了仙人掌盆），用劣化吊床替代露营椅，自制的熏制器用纸箱做的。你不觉得穷是问题——你觉得穷是创意的催化剂。', partner:'CARB', partnerText:'两人一起逛二手店，互相怂恿"这个可以买"。', easter:false },
  DASH:  { code:'DASH',  role:'千明', tag:'热血笨蛋',  quote:'"迷路也是体验！反正会被救的——大概吧！"', desc:'你是那种想到什么就冲的人。先出发再查路线，先买了再说怎么用。你经常搞砸，但从不后悔。因为最棒的故事往往来自最离谱的意外。而且你有一个（或者好几个）无论如何都会来救你的朋友。', partner:'DRIVE', partnerText:'她会开车来救你。虽然嘴上骂你，但油门下得很稳。', easter:false },
  SEYANA:{ code:'SEYANA',role:'葵',  tag:'佛系葵',  quote:'"せやな～"', desc:'天塌下来？主打一个随缘。你是那个在所有人焦虑的时候说"まあ、なんとかなる"（总会有办法的）的人。你说话带着关西腔的慵懒，行动带着一种从容的节奏。不是不在乎，而是你知道——急也没用。', partner:'CHAOS', partnerText:'她是龙卷风，你是风眼。没有你，她早就把自己吹飞了。', easter:false },
  MOM:   { code:'MOM',   role:'葵',  tag:'老妈子葵',  quote:'"先把饭做好，热水烧好，然后你们再闹。"', desc:'你是野活组真正的幕后支柱。千明负责整活，你负责善后；抚子负责吃，你负责做。你记得每个人的口味，知道谁需要加衣服，在所有人疯完闹完之后，你已经默默把一切收拾好了。你从不说"我来照顾你们"，但每个人都知道你会的。', partner:'WEEP', partnerText:'她哭的时候，只有你知道什么时候该递纸巾，什么时候该假装没看见。', easter:false },
  BLUFF: { code:'BLUFF', role:'葵',  tag:'大话精葵',  quote:'"我跟你们说，上次我骑自行车……"', desc:'你的浓眉一挑，死鱼眼一翻，一段真假难辨的故事即将出口。你编故事的时候面不改色，细节丰富到让人怀疑"难道是真的？"——但谢天谢地，你从不拿重要的事开玩笑。你的谎言是野活组的保留节目。', partner:'TROLL', partnerText:'你们俩凑在一起，没人能分清哪句是真的。', easter:false },

// ============================================================
// STATE
// ============================================================
let shuffledQuestions = [];
let currentQ = 0;
let scores = {};
let questionOrder = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// SCREENS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  scores = {};
  currentQ = 0;
  // Select 25 questions from the 50-question bank
  const allIndices = shuffle([...Array(QUESTIONS.length).keys()]);
  const selectedIndices = allIndices.slice(0, 25);
  questionOrder = selectedIndices;
  shuffledQuestions = selectedIndices.map(i => QUESTIONS[i]);
  showScreen('quizScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = shuffledQuestions[currentQ];
  const total = shuffledQuestions.length;
  document.getElementById('progressFill').style.width = ((currentQ / total) * 100) + '%';
  document.getElementById('qCounter').textContent = `第 ${currentQ + 1} / ${total} 题`;
  document.getElementById('qText').textContent = q.text;
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  // Shuffle options for variety
  const labels = ['A','B','C','D'];
  const shuffled = q.options.map((opt, i) => ({...opt, origIdx: i}));
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = labels[i] + '. ' + opt.text;
    btn.addEventListener('click', () => selectOption(opt.origIdx));
    optsEl.appendChild(btn);
  });
}

function selectOption(idx) {
  const q = shuffledQuestions[currentQ];
  const opt = q.options[idx];
  
  // Visual feedback: highlight selected
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.style.pointerEvents = 'none');
  // Find the button that corresponds to this option
  const buttons = document.querySelectorAll('#options .option');
  for (const btn of buttons) {
    if (btn.textContent.includes(opt.text.substring(0, 10))) {
      btn.classList.add('selected');
      break;
    }
  }
  
  // Add scores
  for (const [key, val] of Object.entries(opt.scores)) {
    scores[key] = (scores[key] || 0) + val;
  }
  
  setTimeout(() => {
    currentQ++;
    if (currentQ >= shuffledQuestions.length) {
      showResult();
    } else {
      renderQuestion();
      document.getElementById('progressFill').style.width = ((currentQ / shuffledQuestions.length) * 100) + '%';
      document.getElementById('qCounter').textContent = `第 ${currentQ + 1} / ${shuffledQuestions.length} 题`;
    }
  }, 200);
}

// ============================================================
// MATCHING ALGORITHM
// ============================================================
function computeResult() {
  // Get all 22 main personalities sorted by score
  const mainKeys = Object.keys(PERSONALITIES).filter(k => !PERSONALITIES[k].easter);
  mainKeys.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
  
  // Get top 2, randomly pick one
  const top2 = mainKeys.slice(0, 2);
  const pick = top2[Math.floor(Math.random() * Math.min(2, top2.length))];
  
  // Check easter eggs: score >= 3 AND probabilistic chance
  // Easter triggers with probability = easterScore / (mainMax * 7)
  const mainMax = scores[top2[0]] || 0;
  const easterKeys = Object.keys(PERSONALITIES).filter(k => PERSONALITIES[k].easter);
  const qualified = easterKeys.filter(k => (scores[k] || 0) >= 3);
  
  if (qualified.length > 0 && mainMax > 0) {
    // Sort by score descending
    qualified.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
    // Check each qualified easter with probability
    for (const ek of qualified) {
      const prob = (scores[ek] || 0) / (mainMax * 7);
      if (Math.random() < prob) {
        return { key: ek, easter: true };
      }
    }
  }
  
  return { key: pick, easter: false };
}

function showResult() {
  const result = computeResult();
  const p = PERSONALITIES[result.key];
  const partner = PERSONALITIES[p.partner];
  
  showScreen('resultScreen');
  
  document.getElementById('easterTag').innerHTML = result.easter ? '<span class="easter-tag">🔒 隐藏人格解锁</span>' : '';
  document.getElementById('resultBadge').textContent = result.easter ? 'YCTI · 隐藏人格' : 'YCTI · 露营人格';
  document.getElementById('resultCode').textContent = p.code;
  document.getElementById('resultRole').textContent = p.tag;
  document.getElementById('resultQuote').textContent = p.quote;
  document.getElementById('resultDesc').textContent = p.desc;
  document.getElementById('resultPartner').innerHTML = 
    '最佳拍档：<strong>' + partner.code + '</strong> ' + partner.tag + '<br>' + p.partnerText;
  
  // Store for sharing
  window._resultData = { code: p.code, tag: p.tag, quote: p.quote, desc: p.desc, 
    partnerCode: partner.code, partnerTag: partner.tag, partnerText: p.partnerText, easter: result.easter };
}

function restartQuiz() {
  showScreen('startScreen');
}

// ============================================================
// SHARE (Canvas)
// ============================================================
function shareResult() {
  const d = window._resultData;
  if (!d) return;
  
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 720;
  
  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d0d1f');
  bg.addColorStop(0.4, '#141428');
  bg.addColorStop(1, '#1a1a35');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  const stars = [
    [48,40],[120,30],[200,55],[310,25],[420,38],
    [80,100],[180,70],[350,65],[440,90],
    [55,160],[280,140],[400,150]
  ];
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  stars.forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x, y, 1, 0, Math.PI * 2);
    ctx.fill();
  });
  // Brighter stars
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  [[120,30],[310,25],[180,70]].forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Top accent bar
  const accentGrad = ctx.createLinearGradient(0, 0, W, 0);
  accentGrad.addColorStop(0, '#e8a850');
  accentGrad.addColorStop(1, '#f4a261');
  ctx.fillStyle = accentGrad;
  ctx.fillRect(0, 0, W, 4);
  
  // Campfire
  ctx.font = '44px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🔥', 240, 72);
  
  // YCTI badge
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = '#e8a850';
  ctx.fillText(d.easter ? 'YCTI · 隐藏人格' : 'YCTI · 露营人格', 240, 110);
  
  // Easter tag
  if (d.easter) {
    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(232,168,80,.7)';
    ctx.fillText('🔒 隐藏人格解锁', 240, 132);
  }
  
  // Code - big and bold
  ctx.font = 'bold 60px sans-serif';
  ctx.fillStyle = '#e8a850';
  ctx.fillText(d.code, 240, 195);
  
  // Tag
  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#e8e0d8';
  ctx.fillText(d.tag, 240, 232);
  
  // Quote with decoration
  ctx.font = 'italic 14px sans-serif';
  ctx.fillStyle = '#9a8c7a';
  ctx.fillText('"', 100, 268);
  ctx.fillText(d.quote.replace(/^"|"$/g, ''), 240, 268);
  ctx.fillText('"', 380, 268);
  
  // Divider with gradient
  const divGrad = ctx.createLinearGradient(60, 0, 420, 0);
  divGrad.addColorStop(0, 'rgba(232,168,80,0)');
  divGrad.addColorStop(0.5, 'rgba(232,168,80,.5)');
  divGrad.addColorStop(1, 'rgba(232,168,80,0)');
  ctx.strokeStyle = divGrad;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(60, 295);
  ctx.lineTo(420, 295);
  ctx.stroke();
  
  // Description - wrap text in a card-like area
  ctx.fillStyle = 'rgba(30,30,56,.8)';
  roundRect(ctx, 30, 310, 420, 0, 12);
  ctx.font = '13px "PingFang SC", "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#e8e0d8';
  ctx.textAlign = 'left';
  const words = d.desc.split('');
  const lines = [];
  let line = '';
  const maxWidth = 380;
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i];
    if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = words[i];
    } else {
      line = testLine;
    }
  }
  if (line) lines.push(line);
  
  const descHeight = lines.length * 24 + 40;
  ctx.fillStyle = 'rgba(30,30,56,.8)';
  roundRect(ctx, 30, 310, 420, descHeight, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(51,51,80,.5)';
  ctx.lineWidth = 1;
  roundRect(ctx, 30, 310, 420, descHeight, 12);
  ctx.stroke();
  
  ctx.fillStyle = '#e8e0d8';
  let y = 340;
  lines.forEach(l => {
    ctx.fillText(l, 50, y);
    y += 24;
  });
  
  y = 310 + descHeight + 24;
  
  // Partner section
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#e8a850';
  ctx.fillText('最佳拍档', 240, y);
  y += 28;
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText(d.partnerCode + '  ' + d.partnerTag, 240, y);
  y += 28;
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#9a8c7a';
  ctx.fillText(d.partnerText, 240, y);
  
  // Bottom
  ctx.font = '10px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.fillText('YCTI · Yuru Camp Type Indicator', 240, 680);
  ctx.fillText('测试结果仅供娱乐 · 图一乐', 240, 696);
  
  // Download
  const link = document.createElement('a');
  link.download = 'YCTI_' + d.code + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  
  showToast('图片已保存！');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
